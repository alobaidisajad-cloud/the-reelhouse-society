<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rye&family=La+Belle+Aurore&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap');

body { margin: 0; background: #000; overflow: hidden; }
.viewport { width: 1080px; height: 1920px; position: relative; background: #080808; }

/* The physical Nitrate environment */
.noise { 
  position: absolute; inset: 0; z-index: 100; opacity: 0.15; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); 
  mix-blend-mode: overlay; 
}
.vignette {
  position: absolute; inset: 0; z-index: 90; pointer-events: none;
  box-shadow: inset 0 0 300px rgba(0,0,0,0.9), inset 0 0 100px rgba(0,0,0,1);
}

/* 1. Intro Sequence */
.intro { 
  position: absolute; inset: 0; z-index: 50; background: #000; 
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  animation: fadeOut 1.5s ease 2.5s forwards; 
}
.intro-logo { 
  width: 180px; opacity: 0; filter: sepia(1) saturate(2); 
  animation: fadeIn 2s forwards 0.5s; margin-bottom: 50px;
}
.intro-text { 
  font-family: 'Rye', serif; color: #cab171; font-size: 70px; opacity: 0; 
  animation: fadeInType 1s forwards 1s; letter-spacing: 0.1em;
}

/* 2. Core Showcase Architecture */
.scene { 
  position: absolute; inset: 0; opacity: 0; z-index: 10; 
  display: flex; flex-direction: column; align-items: center; justify-content: center; 
}
.scene-1 { animation: scenePlay 3s ease 3s forwards; }
.scene-2 { animation: scenePlay 3s ease 6s forwards; }
.scene-3 { animation: scenePlay 3s ease 9s forwards; }
.scene-4 { animation: scenePlay 3s ease 12s forwards; }

.app-screenshot { 
  width: 780px; border-radius: 45px; 
  box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.1);
  filter: sepia(0.2) saturate(1.1) brightness(0.9); 
  border: 1px solid rgba(255,255,255,0.05);
  animation: slowZoom 3s ease-out forwards; 
}

.scene-text-box {
  position: absolute; bottom: 150px; 
  background: rgba(0,0,0,0.85); padding: 30px 60px; 
  border: 1px solid rgba(202, 177, 113, 0.3);
  box-shadow: 0 20px 40px rgba(0,0,0,0.9);
  animation: slideUpFade 1s forwards cubic-bezier(0.16, 1, 0.3, 1);
}
.scene-text { 
  font-family: 'Courier Prime', monospace; font-size: 38px; 
  color: #cab171; letter-spacing: 0.15em; font-weight: bold;
}

/* 3. Outro */
.outro { 
  position: absolute; inset: 0; z-index: 60; background: #050505; opacity: 0; 
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  animation: fadeIn 1s forwards 15s; 
}
.outro-title {
  font-family: 'Rye', serif; color: #cab171; font-size: 85px; letter-spacing: 5px; 
  text-transform: uppercase; margin-bottom: 20px;
}
.outro-sub {
  font-family: 'Courier Prime', monospace; color: #a48143; font-size: 32px; 
  letter-spacing: 8px; text-transform: uppercase;
}
.outro-signature {
  position: absolute; bottom: 80px;
  font-family: 'La Belle Aurore', cursive; color: #fff; opacity: 0.4;
  font-size: 64px; transform: rotate(-3deg);
}

/* Kinetics Engine */
@keyframes slowZoom { 
  0% { transform: scale(1.02) translateY(30px); } 
  100% { transform: scale(1.08) translateY(-30px); } 
}
@keyframes scenePlay { 
  0% { opacity: 0; filter: blur(10px); } 
  15% { opacity: 1; filter: blur(0px); } 
  85% { opacity: 1; filter: blur(0px); } 
  100% { opacity: 0; filter: blur(20px); } 
}
@keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes fadeInType { 
  0% { opacity: 0; transform: translateY(30px); } 
  100% { opacity: 1; transform: translateY(0); } 
}
@keyframes slideUpFade {
  0% { opacity: 0; transform: translateY(40px); }
  100% { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="viewport">
  <div class="noise"></div>
  <div class="vignette"></div>
  
  <div class="intro">
    <img class="intro-logo" src="public/reelhouse-logo-transparent.png" onerror="this.src='public/reelhouse-logo.svg'">
    <div class="intro-text">NATIVE APP DECLASSIFIED</div>
  </div>

  <div class="scene scene-1">
    <img class="app-screenshot" src="C:/Users/OMEN/.gemini/antigravity/brain/467cb4ae-6abc-4eb7-9674-afdb9d976be8/media__1776471600988.png">
    <div class="scene-text-box"><div class="scene-text">I. LOG YOUR CINEMA</div></div>
  </div>
  
  <div class="scene scene-2">
    <img class="app-screenshot" src="C:/Users/OMEN/.gemini/antigravity/brain/467cb4ae-6abc-4eb7-9674-afdb9d976be8/media__1776471673601.png">
    <div class="scene-text-box"><div class="scene-text">II. SUBMIT DOSSIERS</div></div>
  </div>
  
  <div class="scene scene-3">
    <img class="app-screenshot" src="C:/Users/OMEN/.gemini/antigravity/brain/467cb4ae-6abc-4eb7-9674-afdb9d976be8/media__1776471706299.png">
    <div class="scene-text-box"><div class="scene-text">III. BUILD THE STACKS</div></div>
  </div>
  
  <div class="scene scene-4">
    <img class="app-screenshot" src="C:/Users/OMEN/.gemini/antigravity/brain/467cb4ae-6abc-4eb7-9674-afdb9d976be8/media__1776471721114.png">
    <div class="scene-text-box"><div class="scene-text">IV. INFILTRATE THE LOUNGE</div></div>
  </div>

  <div class="outro">
    <div class="outro-title">ARRIVING SHORTLY</div>
    <div class="outro-sub">The Society Requires You</div>
    <div class="outro-signature">April 2026</div>
  </div>
</div>
</body>
</html>
