<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 1 — Declassified</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Courier+Prime&family=Bungee+Shade&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #0B0A08;
    --parchment: #EDE5D8;
    --sepia: #C4961A;
    --soot: #0E0D0A;
    --flicker: #F8F0C0;
    --blood-reel: #6B1A0A;
    --ash: #2A2118;
    --bone: #C8B99A;
    --fog: #6B6055;
  }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: var(--ink);
    font-family: 'Courier Prime', monospace;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: linear-gradient(155deg, #1a150e 0%, #0B0A08 35%, #12100b 60%, #0B0A08 100%);
  }

  /* ── FILM GRAIN (from the actual app) ── */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 156px 156px;
  }

  /* ── VIGNETTE (from the actual app) ── */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse 85% 80% at center,
      transparent 35%,
      rgba(0,0,0,0.35) 65%,
      rgba(0,0,0,0.8) 100%);
  }

  /* ── SCAN LINES (from the actual app) ── */
  .scanlines {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: repeating-linear-gradient(0deg,
      transparent, transparent 2px,
      rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
  }

  /* ── AGED BORDER ── */
  .aged-border {
    position: absolute;
    inset: 24px;
    z-index: 5;
    border: 1px solid rgba(200, 185, 154, 0.12);
    pointer-events: none;
  }
  .aged-border::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(200, 185, 154, 0.06);
  }

  /* ── CORNER MARKS ── */
  .corner { position: absolute; width: 35px; height: 35px; z-index: 6; pointer-events: none; opacity: 0.35; }
  .corner.tl { top: 20px; left: 20px; border-top: 2px solid var(--sepia); border-left: 2px solid var(--sepia); }
  .corner.tr { top: 20px; right: 20px; border-top: 2px solid var(--sepia); border-right: 2px solid var(--sepia); }
  .corner.bl { bottom: 20px; left: 20px; border-bottom: 2px solid var(--sepia); border-left: 2px solid var(--sepia); }
  .corner.br { bottom: 20px; right: 20px; border-bottom: 2px solid var(--sepia); border-right: 2px solid var(--sepia); }

  /* ── CONTENT ── */
  .content {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 80px;
    text-align: center;
  }

  /* ── OFFICIAL MASTER LOGO ── */
  .logo {
    width: 180px;
    height: auto;
    margin-bottom: 50px;
    filter: drop-shadow(0 0 50px rgba(196, 150, 26, 0.3));
  }

  /* ── DECLASSIFIED STAMP ── */
  .stamp {
    font-family: 'Special Elite', cursive;
    font-size: 16px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--blood-reel);
    border: 2.5px solid var(--blood-reel);
    padding: 10px 32px;
    transform: rotate(-2.5deg);
    margin-bottom: 55px;
    position: relative;
    opacity: 0.9;
  }
  .stamp::after {
    content: '';
    position: absolute;
    inset: -3px;
    border: 1px solid var(--blood-reel);
    opacity: 0.3;
  }

  /* ── TITLE (Rye — the actual app display font) ── */
  .title {
    font-family: 'Rye', serif;
    font-size: 54px;
    color: var(--parchment);
    line-height: 1.2;
    text-shadow: 0 3px 25px rgba(0,0,0,0.7);
    margin-bottom: 20px;
    letter-spacing: 0.02em;
  }
  .title em {
    font-style: normal;
    color: var(--sepia);
  }

  /* ── SUBTITLE (Special Elite — the actual app sub font) ── */
  .subtitle {
    font-family: 'Special Elite', cursive;
    font-size: 20px;
    color: var(--bone);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 55px;
    opacity: 0.8;
  }

  /* ── DIVIDER (gold gradient like the app) ── */
  .divider {
    width: 180px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--sepia), transparent);
    margin-bottom: 28px;
  }

  /* ── FOOTER (Courier Prime — the actual app body font) ── */
  .footer {
    font-family: 'Courier Prime', monospace;
    font-size: 13px;
    color: var(--fog);
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  /* ── BUSTER THE GHOST — barely visible, lurking in corner ── */
  .buster {
    position: absolute;
    bottom: 50px;
    right: 55px;
    z-index: 11;
    opacity: 0.035;
    transform: rotate(5deg);
    filter: brightness(0.5);
  }
</style>
</head>
<body>
<div class="canvas">
  <!-- Texture layers (same as the actual app) -->
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="aged-border"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Content -->
  <div class="content">
    <!-- OFFICIAL MASTER LOGO — same file as nav bar -->
    <img class="logo" src="../reelhouse-logo-transparent.png" alt="The ReelHouse Society">

    <div class="stamp">Declassified</div>

    <h1 class="title">Facts About<br><em>The ReelHouse<br>Society</em></h1>

    <p class="subtitle">Swipe to uncover the truth →</p>

    <div class="divider"></div>

    <p class="footer">Est. 1924 — Paris</p>
  </div>

  <!-- OFFICIAL BUSTER — exact SVG from Buster.tsx, neutral mood -->
  <svg class="buster" viewBox="0 0 100 140" width="100" height="140" xmlns="http://www.w3.org/2000/svg">
    <!-- Ghostly body -->
    <path d="M 10 55 Q 10 10 50 10 Q 90 10 90 55 L 90 100 Q 82 90 74 100 Q 66 110 58 100 Q 50 90 42 100 Q 34 110 26 100 Q 18 90 10 100 Z" fill="#E8DFC8" opacity="0.92"/>
    <!-- Ghost glow -->
    <path d="M 10 55 Q 10 10 50 10 Q 90 10 90 55 L 90 100 Q 82 90 74 100 Q 66 110 58 100 Q 50 90 42 100 Q 34 110 26 100 Q 18 90 10 100 Z" fill="none" stroke="rgba(242,232,160,0.15)" stroke-width="3"/>
    <!-- Eyes -->
    <ellipse cx="38" cy="52" rx="6" ry="7" fill="#0A0703"/>
    <ellipse cx="62" cy="52" rx="6" ry="7" fill="#0A0703"/>
    <!-- Pupils -->
    <circle cx="40" cy="50" r="2" fill="white"/>
    <circle cx="64" cy="50" r="2" fill="white"/>
    <!-- Mouth with teeth -->
    <path d="M 34 68 Q 50 80 66 68" stroke="#0A0703" stroke-width="2.5" fill="none"/>
    <rect x="40" y="68" width="4" height="5" fill="#0A0703" rx="0.5"/>
    <rect x="46" y="69" width="4" height="6" fill="#0A0703" rx="0.5"/>
    <rect x="52" y="68" width="4" height="5" fill="#0A0703" rx="0.5"/>
    <rect x="58" y="67" width="3" height="4" fill="#0A0703" rx="0.5"/>
  </svg>
</div>
</body>
</html>
