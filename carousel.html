<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Rye&family=Mrs+Saint+Delafield&display=swap');

  * { box-sizing: border-box; }
  
  body, html {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1080px;
    background-color: #060504; /* Nearly pitch black with a hint of warm brown */
    font-family: 'Courier Prime', monospace;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
  }

  /* Ghostly App Screenshot Background */
  #bg-image-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  #bg-image {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.20;
    /* Feather edges heavily so it fades into darkness */
    -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 85%);
    mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 85%);
    mix-blend-mode: screen;
  }

  /* Distressed Textures */
  .texture {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.9\' numOctaves=\'4\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E');
    opacity: 0.10;
    z-index: 10;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* Heavy Vignette */
  .vignette {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.95) 100%);
    z-index: 11;
    pointer-events: none;
  }

  /* Grunge Borders */
  .border {
    position: absolute;
    top: 20px; left: 20px; right: 20px; bottom: 20px;
    border: 1px solid rgba(80, 70, 50, 0.2);
    z-index: 12;
    pointer-events: none;
  }
  .border::before {
    content: ''; position: absolute;
    top: 5px; left: 5px; right: 5px; bottom: 5px;
    border: 1px solid rgba(0, 0, 0, 0.5);
  }

  /* Top Section: Logo, Tag, Title, Subtitle */
  .top-section {
    position: relative;
    z-index: 20;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 180px;
  }

  #logo {
    width: 80px;
    height: auto;
    margin-bottom: 25px;
    opacity: 0.7;
  }

  #tag {
    font-family: 'Courier Prime', monospace;
    color: #6b6356;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 30px;
    font-weight: 700;
  }

  #title {
    font-family: 'Rye', serif;
    color: #c2a65d; /* Muted gold */
    font-size: 38px;
    letter-spacing: 3px;
    margin-bottom: 20px;
    text-shadow: 2px 2px 5px rgba(0,0,0,1);
  }

  #subtitle {
    font-family: 'Courier Prime', monospace;
    color: #5c564a;
    font-size: 18px;
    font-style: italic;
    letter-spacing: 1px;
  }

  /* Middle Section (for the quote in Slide 1) */
  .middle-section {
    position: relative;
    z-index: 20;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-grow: 1;
  }

  /* Bottom Section: Quote */
  .quote-section {
    position: relative;
    z-index: 20;
    width: 70%;
    text-align: center;
    margin-bottom: 150px;
  }

  #quote {
    font-family: 'Courier Prime', monospace;
    color: #8c8273;
    font-size: 22px;
    font-style: italic;
    line-height: 1.8;
    text-shadow: 2px 2px 4px rgba(0,0,0,1);
  }

  /* Footer Layout */
  .footer {
    position: absolute;
    bottom: 50px;
    left: 50px;
    right: 50px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 20;
  }

  .footer-left {
    font-family: 'Courier Prime', monospace;
    color: #3b362f;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .footer-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Mrs Saint Delafield', cursive;
    color: #2e2a24; /* Very dark, barely visible handwritten */
    font-size: 42px;
    margin-bottom: -10px;
  }

  .footer-right {
    font-family: 'Courier Prime', monospace;
    color: #4f483e;
    font-size: 20px;
  }

</style>
</head>
<body>

  <!-- App Screenshot Container -->
  <div id="bg-image-container">
    <div id="bg-image"></div>
  </div>
  
  <div class="texture"></div>
  <div class="vignette"></div>
  <div class="border"></div>

  <div class="top-section">
    <img id="logo" src="file:///C:/Users/OMEN/OneDrive/Desktop/divisionops/reelhouse/dist/reelhouse-logo.svg" alt="ReelHouse" />
    <div id="tag">PROJECTION NO. 01</div>
    <div id="title">I. The Lobby</div>
    <div id="subtitle">The weekly feature. Decreed by the Committee.</div>
  </div>

  <div class="middle-section">
    <!-- Empty space for the ghosted image to shine through -->
  </div>

  <div class="quote-section">
    <div id="quote">"They have not been wrong since 1924. Allegedly."</div>
  </div>

  <div class="footer">
    <div class="footer-left">THE REELHOUSE SOCIETY ARCHIVES</div>
    <div class="footer-center">September 1924</div>
    <div id="counter" class="footer-right">1/5</div>
  </div>

  <script>
    function setSlideData(slideNum, bgImagePath, tagText, title, subtitle, quote) {
      document.getElementById('counter').innerText = slideNum + '/5';
      
      const bgElement = document.getElementById('bg-image');
      if (bgImagePath) {
        bgElement.style.backgroundImage = `url('${bgImagePath}')`;
        bgElement.style.display = 'block';
      } else {
        bgElement.style.display = 'none';
      }

      document.getElementById('tag').innerText = tagText;
      document.getElementById('title').innerText = title;
      document.getElementById('subtitle').innerText = subtitle;
      
      const quoteEl = document.getElementById('quote');
      if (quote) {
        quoteEl.innerText = `"${quote}"`;
        quoteEl.style.display = 'block';
      } else {
        quoteEl.style.display = 'none';
      }

      // Hide image on slide 1
      if (slideNum === 1) {
        document.getElementById('bg-image-container').style.display = 'none';
        document.getElementById('logo').style.marginBottom = '60px';
      } else {
        document.getElementById('bg-image-container').style.display = 'flex';
      }
    }
  </script>
</body>
</html>
