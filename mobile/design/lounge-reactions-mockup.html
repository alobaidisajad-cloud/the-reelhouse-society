<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Lounge — reactions</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Spectral:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap');
  @import url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css');
  body{margin:0;background:#161310;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px;padding:34px 16px;font-family:'Inter',sans-serif}
  .cap{color:#C2B492;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
  .panel{width:340px;background:#0A0906;border:1px solid #2A2118;border-radius:20px;overflow:hidden}
  .panel *{box-sizing:border-box}
  .ti{vertical-align:middle}
  .av{width:26px;height:26px;border-radius:50%;background:#14120D;border:1px solid rgba(184,137,26,0.3);display:flex;align-items:center;justify-content:center;color:#9E9488;font-family:'Rye';font-size:12px;flex-shrink:0}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:14px;border:1px solid #3a2d12;font-size:11px;color:#C2B492}
  .chip.on{background:rgba(184,137,26,0.12);border-color:rgba(184,137,26,0.5);color:#F0E8B0}
  .pick{flex:1;text-align:center}
  .pick .ti{font-size:24px}
  .pick div{font-size:8px;color:#7d776f;margin-top:6px;letter-spacing:1px}
</style>
</head>
<body>

  <div class="cap">Reactions · on a dispatch</div>
  <div class="panel" style="padding:16px">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
      <div class="av">M</div><span style="font-family:'Inter';font-size:11px;letter-spacing:.5px;color:#C2B492">mara_v</span><span style="font-size:10px;color:#6b655f">9:14</span>
    </div>
    <p style="margin:0 0 0 35px;font-family:'Spectral',serif;font-size:14.5px;line-height:1.55;color:#E8DFD0">Tarkovsky on a rainy Sunday is the closest thing I have to church.</p>
    <div style="display:flex;gap:7px;margin:11px 0 0 35px">
      <span class="chip on"><i class="ti ti-star"></i> 3</span>
      <span class="chip"><i class="ti ti-flame"></i> 2</span>
      <span class="chip"><i class="ti ti-thumb-down" style="color:#a8503f"></i> 1</span>
      <span class="chip" style="color:#6b655f"><i class="ti ti-plus"></i></span>
    </div>
  </div>

  <div class="cap">The reaction set (long-press)</div>
  <div class="panel" style="padding:20px 18px">
    <div style="display:flex;justify-content:space-between">
      <div class="pick"><i class="ti ti-star" style="color:#B8891A"></i><div>BRAVO</div></div>
      <div class="pick"><i class="ti ti-heart" style="color:#B8891A"></i><div>ADORED</div></div>
      <div class="pick"><i class="ti ti-flame" style="color:#B8891A"></i><div>RIVETING</div></div>
      <div class="pick"><i class="ti ti-quote" style="color:#B8891A"></i><div>QUOTED</div></div>
      <div class="pick"><i class="ti ti-thumb-down" style="color:#a8503f"></i><div>PANNED</div></div>
    </div>
  </div>
  <div class="cap" style="text-transform:none;letter-spacing:0;max-width:340px;text-align:center;line-height:1.6;color:#9E9488">Praise: Bravo · Adored · Riveting · Quoted (sepia). Critique: Panned (blood). On-theme, balanced, no slang.</div>

</body>
</html>
