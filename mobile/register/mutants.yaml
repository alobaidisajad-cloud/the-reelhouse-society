    class: CI-tool-hides-its-cause
    source: shape
    edits:
      - file: scripts/secrets-planted.cjs
        find: |-
          if (!existsSync(report)) { console.error(`gitleaks wrote no report (exit ${run.status}): ${`${run.stderr}${run.stdout}`.trim()}`); process.exit(1); }
        replace: |-
          if (!existsSync(report)) { console.error('gitleaks wrote no report'); process.exit(1); }
    proof: { file: src/utils/__tests__/aFailedToolSaysWhy.guard.test.ts, test: "hears what every program it runs says, unless it names why not" }

