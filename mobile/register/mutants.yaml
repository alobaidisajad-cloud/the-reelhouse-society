# The mutants that prove every guard (WORKLIST P0.66, P0.67, P0.69). scripts/mutants.cjs runs them by
# the kill rules; everyMutantIsSound holds each entry to its class and its test. A class still open in
# production keeps its mutants in the private file.
#
#   past:  the class's past fix reversed (commit, files); once it no longer reverses, `edits` written
#          once by hand stand in its place, under the same id.
#   shape: a new shape of the mistake: a file planted into a real folder (plant), or a real file changed (edits).
#   judge: an E2E judge fed a bad log, made from a good one by edits.
mutants:
  - id: past-arrival-easing-key
    class: MOTION-empty-config-key
    source: past
    commit: c56597db
    files: [src/hooks/useArrival.ts]
    # The fix no longer reverses (ef697e38 rewrote the line); this puts the same key back by hand.
    edits:
      - file: src/hooks/useArrival.ts
        find: "withTiming(1, easing\n      ? { duration, easing, reduceMotion: ReduceMotion.System }\n      : { duration, reduceMotion: ReduceMotion.System }));"
        replace: "withTiming(1, { duration, easing, reduceMotion: ReduceMotion.System }));"
    proof: { file: src/utils/__tests__/animationConfigsAreLiterals.guard.test.ts, test: "reads every animation config in the app, and each is a literal whose keys all hold a value" }

  - id: past-abort-signal-timeout
    class: RUNTIME-api-missing-on-phone
    source: past
    commit: 11b420f1
    files: [src/utils/withTimeout.ts]
    proof: { file: src/utils/__tests__/runtimeLacks.guard.test.ts, test: "no file in app/ or src/ uses an API the phone lacks" }

  - id: past-psql-reason-dropped
    class: CI-tool-hides-its-cause
    source: past
    commit: 13b1cce8
    files: [scripts/check-backend-live.mjs]
    # The fix no longer reverses (the file grew around it); this puts one report back as it was.
    edits:
      - file: scripts/check-backend-live.mjs
        find: |-
              console.warn(`⚠ RPC check skipped — psql could not connect:\n    ${why(e)}`);
        replace: |-
              console.warn(`⚠ RPC check skipped (psql failed): ${e.message.split('\n')[0]}`);
    proof: { file: src/utils/__tests__/aFailedToolSaysWhy.guard.test.ts, test: "reports a failed run or fetch by its cause, never by Node's first line alone" }

  - id: shape-fetch-cause-dropped
    class: CI-tool-hides-its-cause
    source: shape
    edits:
      - file: scripts/check-backend-live.mjs
        find: |-
              console.warn(`⚠ anon posture check skipped (fetch failed): ${e.message}${e.cause ? ` — ${e.cause.code ?? e.cause.message}` : ''}`);
        replace: |-
              console.warn(`⚠ anon posture check skipped (fetch failed): ${e.message}`);
    proof: { file: src/utils/__tests__/aFailedToolSaysWhy.guard.test.ts, test: "reports a failed run or fetch by its cause, never by Node's first line alone" }

