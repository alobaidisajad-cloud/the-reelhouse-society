      - { kind: static, file: e2e/__tests__/aJobThatEndsItselfIsState.test.ts, test: "takes off the schedule, in a function, each job a function puts on it" }
      - { kind: static, file: e2e/__tests__/aJobThatEndsItselfIsState.test.ts, test: "each script that compares the schedule takes the rule; the others are judged" }
