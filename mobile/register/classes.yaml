      - { kind: static, file: e2e/__tests__/functionsWorld.test.ts, test: "points each outside address a function reads from its settings at the stand-ins" }
      - { kind: static, file: e2e/__tests__/functionsWorld.test.ts, test: "finds no fetch of a fixed outside address the settings cannot move" }
    fix: "the functions world (db-integration.yml, job functions): every deployed function (scripts/edge-functions.cjs) served from its one home as deployed, on production's shape with the pending migrations; each outside address (EXPO_PUSH_URL, REVENUECAT_API_URL, TMDB_ORIGIN, FEED_ORIGIN; production's own by default) pointed at e2e/functions/stand-ins.mjs, which keeps every request; suites.mjs asks each function as its callers do, and the database's own push through pg_net. Before it, the sealed world served one production function and a TMDB stand-in"
    places: [none]

