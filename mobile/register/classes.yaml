    fix: "scripts/jobs-that-end-themselves.cjs holds one rule, read from the house's own code: a job named in quotes by a statement of a function's body that calls pg_cron is put on and taken off the schedule by the house itself, and whether it stands is state. up-down-up.mjs and schema-snapshot.mjs both read the schedule less those jobs (the snapshot would otherwise record a job caught mid-work, and a copy built from it run it every second with none of the rows its work reads); a job left on the schedule when its function is gone is read as schema again, so an undo that forgets it is still caught. up-down-up's self-test plants, in a scratch database with a schedule kept as pg_cron keeps one, a job that ends its work during the migration (passes) and an undo that leaves its job standing with its function gone (caught). Proven on a lab copy (lk15_empty with 20261122_00/_01, a stand-in schedule running each '1 seconds' job every second, 2,500 members): with the members' lists finishing between car 66's readings, the old check refused car 66's undo and the new one passed all 30 cars. A finder reads the house as production will hold it: each pg_cron call in a function names its job in quotes, each job a function puts on a function also takes off, and each script that reads cron.job takes the rule or is judged (train-locks.mjs watches a job to its end, as state) (mutants shape-the-undo-check-reads-every-job-as-schema, shape-the-snapshot-reads-every-job-as-schema, shape-a-pg-cron-call-naming-no-job-passed-over, shape-a-job-found-by-its-name-read-as-unnamed, shape-a-job-put-on-for-good-passed-over)"
