    area: navigation
    status: OPEN
    count: 1
    source: { kind: history, ref: "the route walk, runs 39614962131 and 39614969442: /auth-callback opened on the profile; Sealed E2E 39642840944: the Tribunal's link, 118 ms after a relaunch, lost and the profile reopened" }
    methods:
      - { kind: static, file: plugins/__tests__/withLinkDuringLaunch.test.ts, test: "keeps each new intent as the activity's own, then hands it on, first in the class" }
      - { kind: running, file: src/utils/__tests__/aMemberBackSoonIsBackWhereTheyWere.test.ts, test: "reopens the tab only for a launch that names no page" }
      - { kind: running, file: src/utils/__tests__/aMemberBackSoonIsBackWhereTheyWere.test.ts, test: "names the page a launch link names, and none for the app or the site alone" }
      - { kind: static, file: src/utils/__tests__/aMemberBackSoonIsBackWhereTheyWere.test.ts, test: "the tab bar remembers each tab as it is shown, stamps the time as the app leaves, and reopens only a launch that began at the Lobby, by no link that names a page" }
    fix: "the tab bar reads the launch link itself (Linking.getInitialURL) and reopens the last tab only when that link names no page (lastTab.ts pageOfLaunch, tabToReopenAfter), and only a member still on the Lobby once it is read (the admin flow's relaunch, 2026-10-21: a link opened just after launch was pulled back to the last tab); each reopen or its absence is said to the E2E log (tabs.reopen) so the route walk shows which it was (mutant shape-every-link-names-nothing); and a link that reaches the app before React is up, which React Native drops, is the link the app opens: MainActivity keeps each new intent as its own (plugins/withLinkDuringLaunch.js), so Linking.getInitialURL reads the latest (mutant shape-new-intent-not-kept)"
