    source: { kind: reviewer, ref: "car 07's undo check on a copy of production's shape, 2026-10-16: 96 function bodies with CRLF" }
    fix: ".gitattributes keeps every migration, undo and rehearsal LF; theLineEndsChangeNoFunction.guard.test.ts holds the files LF on the checkout and no CR inside production's quoted text but JSON (none is); up-down-up.mjs compares with line ends taken off, its self-test catching a changed body. The 96 bodies keep their CRs, which change nothing"

