e the seat by the standing the room acts on, never the roster rows alone: a seated member before the roster is read is told it is being read, after a failed read that it could not be, with TRY AGAIN, and is offered STEP OUT; a standing not yet known is never told it is a guest (mutant shape-unread-roster-said-kept-from-the-seated); round 13: the house's summary that could not be read is kept unread and the Projector says THE RECORD COULD NOT BE READ with TRY AGAIN, which asks the summary alone and says ASKING… until it answers; the run is counted over the records held only against a count the house answered on this read (mutants shape-summary-failure-taken-as-none, shape-run-counted-from-a-part, shape-run-counted-with-no-count, shape-retry-reads-the-whole-file, shape-retry-unsaid-while-asking); and, folded in: a count is said only once it is known (NOT REACHED, a tab named without one while asked), and the salon counts the seated as the house does, from the roster only for one who reads it whole (mutants shape-unknown-count-said-zero, shape-unreached-tab-counted, shape-salon-counts-its-roster); the archive's film search is counted by the house, the hidden left out (mutant shape-archive-counted-from-its-rows); the salon sheet draws the roster only for the host and the seated, muted too; anyone else is told the salon's own count and \"The roster is kept for those seated.\", and offered STEP OUT only of a row they hold (mutants shape-guest-told-their-rows-as-the-count, shape-guest-offered-step-out); an open ballot marked by the member draws the running count the house gives a voter (ballot_tally, 20261117_01), read when the vote lands and when a ballot they voted in opens; until it is read the ballot says YOUR BALLOT IS CAST and prints no number, never 0 BALLOTS CAST (mutants shape-open-ballot-counted-as-none, shape-cast-ballot-count-unread); a bulk dismissal says the cases the house closed, never the number selected, and the ones another moderator judged meanwhile apart; with no count in the answer no number is said (mutant shape-bulk-dismissal-counts-the-selected); the search says one number for each section, its own: exact once the source has no more, N+ while it holds a next page, drawn and spoken; ALL is a sampler, each section under a head that carries its count and opens its tab, with no count line beside the badges (mutant shape-search-count-said-as-a-total); and, folded in: followUser shows a request or a follow only when it is known which (the member's file says), and with nothing known shows nothing until the house answers (mutant shape-request-shown-as-follow); FOLLOW reads back the row the house filed: a follow filed as a request (the member turned private while their file was open), or a request already standing, reads REQUESTED, the handle known private, the follower count left as it was (mutants shape-follow-filed-as-request-shown-following, shape-follow-filed-as-request-counted); and, folded in: the foot ends on the house's own word that no page follows (critiquesHasMore), counting against every critique read (mutant shape-foot-counts-past-the-house); the door's count leaves out the members the door leaves out (mutant shape-door-counts-the-hidden); a filing's critiques foot tells a visitor THE CRITIQUES ARE READ BY MEMBERS / SIGN IN TO READ THEM, never an end or a MORE under critiques the house does not send them (mutant shape-visitor-foot-drawn-as-a-members); a record's critique count on a card and in a film's Log Archive is the reader's own (critiques_seen, a computed field of logs: log_counts' number less the critiques of members the reader hides, 20261117_01, the feed functions too), as the record's page counts them (mutant shape-archive-critiques-counted-for-every-reader); and, folded in: the door caps the days at what is needed, as it caps the films: 2 OF 2 (useDoor; mutant shape-door-days-past-their-measure)"
