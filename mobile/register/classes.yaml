  - id: E2E-push-tap-unproven
    title: "A push tapped is proven only with a notice the phone's shell posts (adb shell cmd notification post), which belongs to com.android.shell and never reaches the app's tap handler, so a tap that opens nothing, or the wrong screen, passes"
    seriousness: behaviour
    area: tests
    status: OPEN
    count: 1
    source: { kind: reviewer, ref: "P4.22, P4.26" }
    methods:
      - { kind: running, file: src/utils/__tests__/aPushIsPresentedAsTheAppsOwn.test.ts, test: "presents the message as notify-push built it, in its own channel, in the E2E build" }
      - { kind: running, file: src/utils/__tests__/aPushIsPresentedAsTheAppsOwn.test.ts, test: "presents nothing for a link with no message, or one that is not a message" }
      - { kind: running, file: src/utils/__tests__/aPushIsPresentedAsTheAppsOwn.test.ts, test: "opens the Lobby behind the notice it presents, in the E2E build" }
      - { kind: running, file: src/utils/__tests__/aPushIsPresentedAsTheAppsOwn.test.ts, test: "answers the link in no other build: nothing presented, the address left as it came" }
      - { kind: running, file: e2e/__tests__/pushPresent.test.ts, test: "waits for the room as the app marks it: a member's file, a log, a salon, the notices sheet" }
      - { kind: running, file: e2e/__tests__/pushPresent.test.ts, test: "sends every kind a push flow taps, and every push flow taps a kind it sends" }
      - { kind: running, file: e2e/__tests__/thePushedPhoneRegistersAsTheAppDoes.test.ts, test: "signs in as the member and registers the phone's token under that session, as the app does" }
      - { kind: running, file: e2e/__tests__/thePushedPhoneRegistersAsTheAppDoes.test.ts, test: "stops the run when the token does not stand under a session the house still holds" }
      - { kind: running, file: e2e/__tests__/thePushedPhoneRegistersAsTheAppDoes.test.ts, test: "stops the run when the house refuses the registration, or the member cannot sign in to make it" }
    fix: "the E2E build alone answers reelhouse://e2e/present?message=…: the message notify-push sent to the Expo stand-in is presented through expo-notifications with its own title, body, data and channel (e2ePresent), so it is the app's own notice and its tap reaches setupNotificationResponseHandler; every other build reads the address as one it does not have. notify-push is served in the sealed world, its messages kept by the stand-in; the flows tap each from the shade by its title line (presented with its sound, as a delivered push alerts) and wait for the route mark of the room it must open: a follow in front, in the background and killed (push_tap), a critique of a log (push_tap_critique: the log), an admission (push_tap_salon: the salon) and word from the house (push_tap_house: the notices sheet), one flow for each kind push-present sends and each kind a flow (audit P4-22-PUSH-TAP-PLAN); round 13: the push flows register the member's phone as the app does, under a session, read back as standing (registerAsThePhone; mutant shape-pushed-phone-laid-without-a-session); the functions suite proves a signed-out phone is never pushed"
    places: [emulator]

