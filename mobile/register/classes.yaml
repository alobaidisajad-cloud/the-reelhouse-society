  - id: E2E-phone-only-as-the-runner-has-it
    title: Every run's phone has the default text, width, navigation bar, direction and mode, with animations off, so a screen that breaks for a member who set any of them passes every run
    seriousness: behaviour
    area: tests
    status: OPEN
    count: 0
    source: { kind: reviewer, ref: "P0.86" }
    methods:
      - { kind: static, file: e2e/__tests__/variants.test.ts, test: "is the list the workflow says a variant run may be given, and the night walks every one" }
      - { kind: running, file: e2e/__tests__/runFlows.rehearsal.test.ts, test: "reads the mode the phone had, sets the variant, walks, and puts back exactly what it read" }
      - { kind: running, file: e2e/__tests__/runFlows.rehearsal.test.ts, test: "walks nothing for a variant with no name in the list, and sends the phone nothing of it" }
      - { kind: running, file: e2e/__tests__/runFlows.rehearsal.test.ts, test: "sends every one of a variant's commands, though adb reads its input as each is sent" }
      - { kind: running, file: e2e/__tests__/runFlows.rehearsal.test.ts, test: "runs every flow, the probes among them, on the phone as the variant has it, and puts it back after them all" }
      - { kind: running, file: e2e/__tests__/runFlows.rehearsal.test.ts, test: "waits for a phone the variant changed to settle before the walk, and goes on, saying so, when it does not" }
    fix: "e2e/variants.json names each setting a member may choose (largest text, bold text, the narrowest width, three-button navigation, the phone in Arabic, dark mode, motion on), with its commands to set, to wait for and to put back; run-flows.sh sets one before the run touches the phone and puts it back at its end, every command sent (mutant shape-variant-input-swallowed), a variant not in the list running nothing (mutant shape-variant-refusal-sent), and a variant that set anything waiting for the phone to settle, its load under 1.0 for up to three minutes, said either way (the dark mode's switch kept the launcher, System UI and the Google app busy, and the dark walk ran at half the plain one's speed: 39614969442, 39642887150; mutant shape-variant-phone-unsettled); largest text, the narrowest width and Arabic run every flow on three machines and the walk on a fourth; every night runs every variant. Each variant's own pass rules are P0.86's next part"
    places: [emulator]

