      - { kind: static, file: src/utils/__tests__/theMountOrderGuardIsInstalled.guard.test.ts, test: "Android writes a frame's opacity and transform straight to the view, where a removed view is skipped" }
    fix: "Reanimated 4.3.4 (the newest for React Native 0.81 and worklets 0.8): a UI-thread pass keeps only the views that are mounted (preserveMountedTags) and treats a view still being made as not mounted (the fix to software-mansion/react-native-reanimated#9636); four props that carry an animated style typed as AnimatedStyle; theMountOrderGuardIsInstalled reads the installed library and the manifest, so expo install --fix cannot take it back to the SDK's 4.1 pin (mutant shape-reanimated-back-to-the-pin). Then the other side (Sealed E2E 39763329848, shard 1, lounge_flow, on 4.3.4): an animation frame (NodesManager.onAnimationFrame) committed view 538's props while React's commit removed it; Android's push model orders neither, and React Native 0.81 throws (0.86 logs, react-native 56147; upstream reanimated 7493 and 8592). ANDROID_SYNCHRONOUSLY_UPDATE_UI_PROPS (package.json) sends opacity, transform, colours and radii straight to the view by React Native's own path, which skips a view already gone; 17 animated styles of layout props (keyboard paddings, the scrollbar) still commit until React Native 0.86 (mutant shape-frames-commit-again)."
    places: [emulator]

