  - id: NET-request-without-time-limit
    title: A request to the server with no time limit of its own, so one caught by a change of network holds it, and the queued writes behind it, for as long as Android's connection waits
    seriousness: behaviour
    area: runtime
    status: OPEN
    count: 1
    source: { kind: history, ref: "Sealed E2E 38837073968, offline_resilience: back online on mobile data, moved to Wi-Fi four seconds later, the offline log not sent in thirty" }
    methods:
      - { kind: running, file: src/lib/__tests__/aRequestEndsInItsTime.test.ts, test: "is given up at its limit as not reached, and the queue reads it as a network failure" }
      - { kind: running, file: src/utils/__tests__/offlineQueue.integration.test.ts, test: "runs once more when the running send ends, sending what was queued meanwhile" }
      - { kind: running, file: src/utils/__tests__/revenuecatWebhookDecide.test.ts, test: "gives up on the store before the app gives up on the house, so the member hears \"try again\", not silence" }
      - { kind: running, file: src/utils/__tests__/revenuecatWebhookDecide.test.ts, test: "asks the address the settings name, RevenueCat's own otherwise, and never without a time limit" }
    fix: "the client's fetch (src/lib/supabase.ts fetchWithinLimit) gives up each request at 15 s, storage at 90 s, as a TimeoutError isNetworkError reads as not reached; a send of the queue asked for while one runs runs once more after it; the E2E build traces each change of network and each send. The edge functions' own calls out, swept (P0.78): Expo, RevenueCat, TMDB (the proxy and the film sync), the feed (its body too) and the house (sign-in-with-username) each within 10 s, under the app's 15; RevenueCat's held by revenuecatWebhookDecide.test, the proxy's 504 by the functions world (e2e/functions/suites.mjs). Proof still to come: offline_resilience passing on the nights' repeated runs, its traces read"
    places: [emulator]

