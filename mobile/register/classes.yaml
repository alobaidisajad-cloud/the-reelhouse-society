    source: { kind: history, ref: "Sealed E2E 39642840944, shard 1, the log probe: a change to the member tab a second after launch; UPDATE PROPS for tags 2644, 2672 and 2690 while the highest view made was 2638, from expo-image's onLoad through Reanimated's NodesManager.onEventDispatch; once in the 60 E2E runs since 2026-10-15. Reanimated 4.1.7; the closest upstream fixes (software-mansion/react-native-reanimated 10794 and 10795, merged 2026-10-05) are for removals" }
