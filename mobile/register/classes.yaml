# The register: every kind of mistake the app can make, one entry per class (WORKLIST P0.49–P0.54).
# mobile/scripts/register.cjs generates CLASSES.md from this file; everyClassIsAccountedFor holds each status
# to its rules. A class still open in production keeps only id, area, seriousness, count and status here; the
# rest is in the private file until its fix is live and probed.
classes:
  - id: MOTION-empty-config-key
    title: An animation config key holding no value replaces Reanimated's default with nothing
    seriousness: serious
    area: motion
    status: OPEN
    count: 0
    source: { kind: history, ref: c56597db }
    methods:
      - { kind: static, file: src/utils/__tests__/animationConfigsAreLiterals.guard.test.ts, test: "reads every animation config in the app, and each is a literal whose keys all hold a value" }
      - { kind: running, file: src/utils/__tests__/animationConfigsAreLiterals.guard.test.ts, test: "the jest fake refuses an empty key in every config a test runs, withDecay's included" }
    places: [emulator, simulator]

