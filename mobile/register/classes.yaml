  - id: SEC-a-sign-in-pace-hardened
    title: "A per-address pace trusted an address the caller writes: the handle sign-in, the TMDB proxy and the feed reader each took the first entry of X-Forwarded-For, which the platform keeps as the caller sent it and adds its own after, so a script naming a new address on each call guessed any member's password without end (Auth's own limit was told the same written address) and was never held by the proxy or the reader"
    seriousness: serious
    area: security
    status: OPEN
    count: 2
    source: { kind: reviewer, ref: "review round 14, the attacker, 2026-11-18" }
    methods:
      - { kind: running, file: src/utils/__tests__/edgeFunctionsKnowTheirCaller.test.ts, test: "Cloudflare's own CF-Connecting-IP is the caller, whatever X-Forwarded-For says" }
      - { kind: running, file: src/utils/__tests__/edgeFunctionsKnowTheirCaller.test.ts, test: "a new address written on every call is still the one caller" }
      - { kind: running, file: src/utils/__tests__/edgeFunctionsKnowTheirCaller.test.ts, test: "with no vouched address, no entry of X-Forwarded-For is ever taken as the caller: none, never a bucket all share" }
      - { kind: running, file: src/utils/__tests__/edgeFunctionsKnowTheirCaller.test.ts, test: "nothing that is not an address becomes one" }
      - { kind: running, file: src/utils/__tests__/edgeFunctionsKnowTheirCaller.test.ts, test: "an IPv6 caller is paced by its /64, however it is written; an IPv4 one whole" }
      - { kind: running, file: src/utils/__tests__/edgeFunctionsKnowTheirCaller.test.ts, test: "the two folders hold the same file, each deployed beside its own functions" }
      - { kind: running, file: src/utils/__tests__/edgeFunctionsKnowTheirCaller.test.ts, test: "every function that paces by address asks callerAddress and paces only a vouched one, and none reads X-Forwarded-For itself" }
      - { kind: running, file: src/utils/__tests__/edgeFunctionsKnowTheirCaller.test.ts, test: "every answer names the source it read, never the address, and lets the website read it" }
      - { kind: running, file: src/utils/__tests__/edgeFunctionsKnowTheirCaller.test.ts, test: "the proxy and the reader pace no address when none is vouched" }
      - { kind: running, file: src/utils/__tests__/edgeFunctionsKnowTheirCaller.test.ts, test: "Auth is told the vouched address, or the caller's own written one, never a hop the platform added" }
    fix: "the edge functions read the caller through _shared/callerAddress.js (one file in each functions folder, held the same): only the address the platform vouches for, Cloudflare's CF-Connecting-IP, never an entry of X-Forwarded-For, an IPv6 caller paced by its /64; with no vouched address no function paces by address at all, never one key every caller shares (round 14's review: an entry the gateway adds would be the same for the whole house); each answer names which headers came (x-rh-caller-source: cf, xff or none, never the address), so the first call after a deploy shows whether the pace by address is on; the sign-in tells Auth the vouched address, else the caller's own written one, and counts each handle's attempts at the house (AUTH-a-member-held-out-by-anothers-guesses); the functions world calls the proxy and the sign-in with a new X-Forwarded-For on each call and is held all the same, and with none vouched paces no one (e2e/functions/suites.mjs) (mutants shape-pace-keyed-on-the-written-address, shape-unvouched-caller-paced-by-the-last-hop, shape-ipv6-caller-paced-per-address, shape-proxy-paces-the-unvouched-as-one)"
    places: [none]
