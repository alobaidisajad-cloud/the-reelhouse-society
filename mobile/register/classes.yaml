    fix: "the house counts each attempt on a member's handle before any password is tried (sign_in_attempt): at its door, the vouched address (five wrong a day, then a rest doubling from a minute to an hour), so a guesser rests only their own door; and in a pail every door not known to the member shares (20, one more every 5 minutes), so many doors at once are slowed together; the right password hands the phone a key (sign_in_cleared), and a phone sending it is never held by the pail, so the member's own phone always has a way in, and the email address, at Auth's own door, is never held by any of it; an attempt the house or Auth could not answer is given back (sign_in_unasked); a handle no member holds leaves no row; the car's header puts the migration before the function's deploy, and the function back first on the way down (rehearsals a_members_sign_in_doors_are_kept_rehearsal.sql, a_guesser_rests_only_their_own_door_rehearsal.sql; the functions world plays the guesser, the member at another door, a new phone and the member's own phone, e2e/functions/suites.mjs); the phone keeps each handle's key in its encrypted store and sends it, and says a rest as what it is, from this connection or from elsewhere, how long, and that the email address signs in now (mutants shape-unanswered-sign-in-counted, shape-handle-rest-said-as-a-pace, shape-phone-key-never-sent)"
