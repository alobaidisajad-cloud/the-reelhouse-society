    title: "A check that compares the schedule read every job as schema, so a job the house's own functions take off the schedule once their work is done (the members' lists filled, a closed ballot's voters told, the Lobby's edition drafted) blamed its ending on whatever ran between two readings: the members' lists finished between car 64's readings, and car 64's undo, which touches no job, was refused"
