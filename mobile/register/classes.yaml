  - id: SPEED-a-write-counts-the-house-again
    title: "Each record written, changed or taken away counted its film's every record again for the film's verdict, so a member's record of a film half the house had logged read half the house's records: 1.1 s at 500,000 members, twice that at a million, and car 25's rehearsal, writing a record of the load house's most logged film, held the train's locks on the records and every table the car dates past the 1,000 ms bar"
    seriousness: behaviour
    area: speed
    status: OPEN
    count: 1
    source: { kind: ci, ref: "Load 45122008179 at 500,000 members (plant/c13-scale, 08547a72), the pending train on the full house, its locks timed: car 25's rehearsal, INSERT INTO public.logs 1099 ms, every lock held 1100 ms" }
    methods:
      - { kind: static, file: e2e/__tests__/aWriteNeverCountsTheHouseAgain.test.ts, test: "bounds each read a write's trigger aggregates by one piece the write names, or counts a film once, at its first move" }
      - { kind: static, file: e2e/__tests__/aWriteNeverCountsTheHouseAgain.test.ts, test: "finds the verdict counted again at each record, as production held it before 20261122_67" }
      - { kind: static, file: e2e/__tests__/aWriteNeverCountsTheHouseAgain.test.ts, test: "finds a write that counts the house, in its trigger and in a function it calls, and no call in a job's words" }
