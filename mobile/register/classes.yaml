    source: { kind: history, ref: "God-Tier 39763330037: Could not get lock /var/lib/dpkg/lock-frontend, both retries" }
    methods:
      - { kind: static, file: src/utils/__tests__/ciWorkflows.guard.test.ts, test: "every apt install waits for the lock a try cut short at its limit leaves held" }
      - { kind: running, file: scripts/__tests__/keptDebs.test.ts, test: "every wait for apt, in every workflow, ends an apt that still holds its locks and repairs what it left" }
    fix: "every step that installs through apt (the Postgres client, Playwright's --with-deps) first sets DPkg::Lock::Timeout to 240 s, so a retry waits for the try before it to let go of the lock; and Playwright's system packages are kept between runs in GitHub's cache and installed from there by dpkg alone (scripts/kept-debs.sh) before apt is asked, since a mirror at 30-60 KB/s outlived the wait too (God-Tier 39774848287) and apt-get update alone outlived a try (God-Tier 39806861456, its retry then refused on the package lists' lock) (mutants shape-retry-blocked-by-lock, shape-install-waits-on-the-mirror); and a wait that gives up while apt still holds its locks ends that apt and lets dpkg repair what it left, in all twenty waits (God-Tier 44473860748: the first try's apt held the lists lock through the retry; mutant shape-apt-waited-into-its-lock)"
    places: [none]

