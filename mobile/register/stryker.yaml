      - src/utils/__tests__/aQueueSendsOnlyItsOwnMembersWrites.test.ts
      - src/utils/__tests__/theSendAsksWhoIsSendingFirst.test.ts
      - src/utils/__tests__/aFailureOfAnyShapeIsReadAndTold.test.ts
