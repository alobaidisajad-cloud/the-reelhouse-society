# The logic files where one wrong operator hurts a member (WORKLIST P0.70). Stryker mutates each, one
# file at a time, against that file's own tests alone (a mutant counts only when its own suite kills
# it, P0.71). Each file must score at least `floor`: every mutant its tests do not kill is killed by
# a new test, or written in stryker-equivalents.yaml as one no test can tell apart. stryker.config.mjs
# and scripts/stryker-files.cjs read this list; strykerFilesAreListed holds it.
floor: 90
files:
  - file: src/utils/text.ts
    tests:
      - src/utils/__tests__/aCharacterIsNeverCut.test.ts
      - src/utils/__tests__/anExcerptNeverEndsInHalfAnEmoji.test.ts
      - src/utils/__tests__/theCharacterRuleIsUnicodes.test.ts
      - src/utils/__tests__/theCharacterRuleHoldsForEveryShortString.test.ts
      - src/utils/__tests__/aReviewIsCleanedOfItsMarkup.test.ts
      - src/utils/__tests__/aReviewReadsInItsOwnDirection.test.ts
      - src/utils/__tests__/aReviewIsCutAtAWord.test.ts
      - src/components/log/__tests__/logSurfaces.test.ts
  - file: src/utils/sanitizeInput.ts
    tests:
      - src/utils/__tests__/sanitizeInput.test.ts
      - src/utils/__tests__/inputTrustBoundary.test.ts
      - src/utils/__tests__/markdownSafety.test.ts
      - src/utils/__tests__/aJoinerIsKeptOnlyWhereItJoins.test.ts
      - src/utils/__tests__/aFieldIsCleanedAndCappedToTheLetter.test.ts
  - file: src/lib/queryPolicy.ts
