# The sealed E2E world's backend — a local Supabase, started by `supabase start`
# on the CI runner (e2e.yml). It is built from the production snapshot
# (supabase/schema/*.sql, by e2e/db/bootstrap.mjs), not from migrations, so it is
# the database as it IS, not as the migration files say it should be.
#
# Only what differs from the CLI's defaults, or what the app depends on, is set.
#
# .temp/{postgres,gotrue,rest,storage}-version pin production's exact images
# (read with `supabase link` on 2026-09-27: Postgres 17.6.1.084, auth v2.197.0,
# PostgREST v14.5, storage v1.77.5). The CLI's defaults are other builds — the
# first run failed because the default Postgres had no pg_net 0.20.0, which
# production runs. If production is upgraded, the fidelity check fails on the
# extension versions; re-read them the same way and update these files.

project_id = "reelhouse-e2e"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Production is 17.6.
major_version = 17

# The schema comes from the snapshot; there are no migrations and no seed.sql.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

# Not needed on a runner, and each is another image to pull.
[studio]
enabled = false

[analytics]
enabled = false

# Kept: the forgot-password flow sends a real email, and it must land somewhere.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "reelhouse://"
additional_redirect_urls = ["reelhouse://auth-callback", "reelhouse://reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# The TMDB stand-in reads its recordings from files at start. The runtime only
# ships files a function imports, or that are listed here — without this line
# the stand-in could not find its own index and never answered.
[functions.tmdb-proxy]
verify_jwt = false
static_files = ["./functions/tmdb-proxy/fixtures/*.json"]

# Production's own function, copied in by e2e.yml; open, as it is in production
# (it is called before there is a session).
[functions.sign-in-with-username]
verify_jwt = false
