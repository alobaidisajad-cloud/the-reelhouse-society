appId: com.reelhouse.society
---
# Rapid tab switching never trips the ErrorBoundary ("PROJECTION FAILURE",
# src/components/ErrorBoundary.tsx). Tabs by their testIDs: no tab prints a
# title.

# Signed out, from a clean install: a flow depends on no other.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-tab"
    timeout: 10000

# Each tab once, and what only its loaded content carries: a tab that could
# not read says so, and never shows these. The Dispatch's is the seed's filing
# (e2e/db/seed.mjs), which a guest may read.
- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "profile-sign-in-prompt"

- tapOn:
    id: "home-tab"
- assertVisible:
    id: "welcome-seek-admission"
- tapOn:
    id: "darkroom-tab"
- extendedWaitUntil:
    visible:
      id: "film-card"
    timeout: 20000
- tapOn:
    id: "dispatch-tab"
- extendedWaitUntil:
    visible:
      id: "dispatch-filing"
    timeout: 20000

# Rapid tab switching stress test (15 cycles)
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "home-tab"
      - tapOn:
          id: "darkroom-tab"
      - tapOn:
          id: "profile-tab"

# Verify app is still alive and the ErrorBoundary never tripped.
- assertVisible:
    id: "profile-sign-in-prompt"
- assertNotVisible: "PROJECTION FAILURE"
