appId: com.reelhouse.society
---
# Error Recovery Flow
# Tests: rapid tab navigation never trips the ErrorBoundary fallback
# ("PROJECTION FAILURE", confirmed in src/components/ErrorBoundary.tsx).
# The real tab bar testIDs are dispatch-tab/reels-tab/home-tab/
# darkroom-tab/profile-tab (app/(tabs)/_layout.tsx) — there is no
# "tab-profile"/"tab-lobby" etc., and no on-screen "Profile"/"Darkroom"/
# "Dispatch" header text to assert against (TopNavBar has no title).

- launchApp
- extendedWaitUntil:
    visible:
      id: "home-tab"
    timeout: 10000

# Navigate through the tabs — Profile's sign-in prompt is the one stable,
# time-independent content anchor available without authenticating.
- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "profile-sign-in-prompt"

- tapOn:
    id: "home-tab"
- tapOn:
    id: "darkroom-tab"
- assertVisible:
    id: "darkroom-search-input"
- tapOn:
    id: "dispatch-tab"
- assertVisible:
    id: "dispatch-tab"

# Rapid tab switching stress test (15 cycles)
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "home-tab"
      - tapOn:
          id: "darkroom-tab"
      - tapOn:
          id: "profile-tab"

# Verify app is still alive and the ErrorBoundary never tripped.
- assertVisible:
    id: "profile-sign-in-prompt"
- assertNotVisible: "PROJECTION FAILURE"
