appId: com.reelhouse.society
---
# Rapid tab switching never trips the ErrorBoundary ("PROJECTION FAILURE",
# src/components/ErrorBoundary.tsx). Tabs by their testIDs: no tab prints a title.

# Signed out, from a clean install: a flow depends on no other.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-tab"
    timeout: 10000

# Navigate through the tabs — Profile's sign-in prompt is the one stable,
# time-independent content anchor available without authenticating.
- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "profile-sign-in-prompt"

- tapOn:
    id: "home-tab"
- tapOn:
    id: "darkroom-tab"
- assertVisible:
    id: "darkroom-search-input"
- tapOn:
    id: "dispatch-tab"
- assertVisible:
    id: "dispatch-tab"

# Rapid tab switching stress test (15 cycles)
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "home-tab"
      - tapOn:
          id: "darkroom-tab"
      - tapOn:
          id: "profile-tab"

# Verify app is still alive and the ErrorBoundary never tripped.
- assertVisible:
    id: "profile-sign-in-prompt"
- assertNotVisible: "PROJECTION FAILURE"
