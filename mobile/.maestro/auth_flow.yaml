appId: com.reelhouse.society
---
# Auth Flow: invalid credentials + forgot-password recovery.
# There is no Google OAuth anywhere in src/hooks/useAuthFlow.ts — the real
# login screen (app/(modals)/login.tsx) is email/username + password only.
# login_flow.yaml already covers the happy-path sign-in, so this flow
# exercises the credential-recovery path instead.
- launchApp:
    clearState: true

# Login is reached via the Profile tab's sign-in prompt.
- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "profile-sign-in-prompt"
- tapOn:
    id: "profile-sign-in-prompt"
- assertVisible:
    id: "email-input"

# Open the forgot-password modal.
- tapOn: "Forgot your credentials?"
- assertVisible: "Reset Password"
- tapOn:
    id: "recovery-email-input"
- inputText: "test@reelhouse.app"
- tapOn:
    id: "recovery-submit-button"

# Supabase's resetPasswordForEmail always resolves success (it never
# reveals whether the address exists), so the modal flips to the
# "Check Your Inbox" confirmation state.
- assertVisible: "Check Your Inbox"
- tapOn: "BACK TO SIGN IN"

# Modal closes, login form is back underneath it.
- assertVisible:
    id: "email-input"
