appId: com.reelhouse.society
---
# Recovering credentials: the sign-in form's "Forgot your credentials?" opens
# the recovery modal. The auth server always answers success (it never says
# whether an address exists), so the modal turns to "Check Your Inbox". In the
# sealed world the email lands in the local mail catcher, nowhere real.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 20000
- tapOn:
    id: "profile-tab"
- tapOn:
    id: "profile-sign-in-prompt"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 15000
- tapOn: "Forgot your credentials?"
- extendedWaitUntil:
    visible: "Reset Password"
    timeout: 10000
- tapOn:
    id: "recovery-email-input"
- inputText: ${E2E_MEMBER_EMAIL}
- tapOn:
    id: "recovery-submit-button"
- extendedWaitUntil:
    visible: "Check Your Inbox"
    timeout: 15000
- tapOn: ".*BACK TO SIGN IN"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
