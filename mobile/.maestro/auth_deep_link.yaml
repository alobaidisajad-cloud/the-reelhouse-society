appId: com.reelhouse.society
---
# Auth Deep Link: reelhouse://reset-password with no active Supabase
# session. app/reset-password.tsx guards on supabase.auth.getSession() —
# with no prior auth-callback exchange (the original "openLink straight to
# reset-password" scenario), it shows the "No Active Session" rescue UI
# rather than a live password form.
- launchApp:
    clearState: true

- openLink: "reelhouse://reset-password"
- extendedWaitUntil:
    visible: "No Active Session"
    timeout: 10000
- assertVisible: "SESSION EXPIRED"

# Return to the app from the rescue screen.
- tapOn: "RETURN TO LOBBY"
- assertVisible:
    id: "dispatch-tab"
