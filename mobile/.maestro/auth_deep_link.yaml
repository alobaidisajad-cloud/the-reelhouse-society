appId: com.reelhouse.society
---
# reelhouse://reset-password with no session: app/reset-password.tsx guards on
# getSession(), so it shows the "No Active Session" rescue, not a password form.
- launchApp:
    clearState: true
# The app must be up and listening before the link arrives, or the link is lost.
- extendedWaitUntil:
    visible:
      id: "home-tab"
    timeout: 20000
- openLink: "reelhouse://reset-password"
# iOS asks before a link opens an app by its own scheme ("Open in ...?").
- runFlow:
    when:
      platform: iOS
    file: subflows/open_link_on_ios.yaml
- extendedWaitUntil:
    visible: "No Active Session"
    timeout: 10000
- assertVisible: "SESSION EXPIRED"

# Return to the app from the rescue screen. The replace builds the tabs
# afresh, which on the iPhone runner outlasted a bare assert's wait
# (iPhone launch 40501819810: the reset screen still showing at the
# assert, the Lobby drawn a moment after).
# Tapped again if nothing changed: the iPhone simulator cancelled the first
# touch 0.2 s after it landed ("digitizer did disappear", run of 211009e5),
# so no press was ever made and the reset screen stood for the whole wait.
# A second tap is only ever made over a screen the first left unchanged.
- tapOn:
    text: "RETURN TO LOBBY"
    retryTapIfNoChange: true
# The tabs are built cold here, as at a launch: the wait is a launch's
# (30 s), not 15, which the iPhone runner outlasted twice
# (40501819810, 40831511384).
- extendedWaitUntil:
    visible:
      id: "dispatch-tab"
    timeout: 30000

# reelhouse://_sitemap, opened with the app closed: expo-router makes that
# route unless app.json turns its sitemap off, and with it off the path is
# one the app does not have, so it lands on +not-found.
- stopApp
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: "reelhouse://_sitemap"
# On iOS the link goes to the app running. The simulator hands a link that
# must also launch the app to it within ten seconds, and a cold launch on
# the runner takes longer (iPhone launch 39836999452, 40129689064); its
# failure is not one Maestro's retry takes. Opened with the app closed,
# the link is Android's to prove here, and a real iPhone's on the device
# checks.
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: "home-tab"
          timeout: 30000
      - openLink: "reelhouse://_sitemap"
- runFlow:
    when:
      platform: iOS
    file: subflows/open_link_on_ios.yaml
- extendedWaitUntil:
    visible: "ROUTE NOT IN THE ARCHIVE"
    timeout: 30000

# Back from a screen opened cold by a link lands on the Lobby, the
# member's home, not on the first tab the bar lists; and Back from any
# other tab lands there too. The tab layout, app/(tabs)/_layout.tsx,
# hands its navigator TABS_HOME. On Android: an iPhone has no Back key.
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - extendedWaitUntil:
          visible:
            id: "welcome-seek-admission"
          timeout: 15000
      - tapOn:
          id: "darkroom-tab"
      - extendedWaitUntil:
          visible:
            id: "film-card"
          timeout: 20000
      - back
      - extendedWaitUntil:
          visible:
            id: "welcome-seek-admission"
          timeout: 15000
