appId: com.reelhouse.society
---
# The phone's clock wrong (WORKLIST P2.4, judged by P4.32's rules): signed in,
# the clock SET (clock_ahead or clock_behind) by MINUTES, and the app opened
# again on it, so the saved session and every tab's first read meet the wrong
# clock; a behind run then waits past its token and reads every tab again;
# then FILM logged with WORDS (e2e/db/verify-writes.mjs finds it in the
# database), and the member still signed in. e2e/clock-judges.mjs reads the
# rest from the device log and the gateway's: every tab ready, nothing failed,
# no sign-out, no refresh loop.
- launchApp:
    clearState: true
- runFlow: sign_in.yaml
- runFlow:
    file: phone.yaml
    env:
      SET: ${SET}
      TO: ${MINUTES}
- stopApp
- launchApp
- runFlow: every_tab.yaml
- runFlow:
    when:
      true: ${SET == 'clock_behind'}
    file: past_the_token.yaml
- runFlow:
    file: open_a_film.yaml
    env:
      FILM: ${FILM}
- runFlow: open_the_stub.yaml
- tapOn:
    id: "film-act-log"
# The sheet stands once its seal does; the field may begin below a short
# phone's screen.
- extendedWaitUntil:
    visible:
      id: "submit-log-button"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "review-input"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "review-input"
- inputText: ${WORDS}
- tapOn:
    id: "submit-log-button"
- extendedWaitUntil:
    notVisible:
      id: "submit-log-button"
    timeout: 15000
# The film page has no tab bar: the profile is opened by its link.
- openLink: "reelhouse://profile"
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 30000
- assertNotVisible:
    id: "profile-sign-in-prompt"
