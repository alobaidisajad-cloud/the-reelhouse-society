appId: com.reelhouse.society
---
# Search the Darkroom for a film and open its page from the suggestion row.
# The film comes from recorded TMDB answers (e2e/tmdb), so the same search
# finds the same film on every run. FILM defaults to The Godfather.
- tapOn:
    id: "darkroom-tab"
# The tray's own films: only a Darkroom that read them shows one.
- extendedWaitUntil:
    visible:
      id: "film-card"
    timeout: 20000
- tapOn:
    id: "darkroom-search-input"
# The Darkroom keeps its search across a restart (src/stores/discover.ts): a
# flow that searched before its app was stopped would type after the old
# words (run 39021480535: "the godfatherThe Godfather"), so the field is
# emptied first.
- eraseText: 60
- inputText: ${FILM || 'The Godfather'}
- extendedWaitUntil:
    visible:
      id: "darkroom-suggestion-row"
    timeout: 15000
- tapOn:
    id: "darkroom-suggestion-row"
    index: 0
# The film page: its stub, the one door to every act on the film.
- extendedWaitUntil:
    visible:
      id: "film-stub"
    timeout: 15000
