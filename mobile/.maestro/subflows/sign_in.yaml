appId: com.reelhouse.society
---
# Sign in as the seeded member (e2e/db/seed.mjs), through the Profile tab's
# prompt, the way a person does. The address and a fresh password arrive from
# the run (run-flows.sh passes them); no flow holds an account.
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 20000
- tapOn:
    id: "profile-tab"
- tapOn:
    id: "profile-sign-in-prompt"
- tapOn:
    id: "email-input"
- inputText: ${E2E_MEMBER_EMAIL}
# No hideKeyboard: the test device has no on-screen keyboard (run-flows.sh), and
# Maestro's hideKeyboard presses Back, which would leave the form.
- tapOn:
    id: "password-input"
- inputText: ${E2E_MEMBER_PASSWORD}
# The address holds the address and nothing else — so a password typed into
# the wrong field fails HERE, saying so, not twenty seconds later as "still
# on the sign-in form".
- assertVisible:
    id: "email-input"
    text: ${E2E_MEMBER_EMAIL}
- tapOn:
    id: "sign-in-submit"
# The seeded member is new on every run, so signing in opens THE INITIATION, as
# it does for every member in their first 48 hours; they enter quietly. Then the
# Lobby, with its tabs.
- extendedWaitUntil:
    visible:
      id: "initiation-enter-quietly"
    timeout: 30000
- tapOn:
    id: "initiation-enter-quietly"
- extendedWaitUntil:
    visible:
      id: "home-tab"
    timeout: 15000
# Signed in = your own member file, with its holdings, under the Profile tab.
# The holdings sit below the fold on a phone, so scrolled to, not waited for.
- tapOn:
    id: "profile-tab"
- scrollUntilVisible:
    element:
      id: "collection-card-watchlist"
    direction: DOWN
    timeout: 20000
