appId: com.reelhouse.society
---
# Sign in as the seeded member (e2e/db/seed.mjs), through the Profile tab's
# prompt, the way a person does. The address and a fresh password arrive from
# the run (run-flows.sh passes them); no flow holds an account.
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 20000
- tapOn:
    id: "profile-tab"
- tapOn:
    id: "profile-sign-in-prompt"
- tapOn:
    id: "email-input"
- inputText: ${E2E_MEMBER_EMAIL}
# The keyboard goes down BEFORE the next field is tapped. On the runner's
# emulator the keyboard's animation stalls (logcat: IME_INSETS_ANIMATION timed
# out), the form is still moving under it, and a tap aimed at the password
# field landed back in the address — the password was typed on the END of the
# email (the failed run's screen showed the address followed by the masked
# password) and sign-in never began.
- hideKeyboard
- tapOn:
    id: "password-input"
- inputText: ${E2E_MEMBER_PASSWORD}
- hideKeyboard
# The address holds the address and nothing else — so a password typed into
# the wrong field fails HERE, saying so, not twenty seconds later as "still
# on the sign-in form".
- assertVisible:
    id: "email-input"
    text: ${E2E_MEMBER_EMAIL}
- tapOn:
    id: "sign-in-submit"
# The seeded member is new on every run, so signing in opens THE INITIATION, as
# it does for every member in their first 48 hours; they enter quietly. Then the
# Lobby, with its tabs.
- extendedWaitUntil:
    visible:
      id: "initiation-enter-quietly"
    timeout: 30000
- tapOn:
    id: "initiation-enter-quietly"
- extendedWaitUntil:
    visible:
      id: "home-tab"
    timeout: 15000
# Signed in = your own member file, with its holdings, under the Profile tab.
- tapOn:
    id: "profile-tab"
- extendedWaitUntil:
    visible:
      id: "collection-card-watchlist"
    timeout: 20000
