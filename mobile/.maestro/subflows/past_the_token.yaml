appId: com.reelhouse.society
---
# A behind clock run's second half (WORKLIST P4.32): its tokens live 180 s
# (e2e.yml sets them so for that run alone), so after 195 s the house refuses
# the token the phone, its clock behind, still trusts. The app is opened again
# and every tab read once more. Maestro has no pause: the wait is for the tab
# bar to go, which it never does on the member's file, so it runs out at its
# timeout and is let go (optional).
- extendedWaitUntil:
    notVisible:
      id: "profile-tab"
    timeout: 195000
    optional: true
- runFlow:
    file: phone.yaml
    env:
      SET: waited
      TO: "195"
- stopApp
- launchApp
- runFlow: every_tab.yaml
