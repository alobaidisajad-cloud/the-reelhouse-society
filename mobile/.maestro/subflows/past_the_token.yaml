appId: com.reelhouse.society
---
# A behind clock run's second half (WORKLIST P4.32): its tokens live 60 s
# (e2e.yml sets them so for that run alone), so after 75 s the house refuses
# the token the phone, its clock behind, still trusts. The app is opened again
# and every tab read once more. Maestro has no pause: the wait is for an id no
# screen draws, which runs out at its timeout and is let go (optional).
- extendedWaitUntil:
    visible:
      id: "clock-run-never-drawn"
    timeout: 75000
    optional: true
- runFlow:
    file: phone.yaml
    env:
      SET: waited
      TO: "75"
- stopApp
- launchApp
- runFlow: every_tab.yaml
