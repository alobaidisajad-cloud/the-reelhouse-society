appId: com.reelhouse.society
---
# The notice in the shade, tapped, and the sender's file it opens
# (push_tap.yaml). The shade is opened by the phone itself (a swipe from the
# edge never opened it, run 42622134690); the notice is found by the title
# notify-push gave it (PUSH_TITLE), and the file by its sender's handle
# (PUSH_FROM), both from the run (e2e/push-present.mjs).
- runFlow:
    file: phone.yaml
    env:
      SET: notification_shade
      TO: "true"
- extendedWaitUntil:
    visible:
      id: "android:id/title"
      text: ${PUSH_TITLE}
    timeout: 20000
# By its title line: a tap on the notice's header expands it, and opens
# nothing (run 42657444661).
- tapOn:
    id: "android:id/title"
    text: ${PUSH_TITLE}
- extendedWaitUntil:
    visible:
      id: "screen-ready-member"
    timeout: 30000
- assertVisible:
    text: "(?i).*@${PUSH_FROM}.*"
