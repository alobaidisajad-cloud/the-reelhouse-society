appId: com.reelhouse.society
---
# The app boots: the whole tab bar mounts (its testIDs, from app/(tabs)/_layout.tsx,
# are the signal; no tab screen prints a title). From a clean install.
- launchApp:
    clearState: true

# A release build's first cold start on a CI emulator (software GPU) takes
# far longer than on a phone.
- extendedWaitUntil:
    visible:
      id: "home-tab"
    timeout: 60000

# The full tab bar.
- assertVisible:
    id: "dispatch-tab"
- assertVisible:
    id: "reels-tab"
- assertVisible:
    id: "home-tab"
- assertVisible:
    id: "darkroom-tab"
- assertVisible:
    id: "profile-tab"
