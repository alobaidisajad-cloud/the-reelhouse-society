appId: com.reelhouse.society
---
# Abandoning a film: a different branch of the log form, which asks for a
# reason instead of a rating or review (validateLogSubmission, useLogFlow.ts).
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- runFlow:
    file: subflows/open_a_film.yaml
    env:
      FILM: "The Matrix"
- tapOn:
    id: "film-stub"
- tapOn:
    id: "film-act-log"
- extendedWaitUntil:
    visible:
      id: "submit-log-button"
    timeout: 15000
- tapOn: "ABANDONED"
- tapOn: "Too Slow"
- tapOn:
    id: "submit-log-button"
- extendedWaitUntil:
    notVisible:
      id: "submit-log-button"
    timeout: 15000
