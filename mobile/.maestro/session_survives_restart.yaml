appId: com.reelhouse.society
---
# Closed and opened again, a member is still signed in: the session is kept
# on the device (src/lib/authSessionStorage.ts). The Initiation, once ever,
# does not return.
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 20000
- assertNotVisible:
    id: "initiation-enter-quietly"
- tapOn:
    id: "profile-tab"
- scrollUntilVisible:
    element:
      id: "collection-card-watchlist"
    direction: DOWN
    timeout: 20000
    # To the middle, never left under the tab bar where a tap lands on a tab.
    centerElement: true
- assertNotVisible:
    id: "profile-sign-in-prompt"
