appId: com.reelhouse.society
---
# Signing in: a guest lands on the Lobby; the Profile tab asks who they are;
# after signing in, the same tab is their own member file.
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- assertNotVisible:
    id: "profile-sign-in-prompt"
- assertVisible:
    id: "collection-card-watchlist"
