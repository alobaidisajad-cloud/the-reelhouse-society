appId: com.reelhouse.society
env:
  WORDS: "E2E: a day passes with the app waiting."
---
# A day passes with the app in the background (WORKLIST P4.7): a film logged
# today reads TODAY in the member's LATELY. A day passes for the phone and the
# house alike while the app waits: the phone's clock is moved on 26 hours, and
# the house's (every answer's Date, which the app keeps its time by) the same.
# Back in front, the same row says YESTERDAY, read again from the shared
# clock, and the member is still signed in with their file drawn: no sign-out
# and no false empty after the jump. The phone's clock alone moved is a wrong
# clock, not a day passed: the clock runs prove the app keeps the house's day.
- launchApp:
    clearState: true
- runFlow: ../subflows/sign_in.yaml
- runFlow:
    file: ../subflows/open_a_film.yaml
    env:
      FILM: "The Matrix"
- runFlow: ../subflows/open_the_stub.yaml
- tapOn:
    id: "film-act-log"
# The sheet stands once its seal does; the field may begin below a short
# phone's screen.
- extendedWaitUntil:
    visible:
      id: "submit-log-button"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "review-input"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "review-input"
- inputText: ${WORDS}
- tapOn:
    id: "submit-log-button"
- extendedWaitUntil:
    notVisible:
      id: "submit-log-button"
    timeout: 15000
# The film page has no tab bar: the profile is opened by its link, and
# stands once its tabs do.
- openLink: "reelhouse://profile"
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "collection-card-watchlist"
    direction: DOWN
    timeout: 60000
    centerElement: true
- scrollUntilVisible:
    element:
      text: "TODAY"
    direction: DOWN
    centerElement: true
    timeout: 60000
- pressKey: Home
- runFlow:
    file: ../subflows/phone.yaml
    env:
      SET: clock_ahead
      TO: "1560"
- runFlow:
    file: ../subflows/fault.yaml
    env:
      FAULT: house_a_day_on
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: "YESTERDAY"
    timeout: 20000
- assertNotVisible:
    text: "TODAY"
- assertVisible:
    id: "profile-tab"
- runFlow:
    file: ../subflows/fault.yaml
    env:
      FAULT: none
