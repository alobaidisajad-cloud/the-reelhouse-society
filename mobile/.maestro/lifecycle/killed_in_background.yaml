appId: com.reelhouse.society
env:
  WORDS: Words the system must not lose
---
# Edit Profile half-edited, the member goes home, and the system kills
# the app in the background to free its memory, as Android does
# (WORKLIST P0.86, P4.14's pass rule): when they come back, the app
# opens where they were, the session kept and their unsaved words
# still in the field.
- launchApp:
    clearState: true
- runFlow: ../subflows/sign_in.yaml
- openLink: "reelhouse://edit-profile"
- extendedWaitUntil:
    visible:
      id: "edit-profile-bio"
    timeout: 20000
- tapOn:
    id: "edit-profile-bio"
- inputText: ${WORDS}
- pressKey: Home
- runFlow:
    file: ../subflows/phone.yaml
    env:
      SET: killed_in_background
      TO: "true"
- launchApp
# The room stands once its page does; the words are scrolled to: a draft
# taken up is said above the form, and the field may sit below the screen.
- extendedWaitUntil:
    visible:
      id: "edit-profile"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "edit-profile-bio"
      text: ${WORDS}
    direction: DOWN
    centerElement: true
    timeout: 60000
