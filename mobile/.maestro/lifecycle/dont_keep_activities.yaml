appId: com.reelhouse.society
env:
  WORDS: Words a destroyed screen must keep
---
# Android's "don't keep activities" on: every screen the member leaves
# is destroyed at once, as a phone short of memory does (WORKLIST
# P0.86, P4.14's pass rule). Edit Profile half-edited, the member goes
# home and comes back: the same screen, their unsaved words still in
# the field. run-flows.sh turns the setting off again before every
# lifecycle flow.
- launchApp:
    clearState: true
- runFlow: ../subflows/sign_in.yaml
- runFlow:
    file: ../subflows/phone.yaml
    env:
      SET: dont_keep_activities
      TO: "true"
- openLink: "reelhouse://edit-profile"
- extendedWaitUntil:
    visible:
      id: "edit-profile-bio"
    timeout: 20000
- tapOn:
    id: "edit-profile-bio"
- inputText: ${WORDS}
- pressKey: Home
- launchApp
# The room stands once its page does; the words are scrolled to: a draft
# taken up is said above the form, and the field may sit below the screen.
- extendedWaitUntil:
    visible:
      id: "edit-profile"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "edit-profile-bio"
      # The member's bio already holds words: what was typed is within it.
      text: ".*${WORDS}.*"
    direction: DOWN
    centerElement: true
    timeout: 60000
