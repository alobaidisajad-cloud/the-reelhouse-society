appId: com.reelhouse.society
---
# Android's backup and restore (WORKLIST P0.86, P4.14's pass rule for a
# backup restored without its key): the member signed in, the app backed
# up to the emulator's own transport, uninstalled, installed afresh and
# restored. A marker laid in what the backup takes must be back, or
# nothing was restored and the run proves nothing (e2e/fault-proxy.mjs).
# The session's key never travels with a backup, so the app opens signed
# out and never crashes; the member signs in again, and the tabs load.
- launchApp:
    clearState: true
- runFlow: ../subflows/sign_in.yaml
- runFlow:
    file: ../subflows/backup.yaml
    env:
      STEP: save
- runFlow:
    file: ../subflows/backup.yaml
    env:
      STEP: reinstall
- runFlow:
    file: ../subflows/backup.yaml
    env:
      STEP: restore
- runFlow:
    file: ../subflows/backup.yaml
    env:
      STEP: marker

- launchApp
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 30000
- tapOn:
    id: "profile-tab"
- extendedWaitUntil:
    visible:
      id: "profile-sign-in-prompt"
    timeout: 20000
- runFlow: ../subflows/sign_in.yaml
- tapOn:
    id: "dispatch-tab"
- extendedWaitUntil:
    visible:
      id: "dispatch-filing"
    timeout: 20000
- tapOn:
    id: "darkroom-tab"
- extendedWaitUntil:
    visible:
      id: "film-card"
    timeout: 20000
