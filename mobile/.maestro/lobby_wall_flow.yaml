appId: com.reelhouse.society
---
# The Lobby's wall hangs for a member, whole, without crashing. The masthead
# names the room, and the sign-off is the wall's last line: it is drawn in
# EVERY state — a full edition, a house with nothing yet to feature, a wall
# that could not be reached — so reaching it proves every bill above it drew.
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- tapOn:
    id: "home-tab"
- assertVisible: "The Lobby"
# The wall the house read, full or vacant: never its shapes, never its failure.
- scrollUntilVisible:
    element:
      id: "lobby-wall-hung"
    direction: DOWN
    timeout: 60000
    centerElement: true
- scrollUntilVisible:
    element: "The projection booth never closes."
    direction: DOWN
    # As long as the scroll above: the wall's length is the day's edition's, and
    # each swipe and read takes 4 to 6 s on the emulator (run 38824884948 ran
    # out of 20 s four swipes in, the sign-off still below).
    timeout: 60000
    # The page's last line, only reached, never tapped: it cannot come to
    # the middle.
- assertNotVisible: "The Projector Stopped"
