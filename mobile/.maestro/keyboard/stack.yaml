appId: com.reelhouse.society
---
# The stack's accession form, reached as a member reaches it, with no keyboard
# on the device. Its act, FILE THE STACK, is docked at the foot.
- launchApp:
    clearState: true
- runFlow: ../subflows/sign_in.yaml
- tapOn:
    id: "reels-tab"
# The Reel opens on its logs (the seed's among them: e2e/db/seed.mjs); the
# stacks, the seed's own, and the form's door are one over.
- extendedWaitUntil:
    visible:
      id: "reel-log"
    timeout: 20000
- tapOn: "Stacks tab"
- extendedWaitUntil:
    visible:
      id: "reel-stack"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "reel-curate-stack"
    timeout: 15000
- tapOn:
    id: "reel-curate-stack"
- extendedWaitUntil:
    visible: "FILE THE STACK"
    timeout: 15000
