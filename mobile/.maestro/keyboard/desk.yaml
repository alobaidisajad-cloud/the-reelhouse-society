appId: com.reelhouse.society
---
# The take desk, reached with no keyboard on the device (run-flows.sh turns it
# on only for the tap that follows). Its tool rail sits on the keyboard's edge.
- launchApp:
    clearState: true
- runFlow: ../subflows/sign_in.yaml
- openLink: "reelhouse://dispatch/compose?kind=take"
- extendedWaitUntil:
    visible: "SPOILER"
    timeout: 15000
