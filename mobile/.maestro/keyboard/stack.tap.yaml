appId: com.reelhouse.society
---
# The title took focus on arrival, before any keyboard was on: tapping it
# again binds none. The note, not yet focused, raises one, from the middle.
- scrollUntilVisible:
    element:
      id: "stack-note-input"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "stack-note-input"
- waitForAnimationToEnd:
    timeout: 3000
