appId: com.reelhouse.society
---
# The keyboard changed while open (WORKLIST P4.35): Gboard's emoji key,
# pressed as a member presses it, the field still focused. Gboard names its
# keys, so the key is found by its name. An address field's layout may keep
# no emoji key; its toolbar's GIF key opens the same panel (emoji, GIFs,
# stickers), so that one is pressed there. run-flows.sh then checks the
# letters are gone and judges the room again. Gboard speaks the phone's
# language: on the right-to-left run's phone (Arabic) the letters keep no
# emoji key, and the GIF key is "لوحة مفاتيح GIF", so it is found by the GIF
# in its name (nightly 43848225969).
#
# The GIF key opens the panel on the tab last used, and an address field
# takes no GIF: where the GIF tab opened, the emoji tab is chosen, so the
# next field's panel opens on its emoji (the Arabic phone's recovery card
# kept its letters, every night from 2026-11-13).
- runFlow:
    when:
      notVisible: "Emoji button"
    commands:
      - tapOn: ".*GIF.*"
- runFlow:
    when:
      visible: "Emoji button"
    commands:
      - tapOn: "Emoji button"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Emoji keyboard|لوحة مفاتيح الرموز التعبيرية"
    commands:
      - tapOn: "Emoji keyboard|لوحة مفاتيح الرموز التعبيرية"
      - waitForAnimationToEnd:
          timeout: 3000
# A tablet's address field keeps its GIF and sticker keys drawn off, and a
# press there opens nothing (the recovery card, every tablet night from
# 2026-11-13): its symbols may keep the emoji key, so they are opened and
# that key pressed. Symbols with no emoji key stay open: they are the tallest
# panel a member can open only where the letters keep no emoji key
# (keyboard-room.mjs, tallestReachablePanel); anywhere else they fail. The ?123 key is
# known by its id, key_pos_switch_to_symbol in every language (nightly 45916711026's
# letters, on the Arabic phone too): by its name it was pressed on English phones alone,
# and the Arabic phone's recovery card kept its letters.
- runFlow:
    when:
      visible:
        id: ".*key_pos_switch_to_symbol"
    commands:
      - tapOn:
          id: ".*key_pos_switch_to_symbol"
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Emoji button"
          commands:
            - tapOn: "Emoji button"
- waitForAnimationToEnd:
    timeout: 3000
