appId: com.reelhouse.society
---
# The log form, reached as log_film_flow reaches it, with no keyboard on the
# device. It signs in for itself: a probe that could only pass after another
# passed would hide its own answer behind that one's.
- launchApp:
    clearState: true
- runFlow: ../subflows/sign_in.yaml
- extendedWaitUntil:
    visible:
      id: "darkroom-tab"
    timeout: 20000
- tapOn:
    id: "darkroom-tab"
- tapOn:
    id: "darkroom-search-input"
- inputText: "Blade Runner"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "film-card"
    timeout: 15000
- tapOn:
    id: "film-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "film-stub"
    timeout: 15000
- runFlow: ../subflows/open_the_stub.yaml
- tapOn:
    id: "film-act-log"
- extendedWaitUntil:
    visible:
      id: "review-input"
    timeout: 15000
