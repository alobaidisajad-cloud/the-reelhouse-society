appId: com.reelhouse.society
---
# Offline, then back: a log made with no connection is queued, the member is
# told it is safe, and it is sent when the connection returns
# (src/utils/offlineQueue.ts). "OPERATING IN ISOLATION" is OfflineBanner's own
# words; the reconnect toast comes from the queue's flush.
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- runFlow:
    file: subflows/open_a_film.yaml
    env:
      FILM: "Casablanca"

- toggleAirplaneMode
- extendedWaitUntil:
    visible: ".*OPERATING IN ISOLATION.*"
    timeout: 15000

- tapOn:
    id: "film-stub"
- tapOn:
    id: "film-act-log"
- extendedWaitUntil:
    visible:
      id: "review-input"
    timeout: 15000
- tapOn:
    id: "review-input"
- inputText: "E2E offline: we'll always have the queue."
- hideKeyboard
- tapOn:
    id: "submit-log-button"
- extendedWaitUntil:
    notVisible:
      id: "submit-log-button"
    timeout: 15000

- toggleAirplaneMode
- extendedWaitUntil:
    visible: ".*Archive updated with offline actions.*"
    timeout: 30000
- assertNotVisible: ".*OPERATING IN ISOLATION.*"
