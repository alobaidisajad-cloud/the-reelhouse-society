appId: com.reelhouse.society
---
# The Lobby's Pulse renders for a member without crashing. "The Pulse" is the
# section title in BOTH states — the empty room and the full feed — so it holds
# whatever the other flows have logged by the time this one runs.
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- tapOn:
    id: "home-tab"
- scrollUntilVisible:
    element: "The Pulse"
    direction: DOWN
    timeout: 20000
- assertNotVisible: "PROJECTION FAILURE"
