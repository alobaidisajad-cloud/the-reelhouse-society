appId: com.reelhouse.society
---
# The Darkroom's search: typing shows suggestions (the debounced TMDB lookup),
# and a suggestion opens the film's page. No account needed.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "darkroom-tab"
    timeout: 20000
- runFlow: subflows/open_a_film.yaml
