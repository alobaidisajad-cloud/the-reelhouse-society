appId: com.reelhouse.society
---
# The Lounge's two doors. It has no tab of its own: it is reached by the
# /lounge link (app/lounge.tsx) or the nav's Lounge icon.
#   1. A visitor meets a gate that asks for membership, which is free.
#   2. A member without a rank walks into the corridor, and meets the rope at
#      the one act that needs the rank: founding a salon opens the Society.

# ── 1. Signed out ──
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-tab"
    timeout: 20000
- openLink: "reelhouse://lounge"
- extendedWaitUntil:
    visible: ".*MEMBERS ONLY.*"
    timeout: 15000
- assertVisible:
    id: "lounge-gate-cta"
- tapOn:
    id: "lounge-gate-cta"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 15000

# ── 2. Signed in, with no rank ──
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- openLink: "reelhouse://lounge"
- extendedWaitUntil:
    visible: "READ ANY SALON · ARCHIVISTS TAKE A SEAT"
    timeout: 15000
- assertNotVisible: ".*MEMBERS ONLY.*"
- tapOn: "ESTABLISH"
- extendedWaitUntil:
    visible:
      id: "society-page"
    timeout: 15000
