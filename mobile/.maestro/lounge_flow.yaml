appId: com.reelhouse.society
---
# Lounge: there is no "Lounges" tab — Tabs.Screen name="lounge" is hidden
# (href: null in app/(tabs)/_layout.tsx). It is reached through the /lounge
# deep-link alias (app/lounge.tsx, redirects to /(tabs)/lounge) or the nav's
# Lounge icon.
#
# This flow used to sign in and then assert the LoungeGate's CLEARANCE REQUIRED.
# The corridor opened to every member, so a signed-in account has not seen that
# gate since — the flow was failing against the app as built. It now walks the
# two doors that exist: a VISITOR meets a gate that asks for membership (free),
# and a MEMBER without the rank walks into the corridor and meets the rope at
# the act that needs it.

# ── 1. Signed out: the door asks for a name, not a rank ──
- launchApp:
    clearState: true
- openLink: "reelhouse://lounge"
- assertVisible: "The Lounge"
- assertVisible: "MEMBERS ONLY"
- assertNotVisible: "CLEARANCE REQUIRED"
- assertVisible:
    id: "lounge-gate-cta"
- tapOn:
    id: "lounge-gate-cta"
# Joining is the sign-up form.
- assertVisible:
    id: "email-input"

# ── 2. Signed in without the rank: the corridor is open ──
- launchApp:
    clearState: true
- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "profile-sign-in-prompt"
- tapOn:
    id: "profile-sign-in-prompt"
- assertVisible:
    id: "email-input"
- tapOn:
    id: "email-input"
- inputText: "test@reelhouse.app"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "sign-in-submit"
- waitForAnimationToEnd

- openLink: "reelhouse://lounge"
- assertVisible: "The Lounge"
- assertVisible: "READ ANY SALON · ARCHIVISTS TAKE A SEAT"
- assertNotVisible: "MEMBERS ONLY"

# Founding a salon is the rank's act: ESTABLISH opens the Society page.
- tapOn: "ESTABLISH"
- assertVisible: "ELEVATE YOUR DEVOTION"
