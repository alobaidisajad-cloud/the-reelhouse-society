appId: com.reelhouse.society
---
# The critical path: sign in → find a film → log it with a review → the log is
# kept. Kept is proved twice: the film's tray now offers to EDIT the log, and
# after the run e2e/db/verify-writes.mjs finds the row in the database.
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- runFlow:
    file: subflows/open_a_film.yaml
    env:
      FILM: "The Godfather"
- tapOn:
    id: "film-stub"
- tapOn:
    id: "film-act-log"
- extendedWaitUntil:
    visible:
      id: "review-input"
    timeout: 15000
- tapOn:
    id: "review-input"
- inputText: "E2E critical path: an offer the archive could not refuse."
- tapOn:
    id: "submit-log-button"
# The form closes back onto the film.
- extendedWaitUntil:
    notVisible:
      id: "submit-log-button"
    timeout: 15000
- tapOn:
    id: "film-stub"
- extendedWaitUntil:
    visible: "EDIT YOUR LOG"
    timeout: 15000
