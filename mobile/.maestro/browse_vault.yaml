appId: com.reelhouse.society
---
# There is no top-level "Vault" tab — the bottom tab bar is Dispatch /
# The Reel / Lobby / Darkroom / Profile. The closest concept to "browse a
# personal collection" is one of the collection cards inside the Profile
# screen. "Physical Archive" (the renamed Vault) is gated behind an
# Archivist+ subscription the e2e test account may not have, so this
# exercises the Watchlist card instead — same intent, reachable by any
# authenticated account.
- launchApp:
    clearState: true

# The branded Preloader runs a deterministic ~2.4s "3...2...1" countdown
# AFTER real boot work (encrypted storage init, store rehydration, session
# restore) completes — give it real headroom rather than racing it.
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 15000

# Authenticate (via Profile tab's sign-in prompt — see login_flow.yaml)
- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "profile-sign-in-prompt"
- tapOn:
    id: "profile-sign-in-prompt"
- assertVisible:
    id: "email-input"
- tapOn:
    id: "email-input"
- inputText: "test@reelhouse.app"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "sign-in-submit"
- waitForAnimationToEnd

- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "collection-card-watchlist"
- tapOn:
    id: "collection-card-watchlist"
- assertVisible:
    text: "Watchlist"
