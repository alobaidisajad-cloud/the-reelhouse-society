appId: com.reelhouse.society
---
# A member opens one of their rooms from the member file's holdings. The
# Watchlist is open to every member (no rank needed), so it is the room any
# account can reach.
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- tapOn:
    id: "collection-card-watchlist"
- extendedWaitUntil:
    visible: ".*WATCHLIST.*"
    timeout: 15000
- assertNotVisible:
    id: "collection-card-watchlist"
