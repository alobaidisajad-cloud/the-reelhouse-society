appId: com.reelhouse.society
---
# Logging from the full results, not the suggestion row: submit the search,
# then open the first film card. A review is what makes a log submittable.
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- tapOn:
    id: "darkroom-tab"
- tapOn:
    id: "darkroom-search-input"
- inputText: "Blade Runner"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "film-card"
    timeout: 15000
- tapOn:
    id: "film-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "film-stub"
    timeout: 15000
- runFlow: subflows/open_the_stub.yaml
- tapOn:
    id: "film-act-log"
- extendedWaitUntil:
    visible:
      id: "review-input"
    timeout: 15000
- tapOn:
    id: "review-input"
- inputText: "E2E results path: more human than human."
- tapOn:
    id: "submit-log-button"
- extendedWaitUntil:
    notVisible:
      id: "submit-log-button"
    timeout: 15000
