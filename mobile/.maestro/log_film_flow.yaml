appId: com.reelhouse.society
---
# Critical Path: Login → Search Film → Log Film → Confirm Modal Closes
- launchApp:
    clearState: true

# Authenticate (via Profile tab's sign-in prompt — see login_flow.yaml)
- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "profile-sign-in-prompt"
- tapOn:
    id: "profile-sign-in-prompt"
- assertVisible:
    id: "email-input"
- tapOn:
    id: "email-input"
- inputText: "test@reelhouse.app"
- tapOn:
    id: "password-input"
- inputText: "password123"
- tapOn:
    id: "sign-in-submit"
- waitForAnimationToEnd

# Navigate to Darkroom (Search/Discover)
- tapOn:
    id: "darkroom-tab"

# Search for a film
- tapOn:
    id: "darkroom-search-input"
- inputText: "Blade Runner"
- waitForAnimationToEnd

# Tap the first search result
- assertVisible:
    id: "film-card"
- tapOn:
    id: "film-card"
    index: 0

# Verify film detail screen loaded
- assertVisible:
    id: "log-film-button"

# Tap Log Film button
- tapOn:
    id: "log-film-button"

# Verify log modal opened — a rating or review is required to submit, so
# write a short review rather than instrumenting the custom star-rating
# control.
- assertVisible:
    id: "review-input"
- tapOn:
    id: "review-input"
- inputText: "Great film, loved the cinematography."

# Submit the log
- tapOn:
    id: "submit-log-button"
- waitForAnimationToEnd

# A successful submit calls router.back(), closing the modal.
- assertNotVisible:
    id: "submit-log-button"
