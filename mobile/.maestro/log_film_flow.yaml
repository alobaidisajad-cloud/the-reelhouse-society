appId: com.reelhouse.society
---
# Critical Path: Login → Search Film → Log Film → Verify on Reels Feed
- launchApp:
    clearState: true

# Authenticate
- assertVisible:
    id: "sign-in-button"
- tapOn:
    id: "sign-in-button"
- assertVisible:
    text: "Enter your email"
- inputText: "test@reelhouse.app"
- tapOn:
    id: "continue-button"
- assertVisible:
    text: "Enter your password"
- inputText: "password123"
- tapOn:
    id: "sign-in-submit"
- assertVisible:
    id: "home-tab"

# Navigate to Darkroom (Search/Discover)
- tapOn:
    id: "darkroom-tab"
- assertVisible:
    text: "THE DARKROOM"

# Search for a film
- tapOn:
    id: "darkroom-search-input"
- inputText: "Blade Runner"
- waitForAnimationToEnd

# Tap the first search result
- assertVisible:
    id: "film-card"
- tapOn:
    id: "film-card"
    index: 0

# Verify film detail screen loaded
- assertVisible:
    id: "log-film-button"

# Tap Log Film button
- tapOn:
    id: "log-film-button"

# Verify log modal opened
- assertVisible:
    text: "LOG FILM"

# Set a rating (tap the 4th reel)
- tapOn:
    id: "rating-reel-4"

# Submit the log
- tapOn:
    id: "submit-log-button"
- waitForAnimationToEnd

# Navigate to Reels tab to verify the log appears
- tapOn:
    id: "reels-tab"
- assertVisible:
    text: "The Reel"
