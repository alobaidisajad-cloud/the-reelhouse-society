name: 🔬 Study — Android cold start

# A one-off study, on its own branch (never main). Same runner, emulator and
# options as the Sealed E2E. Builds (mobile/e2e/study/arm.mjs):
#   A the app · Z A's own APK again (the A/A noise check) · B no start-up prefetch
#   C B without the welcome's full-screen SVGs · E B with the light as native
#   gradients · S B with expo-image built from source (Glide logs off)
#   P the download-only prefetch patch (expo-image from source, Glide logs on)
# Proofs first (screenshots B vs E, traces, CPU profiles, P's and S's logs),
# then timed rounds on one boot. iOS: B vs E screenshots on the simulator.
# Results come out as annotations (readable without signing in) and artifacts.

on:
  push:
    branches: [study/cold-start]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# shots: only the screenshots (B, E and N, the ground with no light); all: everything.
env:
  STUDY: shots

jobs:
  android:
    name: 🔬 Android — seven builds, one boot
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: mobile/package-lock.json

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # The welcome asks tmdb-proxy for the week's trending films: the recorded
      # stand-in answers, as in the Sealed E2E. Nothing else on a signed-out
      # start needs the database.
      - name: Start the local stack
        run: |
          cp -r supabase/functions/sign-in-with-username mobile/e2e/supabase/functions/
          (cd mobile/e2e && supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta) > "$RUNNER_TEMP/start.log" 2>&1 \
            || { tail -n 30 "$RUNNER_TEMP/start.log"; exit 1; }

      - name: Keys for the local stack
        working-directory: mobile/e2e
        run: |
          keys=$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | sed 's/"//g')
          for k in API_URL ANON_KEY; do grep -qE "^$k=.+" <<< "$keys" || { echo "::error::no $k"; exit 1; }; done
          echo "$keys" >> "$GITHUB_ENV"

      - name: Install the app's packages
        working-directory: mobile
        run: npm ci

      - name: Build the seven apps
        working-directory: mobile
        env:
          E2E: '1'
          EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -u
          B="$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/apks"
          build() {  # <name> [extra gradle args]
            local name=$1
            shift
            (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain "$@" \
                "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g") >> "$B" 2>&1 \
              && cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apks/$name.apk" \
              && echo "built $name: $(stat -c %s "$RUNNER_TEMP/apks/$name.apk") bytes"
          }
          fail() { echo "::error title=Study build::$1"; grep -n -A 20 'What went wrong' "$B" | head -n 40; grep -nE '^e: |error:' "$B" | head -n 20; tail -n 30 "$B"; exit 1; }
          reset() { git checkout -- src package.json; }
          npx expo prebuild --platform android --no-install --clean >> "$B" 2>&1 || fail "prebuild"
          if [ "$STUDY" = shots ]; then
            node e2e/study/arm.mjs B && build B || fail "B"
            reset; node e2e/study/arm.mjs E && build E || fail "E"
            reset; node e2e/study/arm.mjs N && build N || fail "N"
            for L in LPs LPn LFs LFn LCs LCn LVs LVn LHs LHn; do
              reset; node e2e/study/arm.mjs $L && build $L || fail "$L"
            done
            reset
            ls -la "$RUNNER_TEMP/apks"
            exit 0
          fi
          build A || fail "A"
          cp "$RUNNER_TEMP/apks/A.apk" "$RUNNER_TEMP/apks/Z.apk"
          node e2e/study/arm.mjs B && build B || fail "B"
          reset; node e2e/study/arm.mjs C && build C || fail "C"
          reset; node e2e/study/arm.mjs E && build E || fail "E"
          # From here expo-image is compiled from its source, not Expo's AAR.
          reset; node e2e/study/arm.mjs B && node e2e/study/arm.mjs SOURCE && build S || fail "S"
          reset; node e2e/study/arm.mjs P && node e2e/study/arm.mjs SOURCE && build P -PEXPO_ALLOW_GLIDE_LOGS=true || fail "P"
          reset
          pkill -f 'KotlinCompileDaemon|GradleDaemon' || true
          ls -la "$RUNNER_TEMP/apks"

      # What the built apps themselves say: the drawable ids, and the log level
      # each one hands Glide (2 = VERBOSE, 6 = ERROR).
      - name: The APKs' own answers
        working-directory: mobile
        run: |
          set +e
          F="$RUNNER_TEMP/apk-facts.txt"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          {
            echo "2131230858 = 0x$(printf '%x' 2131230858) = $("$BT/aapt2" dump resources "$RUNNER_TEMP/apks/A.apk" | grep 'resource 0x7f08008a ' | sed 's/^ *//')"
            for apk in A S P; do
              X="$RUNNER_TEMP/dex-$apk"; mkdir -p "$X"
              unzip -q -o "$RUNNER_TEMP/apks/$apk.apk" 'classes*.dex' -d "$X"
              level=$(for f in "$X"/*.dex; do "$BT/dexdump" -d "$f"; done \
                | awk '/Class descriptor  : .Lexpo\/modules\/image\/ExpoImageAppGlideModule;/ { p = 1 } p && /applyOptions/ { q = 1 } q && /setLogLevel/ { print prev; exit } { prev = $0 }' \
                | grep -oE '#int [0-9]+')
              echo "$apk: Glide log level handed over = ${level:-not found} (2 VERBOSE, 6 ERROR)"
            done
            echo "expo-image prebuilt AAR's BuildConfig.ALLOW_GLIDE_LOGS:"
            unzip -p node_modules/expo-image/local-maven-repo/BareExpo/expo.modules.image/*/expo.modules.image-*.aar classes.jar > "$RUNNER_TEMP/expo-image-classes.jar"
            unzip -p "$RUNNER_TEMP/expo-image-classes.jar" expo/modules/image/BuildConfig.class > "$RUNNER_TEMP/BuildConfig.class"
            javap -constants -cp "$RUNNER_TEMP" -c "$RUNNER_TEMP/BuildConfig.class" 2>/dev/null | grep ALLOW || echo "(javap could not read it)"
          } > "$F" 2>&1
          cat "$F"
          node e2e/annotate.mjs "Study: the APKs' own answers" "$F" notice

      - name: The functions, warmed
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -d '{"path":"/trending/movie/week"}' "$API_URL/functions/v1/tmdb-proxy")
            [ "$code" = "200" ] && { echo "tmdb-proxy 200"; exit 0; }
            sleep 2
          done
          echo "::error::tmdb-proxy never answered"; exit 1

      - name: Let the emulator use the runner's KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Proofs, then timed rounds, on one emulator boot
        timeout-minutes: 170
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash mobile/e2e/study/ab.sh

      - name: The proofs
        if: always()
        working-directory: mobile
        run: |
          S="$RUNNER_TEMP/study"
          node e2e/study/proofs.mjs "$S" > "$S/proofs.txt" 2>&1
          cat "$S/device.txt" "$S/proofs.txt"
          node e2e/annotate.mjs "Study: device" "$S/device.txt" notice
          node e2e/annotate.mjs "Study: proofs" "$S/proofs.txt" notice
          [ -s "$S/anomalies.txt" ] && node e2e/annotate.mjs "Study: starts that took long, and failures" "$S/anomalies.txt" notice
          true

      - name: One light at a time
        if: always()
        working-directory: mobile
        run: |
          for k in LP LF LC LV LH; do
            f="$RUNNER_TEMP/study/shots/layer-$k.txt"
            [ -s "$f" ] && node e2e/annotate.mjs "Study: layer $k" "$f" notice
          done
          true

      - name: Thumbnails (x4 brighter, base64 PNG)
        if: always()
        working-directory: mobile
        run: |
          for s in B1 E1 N1; do
            p="$RUNNER_TEMP/study/shots/$s.png"
            [ -s "$p" ] && echo "::notice title=thumb android $s::$(node e2e/study/thumb.mjs "$p" 72)"
          done
          true

      - name: The numbers
        if: always()
        working-directory: mobile
        run: |
          S="$RUNNER_TEMP/study"
          node e2e/study/analyze.mjs "$S" > "$S/summary.txt" 2>&1
          cat "$S/summary.txt"
          awk -v d="$S" '/^## /{ n++ } { print > (d "/part-" n ".txt") }' "$S/summary.txt"
          for p in 1 2; do
            [ -s "$S/part-$p.txt" ] || continue
            title=$(head -n 1 "$S/part-$p.txt" | sed 's/^## //' | cut -c1-50)
            split -l 38 -d "$S/part-$p.txt" "$S/piece-$p-"
            for piece in "$S"/piece-$p-*; do
              node e2e/annotate.mjs "Study: $title (${piece##*-})" "$piece" notice
            done
          done

      - name: The traces
        if: always()
        run: |
          S="$RUNNER_TEMP/study"
          cd "$S"
          curl -sSL -o tp https://get.perfetto.dev/trace_processor && chmod +x tp
          for arm in A C E; do
            t="traces/$arm.pftrace"
            if [ ! -s "$t" ]; then
              { echo "no trace for $arm:"; tail -n 6 "traces/$arm.perfetto.txt" 2>/dev/null; } > "traces/$arm.sql.txt"
            else
              for q in "$GITHUB_WORKSPACE"/mobile/e2e/study/sql/*.pfsql; do
                echo "── $(basename "$q" .pfsql)"
                ./tp --query-file "$q" "$t" 2>&1 | grep -v -E '^\s*$|Loading trace|Trace loaded|^\[' | head -n 32
              done > "traces/$arm.sql.txt"
            fi
            cat "traces/$arm.sql.txt"
            awk '/^── 8-/{ exit } { print }' "traces/$arm.sql.txt" > "traces/$arm.sql-short.txt"
            node "$GITHUB_WORKSPACE/mobile/e2e/annotate.mjs" "Study: trace $arm" "traces/$arm.sql-short.txt" notice
          done

      - name: The long stretches and the CPU profiles
        if: always()
        run: |
          S="$RUNNER_TEMP/study/traces"
          for arm in A C E; do
            awk '/^── 8-/{ p = 1 } p { print }' "$S/$arm.sql.txt" > "$S/$arm.deep.txt" 2>/dev/null
            node mobile/e2e/annotate.mjs "Study: main thread's long stretches, $arm" "$S/$arm.deep.txt" notice
          done
          for arm in A C; do
            cat "$S/$arm.perf-record.txt" "$S/$arm.perf-app.txt" 2>/dev/null | grep -v -E '^\s*$' > "$S/$arm.perf-short.txt"
            node mobile/e2e/annotate.mjs "Study: CPU profile of the app, $arm" "$S/$arm.perf-short.txt" notice
          done
          true

      - name: Keep the study
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-cold-start-android
          path: |
            ${{ runner.temp }}/study
            ${{ runner.temp }}/apk-facts.txt
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore

  ios:
    name: 🔬 iOS — the light, SVG against native gradients
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install the app's packages
        working-directory: mobile
        run: npm ci

      - name: Xcode and the simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone' | head -n 12

      # Both builds have the welcome's endless loops stilled (arm STILL), so only
      # the light can differ between them. No backend: the welcome's look needs none.
      - name: Build B and E for the simulator
        working-directory: mobile
        env:
          E2E: '1'
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: e2e-study-placeholder
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -u
          L="$RUNNER_TEMP/ios-build.log"
          mkdir -p "$RUNNER_TEMP/ios"
          fail() { echo "::error title=Study iOS build::$1"; grep -nE 'error:|\*\* BUILD FAILED' "$L" | head -n 30; tail -n 40 "$L"; exit 1; }
          node e2e/study/arm.mjs B && node e2e/study/arm.mjs STILL || fail "arm B"
          npx expo prebuild --platform ios --clean >> "$L" 2>&1 || fail "prebuild / pod install"
          WS=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace $WS, scheme $SCHEME"
          build() {
            xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS=arm64 >> "$L" 2>&1 \
              && rm -rf "$RUNNER_TEMP/ios/$1.app" \
              && cp -R "$(ls -d ios/build/Build/Products/Release-iphonesimulator/*.app | head -n 1)" "$RUNNER_TEMP/ios/$1.app" \
              && echo "built $1"
          }
          build B || fail "B"
          git checkout -- src
          node e2e/study/arm.mjs E && node e2e/study/arm.mjs STILL && build E || fail "E"
          git checkout -- src
          node e2e/study/arm.mjs N && node e2e/study/arm.mjs STILL && build N || fail "N"
          git checkout -- src

      - name: Screenshots on the simulator
        run: |
          set -u
          S="$RUNNER_TEMP/study"
          mkdir -p "$S/shots-ios"
          DEV=$(xcrun simctl list devices available | grep -E 'iPhone 16 Pro \(' | head -n 1 | grep -oE '[0-9A-F-]{36}')
          [ -n "$DEV" ] || DEV=$(xcrun simctl list devices available | grep -E 'iPhone' | head -n 1 | grep -oE '[0-9A-F-]{36}')
          echo "device $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          sleep 20
          shot() {
            xcrun simctl install "$DEV" "$RUNNER_TEMP/ios/$2.app"
            xcrun simctl launch "$DEV" com.reelhouse.society > "$S/shots-ios/$1.launch.txt" 2>&1
            sleep 25
            { echo "── $1: running after 25 s?"; xcrun simctl spawn "$DEV" launchctl list | grep -i reelhouse || echo "NOT RUNNING"; } >> "$S/shots-ios/diag.txt"
            xcrun simctl io "$DEV" screenshot "$S/shots-ios/$1.png"
            xcrun simctl terminate "$DEV" com.reelhouse.society || true
            xcrun simctl uninstall "$DEV" com.reelhouse.society
          }
          diag() {
            {
              echo "── log after $1"
              xcrun simctl spawn "$DEV" log show --last 2m --style compact \
                --predicate 'processImagePath CONTAINS[c] "reelhouse"' 2>&1 | grep -v '^[[:space:]]*$' | tail -n 60
              echo "── crash reports"
              ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i -E 'reel|society' || echo none
            } >> "$S/shots-ios/diag.txt"
          }
          shot B1 B
          diag B1
          shot E1 E
          shot N1 N
          shot B2 B
          shot E2 E
          ls -la "$S/shots-ios"

      - name: The iOS proof
        if: always()
        working-directory: mobile
        run: |
          node e2e/annotate.mjs "Study: iOS launch diagnostics" "$RUNNER_TEMP/study/shots-ios/diag.txt" notice
          for s in B1 E1 N1; do
            p="$RUNNER_TEMP/study/shots-ios/$s.png"
            [ -s "$p" ] && echo "::notice title=thumb ios $s::$(node e2e/study/thumb.mjs "$p" 72)"
          done
          S="$RUNNER_TEMP/study"
          node e2e/study/proofs.mjs "$S" shots-ios > "$S/proofs-ios.txt" 2>&1
          cat "$S/proofs-ios.txt"
          node e2e/annotate.mjs "Study: iOS proof" "$S/proofs-ios.txt" notice

      - name: Keep the iOS study
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-cold-start-ios
          path: |
            ${{ runner.temp }}/study
            ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
