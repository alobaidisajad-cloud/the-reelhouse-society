name: 📱 iPhone launch

# ── THE APP OPENS ON AN IPHONE, WITH ITS ANIMATIONS ON ──────────────────────────
# Every launch with animations on aborted within 5 s on iPhones once (an
# animation config with an empty key), and nothing that ran on Android caught
# it. So on every push and pull request: a Release build for the simulator,
# signed to run locally (an unsigned build never starts, so a signing failure
# fails the job), launched on a freshly booted simulator, whose animations are
# on. It must be alive at 5 s and at 25 s, and its first screen must say it is
# ready by 25 s in the app's own log stream (a launch that never drew fails). No
# backend: the first screen needs none. Then, on the same simulator, the flows
# that need no server (mobile/e2e/ios-flows.json), by Maestro.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launch:
    name: 📱 The app opens on an iPhone
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install the app's packages
        working-directory: mobile
        run: npm ci

      - name: A Release build for the simulator, signed to run locally
        working-directory: mobile
        env:
          E2E: '1'
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ios-launch-placeholder
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -u
          L="$RUNNER_TEMP/ios-build.log"
          xcodebuild -version
          npx expo prebuild --platform ios --clean > "$L" 2>&1 || { tail -n 40 "$L"; exit 1; }
          WS=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WS" .xcworkspace)
          if ! xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build \
              ONLY_ACTIVE_ARCH=YES ARCHS=arm64 >> "$L" 2>&1; then
            grep -nE 'error:|\*\* BUILD FAILED|[Ss]igning' "$L" | head -n 30 > "$RUNNER_TEMP/build-errors.txt"
            node e2e/annotate.mjs "The iPhone build failed (it is never built unsigned: an unsigned build never starts)" "$RUNNER_TEMP/build-errors.txt"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ios"
          cp -R "$(ls -d ios/build/Build/Products/Release-iphonesimulator/*.app | head -n 1)" "$RUNNER_TEMP/ios/app.app"

      - name: Launched on a fresh simulator, animations on
        working-directory: mobile
        run: |
          set -u
          S="$RUNNER_TEMP/launch"; mkdir -p "$S"
          DEV=$(xcrun simctl list devices available | grep -E 'iPhone 16 Pro \(' | head -n 1 | grep -oE '[0-9A-F-]{36}')
          [ -n "$DEV" ] || DEV=$(xcrun simctl list devices available | grep -E 'iPhone' | head -n 1 | grep -oE '[0-9A-F-]{36}')
          echo "SIM_DEVICE=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$RUNNER_TEMP/ios/app.app"
          # A JS console.warn is written at the Info level, which `log show` leaves out
          # without --info: so a stream, started before the launch.
          # Each second for 45 s, the process launchd runs for the app ("-" for
          # none); e2e/ios-launch.cjs gives the verdict from the samples, the JS
          # log and any crash report.
          launch() {
            : > "$S/stream-$1.txt"; : > "$S/samples-$1.txt"
            xcrun simctl spawn "$DEV" log stream --level info --style compact \
              --predicate 'subsystem == "com.facebook.react.log" AND category == "javascript"' > "$S/stream-$1.txt" 2>&1 &
            stream=$!
            sleep 2
            start=$(date +%s)
            # Without a console, simctl answers "<bundle id>: <pid>" as soon as it has
            # started the app (with --console-pty it says so only when the app ends);
            # the app's own output goes to a file. The process is then read each
            # second with the host's ps (a simulator's app is a host process).
            xcrun simctl launch --stdout="$S/console-$1.txt" --stderr="$S/console-$1.txt" \
              "$DEV" com.reelhouse.society > "$S/launched-$1.txt" 2>&1 || true
            pid=""; seen=""
            while [ $(( $(date +%s) - start )) -le 90 ]; do
              now=$(( $(date +%s) - start ))
              [ -n "$pid" ] || pid=$(sed -n 's/^com\.reelhouse\.society: \([0-9][0-9]*\).*/\1/p' "$S/launched-$1.txt" | head -n 1)
              if [ -n "$pid" ] && ps -p "$pid" > /dev/null 2>&1; then
                echo "$now $pid" >> "$S/samples-$1.txt"; [ -n "$seen" ] || seen=$now
              else
                echo "$now -" >> "$S/samples-$1.txt"
              fi
              { [ -n "$seen" ] && [ "$now" -ge $(( seen + 30 )) ]; } && break
              { [ -z "$pid" ] && [ "$now" -ge 60 ]; } && break
              sleep 1
            done
            kill $stream 2>/dev/null || true
            xcrun simctl terminate "$DEV" com.reelhouse.society > /dev/null 2>&1 || true
            rc=0
            v=$(node e2e/ios-launch.cjs "$S/samples-$1.txt" "$S/stream-$1.txt" "$start") || rc=$?
            echo "attempt $1: $v" >> "$S/result.txt"
            last=$1
          }
          # The app failing is never tried again. A simulator that never started
          # it (exit 2), or a first launch that stayed up but drew late (exit 3),
          # gets once more; the second launch's verdict is final.
          launch 1
          if [ "$rc" = "2" ] || [ "$rc" = "3" ]; then
            echo "attempt 1: exit $rc, once more as the harness's own retry" >> "$S/result.txt"
            launch 2
          fi
          cat "$S/result.txt"
          if [ "$rc" != "0" ]; then
            { cat "$S/result.txt"
              echo "── the app's own output:"; grep -v '^[[:space:]]*$' "$S/console-$last.txt" 2>/dev/null | tail -n 25
              echo "── its JS log:"; tail -n 25 "$S/stream-$last.txt" 2>/dev/null
              echo "── crash report:"; node e2e/ios-crash.mjs; } > "$S/why.txt"
            node e2e/annotate.mjs "The app did not open on an iPhone" "$S/why.txt"
            exit 1
          fi

      # The first iOS flow runner (WORKLIST P0.89): on the same simulator, with the app installed,
      # the flows that need no server (mobile/e2e/ios-flows.json). The flows that read the house join
      # once the iOS world reaches one (P0.92).
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maestro 2.10.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-dist"
          echo "MAESTRO_BIN=$HOME/.maestro-dist/maestro/bin/maestro" >> "$GITHUB_ENV"

      - name: The flows that need no server, on the simulator
        working-directory: mobile
        env:
          # Maestro starts its iPhone driver for each flow; on a hosted Mac it once outlived the
          # default wait (iPhone launch at ed79856d: "iOS driver not ready in time"). Three minutes.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
        run: |
          set +e
          S="$RUNNER_TEMP/ios-flows"
          mkdir -p "$S"
          rc=0
          # A member who once answered iOS's "Open in ...?" for this app is not asked again, and the
          # simulator starts as one: the check behind that question once neither asked nor opened the
          # link (iPhone launch 39795157842), so it is answered before any flow runs.
          xcrun simctl spawn "$SIM_DEVICE" defaults write com.apple.launchservices.schemeapproval \
            'com.apple.CoreSimulator.CoreSimulatorBridge-->reelhouse' -string com.reelhouse.society
          for f in $(node -e "process.stdout.write(require('./e2e/ios-flows.json').flows.join(' '))"); do
            if "$MAESTRO_BIN" --device "$SIM_DEVICE" test ".maestro/$f" --debug-output "$S/${f%.yaml}" > "$S/${f%.yaml}.txt" 2>&1 < /dev/null; then
              echo "$f: passed"
            else
              rc=1
              echo "$f: FAILED"
              xcrun simctl io "$SIM_DEVICE" screenshot "$S/after-${f%.yaml}.png" > /dev/null 2>&1 || true
              tail -n 40 "$S/${f%.yaml}.txt" > "$S/why-${f%.yaml}.txt"
              node e2e/annotate.mjs "The flow $f failed on the iPhone simulator" "$S/why-${f%.yaml}.txt"
            fi
          done
          exit $rc

      # Maestro writes its screenshots under a hidden .maestro folder, which the upload skips unless asked.
      - name: Keep the flows' records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-flows
          path: ${{ runner.temp }}/ios-flows
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
