name: 🎬 Sealed E2E

# ── THE APP, END TO END, IN A WORLD THAT CANNOT TOUCH PRODUCTION ────────────────
# Its own world, built on the runner, every run, from nothing:
#   · a local Supabase with production's exact shape, built from the committed
#     snapshot (mobile/supabase/schema/*.sql), and CHECKED against it with
#     schema:check — a copy that differs proves nothing about production
#   · production's host pointed at 0.0.0.0, on the runner and inside every
#     container, and proved: the database's one outbound call cannot connect
#   · members made through the auth API, with a fresh password each run
#   · TMDB answered from recordings (e2e/supabase/functions/tmdb-proxy), and
#     every request with no recording listed on the run's summary
#
# Free: the repository is public, so Actions minutes cost nothing.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job, in this order, for two reasons: the emulator reaches the backend at
# 10.0.2.2 (the runner), so both must be on the same machine; and the app is
# built BEFORE the seal, because the build downloads packages and the seal
# firewalls addresses that production shares with other Cloudflare sites.
jobs:
  app:
    name: 🎬 The app, end to end, in a sealed world
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # Which flows run, for run-flows.sh and verify-writes.mjs alike: every flow
      # in the folder (subflows/ holds only the steps they share).
      E2E_FLOWS: mobile/.maestro
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          # android/ is made by prebuild, so there is no Gradle file to key on yet.
          # The lock file changes whenever a native dependency does.
          cache-dependency-path: mobile/package-lock.json

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # The snapshot was taken with pg_dump 18; the fidelity check must read the
      # copy with the same major, or every line of formatting looks like drift.
      - name: Postgres 18 client tools
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # sign-in-with-username is production's own function, copied in BEFORE the
      # stack starts: config.toml names it, and the CLI checks what it names.
      - name: Start the local stack
        run: |
          cp -r supabase/functions/sign-in-with-username mobile/e2e/supabase/functions/
          set +e
          (cd mobile/e2e && supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta) > "$RUNNER_TEMP/start.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/start.log"
          if [ $rc -ne 0 ]; then
            tail -n 30 "$RUNNER_TEMP/start.log" > "$RUNNER_TEMP/start-tail.txt"
            node mobile/e2e/annotate.mjs "E2E local stack would not start" "$RUNNER_TEMP/start-tail.txt"
          fi
          exit $rc

      # All three, or the run stops here by name: an empty key would build the app
      # anyway and fail later, blaming the functions.
      - name: Keys for the local stack
        working-directory: mobile/e2e
        run: |
          set -o pipefail
          keys=$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | sed 's/"//g') || keys=''
          for k in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            grep -qE "^$k=.+" <<< "$keys" || { echo "::error title=E2E keys::supabase status gave no $k — the local stack is not up"; exit 1; }
          done
          echo "$keys" >> "$GITHUB_ENV"

      - name: Install the app's packages
        working-directory: mobile
        run: npm ci

      # A release build, as a store build is made — only its backend differs:
      # the runner, seen from the emulator as 10.0.2.2. app.config.js allows
      # plain http and turns updates off for E2E=1, and the manifest is checked.
      # Gradle gets 6 GB and 2 GB of Metaspace: the template's 512 MB Metaspace
      # ran out in a library's release lint (the runner has 16 GB).
      - name: Build the E2E app (release APK)
        working-directory: mobile
        env:
          E2E: '1'
          EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set +e
          {
            npx expo prebuild --platform android --no-install --clean \
            && grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml \
            && (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain \
                  "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError")
          } > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          tail -n 200 "$RUNNER_TEMP/build.log"
          if [ $rc -ne 0 ]; then
            # Gradle's own verdict, then real errors (Kotlin "e: ", compilers' "error:",
            # failed tasks) — never "w: " warnings that merely mention an error.
            {
              grep -n -A 20 'What went wrong' "$RUNNER_TEMP/build.log" | head -n 30
              grep -nE '^e: |[^a-z]error: |FAILED|Error: |usesCleartextTraffic' "$RUNNER_TEMP/build.log" | grep -v '^[0-9]*:w: ' | head -n 25
              grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml 2>/dev/null || echo "(the manifest does not allow plain http, or prebuild did not finish)"
            } > "$RUNNER_TEMP/build-errors.txt"
            node e2e/annotate.mjs "E2E app build failed" "$RUNNER_TEMP/build-errors.txt"
          fi
          # The Kotlin compiler's daemon outlives a --no-daemon build, holding
          # gigabytes the emulator will need.
          pkill -f 'KotlinCompileDaemon|GradleDaemon' || true
          exit $rc

      # Maestro at one release, checked against the digest recorded when it was pinned.
      - name: Install Maestro 2.10.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-dist"
          echo "MAESTRO_BIN=$HOME/.maestro-dist/maestro/bin/maestro" >> "$GITHUB_ENV"

      # Started BEFORE the seal, and each function called once. The runtime
      # fetches a function's remote imports (deno.land, the esm CDN) on first use,
      # and those sit on Cloudflare like production does — so they load while
      # the network is whole, and the seal cannot starve them by sharing an
      # address. sign-in-with-username is production's own function, served as
      # it is; tmdb-proxy is the recorded stand-in (e2e/supabase/config.toml
      # opens both, and ships the stand-in's recordings).
      # No `functions serve`: `supabase start` already serves e2e/supabase/functions,
      # and a second runtime kills the first mid-request.
      - name: The functions, warmed before the seal
        run: |
          call() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
                     -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -d "$2" "$API_URL/functions/v1/$1" || true; }
          for i in $(seq 1 60); do
            tmdb=$(call tmdb-proxy '{"path":"/trending/movie/week"}')
            [ "$tmdb" = "200" ] && break
            sleep 2
          done
          # No member exists yet, so the answer is its ordinary refusal — which
          # proves it loaded, imports and all.
          signin=$(call sign-in-with-username '{"username":"warm","password":"up"}')
          if [ "$tmdb" != "200" ] || [ "$signin" != "401" ]; then
            # The report must come out even if gathering it half-fails: Actions
            # runs this with -e, and a failing `docker logs` ended the step silently.
            set +e
            T="$RUNNER_TEMP/functions-tail.txt"
            echo "(tmdb-proxy answered HTTP ${tmdb:-none}; sign-in-with-username HTTP ${signin:-none})" > "$T"
            # The functions runtime writes to its container's own log.
            echo "── containers: $(docker ps -a --format '{{.Names}}' | tr '\n' ' ')" >> "$T"
            for c in $(docker ps -a --format '{{.Names}}' | grep -i edge); do
              echo "── docker logs $c (last 30) ──" >> "$T"
              docker logs --tail 30 "$c" >> "$T" 2>&1
            done
            node mobile/e2e/annotate.mjs "E2E functions never came up — the runtime's last words" "$RUNNER_TEMP/functions-tail.txt"
            exit 1
          fi
          echo "tmdb-proxy $tmdb, sign-in-with-username $signin: both loaded"

      # Two locks — the firewall for every container, and the name pointed nowhere
      # — proved here from the runner and in bootstrap from inside the database.
      - name: Seal it — production's host goes nowhere, from the runner or any container
        run: bash mobile/e2e/db/seal.sh "E2E seal"

      - name: Build production's shape from the snapshot
        run: node mobile/e2e/db/bootstrap.mjs

      - name: Fidelity — the copy must produce the same snapshot as production
        env:
          SNAPSHOT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SNAPSHOT_SAME_MAJOR: '1'
        run: |
          set +e
          node mobile/scripts/schema-snapshot.mjs --check > "$RUNNER_TEMP/fidelity.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/fidelity.txt"
          [ $rc -eq 0 ] || node mobile/e2e/annotate.mjs "E2E fidelity — the copy differs from production" "$RUNNER_TEMP/fidelity.txt"
          exit $rc

      - name: Seed the members
        run: node mobile/e2e/db/seed.mjs

      - name: The functions answer as the app needs
        run: node mobile/e2e/db/verify-functions.mjs

      - name: The database cleans a member's words as the app does
        run: node mobile/e2e/db/verify-cleaning.mjs

      - name: Let the emulator use the runner's KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The flows, on an Android emulator
        # A backstop under the job's limit, so the steps after it still run. The
        # flows' own budget (run-flows.sh, 42 minutes) is inside this one.
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The renderer. The emulator died a second after the film page opened, in
          # every run that reached it, with `swiftshader_indirect` and then with
          # `swiftshader`: run 36708544965 caught how — the emulator process
          # itself (qemu-system-x86_64-headless) took a SIGSEGV, core kept by
          # systemd-coredump. A crash in the host's renderer, not in the app: no
          # app can fault the emulator. SwiftShader runs JIT-compiled shaders and
          # a draw it mishandles faults rather than being dropped. The same image
          # on the same runner (API 34, google_apis, pixel_6, this action) died
          # the same way under swiftshader_indirect and guest, and has survived
          # every run under `swangle_indirect`: ANGLE's GLES over SwiftShader's
          # Vulkan (omnesis-dev/Omnesis#200).
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash mobile/e2e/run-flows.sh

      - name: What the flows did, found in the database
        run: node mobile/e2e/db/verify-writes.mjs

      - name: TMDB requests with no recording
        if: always()
        run: |
          # Everything the functions runtime printed, kept for the logs artifact too.
          docker logs supabase_edge_runtime_reelhouse-e2e > "$RUNNER_TEMP/functions.log" 2>&1 || true
          # The checks ask for two paths on purpose; they are not gaps.
          grep -o 'E2E-TMDB-MISS .*' "$RUNNER_TEMP/functions.log" 2>/dev/null | grep -v 'e2e-never-recorded\|/movie/999999999' \
            | sed 's/^E2E-TMDB-MISS //' | sort -u > "$RUNNER_TEMP/tmdb-misses.txt" || true
          if [ -s "$RUNNER_TEMP/tmdb-misses.txt" ]; then
            node mobile/e2e/annotate.mjs "TMDB requests with no recording — record with: node e2e/tmdb/record.mjs --from <list>" "$RUNNER_TEMP/tmdb-misses.txt" notice
          else
            echo "### TMDB requests with no recording" >> "$GITHUB_STEP_SUMMARY"; echo "None." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Maestro's records hold each command as it ran, values filled in, so the
      # seeded member's password can sit in them in the clear. It goes before
      # anything is kept (e2e/scrub.mjs). Its own step, so a flows step killed
      # by its time limit is scrubbed too.
      - name: The member's password, out of the kept logs
        if: always()
        run: node mobile/e2e/scrub.mjs "$RUNNER_TEMP/maestro.log" "$RUNNER_TEMP/flow-reports" "$RUNNER_TEMP/flow-screens" "$RUNNER_TEMP/maestro-debug" "$RUNNER_TEMP/first-attempts" "$RUNNER_TEMP/warmup" "$RUNNER_TEMP/flow-hierarchy" "$RUNNER_TEMP/keyboard-room" "$RUNNER_TEMP/keyboard-room.txt" "$RUNNER_TEMP/logcat-stream.txt"

      # Every run, not only a failed one: a run that passed only on a second
      # attempt keeps its first, and the device's whole log names any animation
      # Android held the test on (e2e/animation-waits.mjs). Hidden files too —
      # Maestro writes its records under a `.maestro` folder, which the upload
      # skips by default, so no run before this one ever kept them.
      - name: Keep the run's logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/functions.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/maestro.log
            ${{ runner.temp }}/flow-reports
            ${{ runner.temp }}/flow-screens
            ${{ runner.temp }}/flow-hierarchy
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/first-attempts
            ${{ runner.temp }}/warmup
            ${{ runner.temp }}/keyboard-room
            ${{ runner.temp }}/keyboard-room.txt
            ${{ runner.temp }}/screen.txt
            ${{ runner.temp }}/logcat-stream.txt
            ${{ runner.temp }}/flow-times.txt
            ${{ runner.temp }}/retries.txt
            ${{ runner.temp }}/phone-fixes.txt
            ${{ runner.temp }}/app-crashes.txt
            ${{ runner.temp }}/animation-waits.txt
            ${{ runner.temp }}/memory.txt
          if-no-files-found: ignore
