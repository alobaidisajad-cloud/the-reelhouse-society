name: 🎬 Sealed E2E

# ── THE APP, END TO END, IN A WORLD THAT CANNOT TOUCH PRODUCTION ────────────────
# The old device job built with EAS (15 free Android builds a month, all used by
# 2026-09-11) and signed in as test@reelhouse.app, an account that does not
# exist in production. It could not pass, so it proved nothing.
#
# This builds its own world on the runner, every run, from nothing:
#   · a local Supabase with production's exact shape, built from the committed
#     snapshot (mobile/supabase/schema/*.sql), and CHECKED against it with
#     schema:check — a copy that differs proves nothing about production
#   · production's host pointed at 0.0.0.0, on the runner and inside every
#     container, and proved: the database's one outbound call cannot connect
#   · members made through the auth API, with a fresh password each run
#   · TMDB answered from recordings (e2e/supabase/functions/tmdb-proxy), and
#     every request with no recording listed on the run's summary
#
# Free: the repository is public, so Actions minutes cost nothing.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job, in this order, for two reasons: the emulator reaches the backend at
# 10.0.2.2 (the runner), so both must be on the same machine; and the app is
# built BEFORE the seal, because the build downloads packages and the seal
# firewalls addresses that production shares with other Cloudflare sites.
jobs:
  app:
    name: 🎬 The app, end to end, in a sealed world
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # Which flows run: read by run-flows.sh and verify-writes.mjs alike.
      # The boot flow first; the whole folder once every flow is rebuilt against today's app.
      E2E_FLOWS: mobile/.maestro/boot_verification.yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          # android/ is made by prebuild, so there is no Gradle file to key on yet.
          # The lock file changes whenever a native dependency does.
          cache-dependency-path: mobile/package-lock.json

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # The snapshot was taken with pg_dump 18; the fidelity check must read the
      # copy with the same major, or every line of formatting looks like drift.
      - name: Postgres 18 client tools
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Start the local stack
        working-directory: mobile/e2e
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta

      - name: Keys for the local stack
        working-directory: mobile/e2e
        run: supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | sed 's/"//g' >> "$GITHUB_ENV"

      - name: Install the app's packages
        working-directory: mobile
        run: npm ci

      # A release build, as a store build is made — only its backend differs:
      # the runner, seen from the emulator as 10.0.2.2. app.config.js allows
      # plain http and turns updates off for E2E=1, and the manifest is checked.
      - name: Build the E2E app (release APK)
        working-directory: mobile
        env:
          E2E: '1'
          EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set +e
          {
            npx expo prebuild --platform android --no-install --clean \
            && grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml \
            && (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain)
          } > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          tail -n 200 "$RUNNER_TEMP/build.log"
          if [ $rc -ne 0 ]; then
            # Gradle's own verdict, then real errors (Kotlin "e: ", compilers' "error:",
            # failed tasks) — never "w: " warnings that merely mention an error.
            {
              grep -n -A 20 'What went wrong' "$RUNNER_TEMP/build.log" | head -n 30
              grep -nE '^e: |[^a-z]error: |FAILED|Error: |usesCleartextTraffic' "$RUNNER_TEMP/build.log" | grep -v '^[0-9]*:w: ' | head -n 25
              grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml 2>/dev/null || echo "(the manifest does not allow plain http, or prebuild did not finish)"
            } > "$RUNNER_TEMP/build-errors.txt"
            node e2e/annotate.mjs "E2E app build failed" "$RUNNER_TEMP/build-errors.txt"
          fi
          exit $rc

      # Maestro at one release, checked against the digest recorded when it was pinned.
      - name: Install Maestro 2.10.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-dist"
          echo "MAESTRO_BIN=$HOME/.maestro-dist/maestro/bin/maestro" >> "$GITHUB_ENV"

      # Two locks, so no container has to be trusted to behave:
      #   · the firewall rejects every address production's host resolves to, for
      #     ALL container traffic (DOCKER-USER) — including containers with no
      #     shell, and ones that start later (the functions runtime)
      #   · production's name points at 0.0.0.0 on the runner, and inside every
      #     container that has a shell to write it with
      # Proved twice: here from the runner, and in bootstrap from inside the database.
      - name: Seal it — production's host goes nowhere, from the runner or any container
        run: |
          HOST=$(node -e "console.log(new URL(require('./mobile/eas.json').build.production.env.EXPO_PUBLIC_SUPABASE_URL).hostname)")
          echo "E2E_PROD_HOST=$HOST" >> "$GITHUB_ENV"
          V4=$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)
          V6=$(getent ahostsv6 "$HOST" | awk '{print $1}' | grep ':' | sort -u || true)
          [ -n "$V4" ] || { echo "::error title=E2E seal::could not resolve $HOST to seal it"; exit 1; }
          # Containers only. Production sits behind Cloudflare, whose addresses are
          # shared with other sites; the runner itself keeps them for its own tools.
          for ip in $V4; do sudo iptables -I DOCKER-USER -d "$ip" -j REJECT; done
          for ip in $V6; do sudo ip6tables -I DOCKER-USER -d "$ip" -j REJECT 2>/dev/null || true; done
          echo "E2E_PROD_IPS=$(echo $V4 | tr ' ' ',')" >> "$GITHUB_ENV"
          echo "firewalled $(echo $V4 $V6 | wc -w) address(es) of $HOST for every container"
          echo "0.0.0.0 $HOST" | sudo tee -a /etc/hosts > /dev/null
          for c in $(docker ps --format '{{.Names}}' | grep reelhouse-e2e); do
            docker exec -u root "$c" sh -c "echo '0.0.0.0 $HOST' >> /etc/hosts" 2>/dev/null \
              && echo "named away in $c" || echo "no shell in $c — the firewall covers it"
          done
          if curl -sS -m 5 -o /dev/null "https://$HOST"; then
            echo "::error title=E2E seal::the runner can still reach $HOST by name"; exit 1
          fi
          echo "The runner cannot reach $HOST by name; bootstrap proves no container can reach any of its addresses."

      - name: Build production's shape from the snapshot
        run: node mobile/e2e/db/bootstrap.mjs

      - name: Fidelity — the copy must produce the same snapshot as production
        env:
          SNAPSHOT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SNAPSHOT_SAME_MAJOR: '1'
        run: |
          set +e
          node mobile/scripts/schema-snapshot.mjs --check > "$RUNNER_TEMP/fidelity.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/fidelity.txt"
          [ $rc -eq 0 ] || node mobile/e2e/annotate.mjs "E2E fidelity — the copy differs from production" "$RUNNER_TEMP/fidelity.txt"
          exit $rc

      - name: Seed the members
        run: node mobile/e2e/db/seed.mjs

      # sign-in-with-username is production's own function, served as it is;
      # tmdb-proxy is the recorded stand-in.
      - name: Serve the functions
        run: |
          cp -r supabase/functions/sign-in-with-username mobile/e2e/supabase/functions/
          cd mobile/e2e
          nohup supabase functions serve --no-verify-jwt > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$API_URL/functions/v1/tmdb-proxy" || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { echo "::error title=E2E functions::the functions never came up"; cat "$RUNNER_TEMP/functions.log"; exit 1; }
          # The runtime is a new container; the firewall already covers it. Name the host away too.
          for c in $(docker ps --format '{{.Names}}' | grep -i edge_runtime); do
            docker exec -u root "$c" sh -c "echo '0.0.0.0 $E2E_PROD_HOST' >> /etc/hosts" 2>/dev/null \
              && echo "named away in $c" || echo "no shell in $c — the firewall covers it"
          done

      - name: The functions answer as the app needs
        run: node mobile/e2e/db/verify-functions.mjs

      - name: Let the emulator use the runner's KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The flows, on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash mobile/e2e/run-flows.sh

      - name: What the flows did, found in the database
        run: node mobile/e2e/db/verify-writes.mjs

      - name: TMDB requests with no recording
        if: always()
        run: |
          # The seal check asks for one path on purpose; it is not a gap.
          grep -o 'E2E-TMDB-MISS .*' "$RUNNER_TEMP/functions.log" 2>/dev/null | grep -v 'e2e-never-recorded\|/movie/999999999' \
            | sed 's/^E2E-TMDB-MISS //' | sort -u > "$RUNNER_TEMP/tmdb-misses.txt" || true
          if [ -s "$RUNNER_TEMP/tmdb-misses.txt" ]; then
            node mobile/e2e/annotate.mjs "TMDB requests with no recording — record with: node e2e/tmdb/record.mjs --from <list>" "$RUNNER_TEMP/tmdb-misses.txt" notice
          else
            echo "### TMDB requests with no recording" >> "$GITHUB_STEP_SUMMARY"; echo "None." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/functions.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/maestro.log
            ${{ runner.temp }}/maestro-report.xml
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/screen.txt
          if-no-files-found: ignore
