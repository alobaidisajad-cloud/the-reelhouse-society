name: 🎬 Sealed E2E

# ── THE APP, END TO END, IN A WORLD THAT CANNOT TOUCH PRODUCTION ────────────────
# Its own world, built on the runner, every run, from nothing:
#   · a local Supabase with production's exact shape, built from the committed
#     snapshot (mobile/supabase/schema/*.sql), and CHECKED against it with
#     schema:check — a copy that differs proves nothing about production
#   · production's host pointed at 0.0.0.0, on the runner and inside every
#     container, and proved: the database's one outbound call cannot connect
#   · members made through the auth API, with a fresh password each run
#   · TMDB answered from recordings (e2e/supabase/functions/tmdb-proxy), and
#     every request with no recording named on the run's summary, failing it
#
# Free: the repository is public, so Actions minutes cost nothing.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      # The fault runs (WORKLIST P0.76): mobile/.maestro/faults on one machine, judged by
      # e2e/fault-judges.mjs. nightly.yml runs them; a run by hand can too.
      faults:
        type: boolean
        required: false
        default: false
      # The lifecycle runs (WORKLIST P0.86): mobile/.maestro/lifecycle on one machine, each flow
      # changing the phone mid-flow (the text size, the density, the app killed in the background).
      lifecycle:
        type: boolean
        required: false
        default: false
      # A variant run (WORKLIST P0.86): every route opened cold by deep link and captured
      # (e2e/walk-routes.mjs), on one machine, the phone set as the variant has it and put back
      # after (run-flows.sh). The variants (mobile/e2e/variants.json): plain, motion-on, largest-text, bold-text, narrowest, three-button, right-to-left, dark
      variant:
        type: string
        required: false
        default: ''
  # A build already in members' hands, by its name in mobile/e2e/old-clients.json:
  # its app is laid over this harness, and it runs against production as it will
  # be (e2e-old-clients.yml calls this; nothing else names a client).
  workflow_call:
    inputs:
      client:
        type: string
        required: false
        default: ''
      # Which of the night's rounds this is: nightly.yml runs every flow three
      # times on one commit, so a flow that passes once and fails once is seen.
      round:
        type: string
        required: false
        default: ''
      # The fault runs instead of the flows (see workflow_dispatch above).
      faults:
        type: boolean
        required: false
        default: false
      # The lifecycle runs instead of the flows (see workflow_dispatch above).
      lifecycle:
        type: boolean
        required: false
        default: false
      # A variant run instead of the flows (see workflow_dispatch above).
      variant:
        type: string
        required: false
        default: ''

# A run is never cancelled by a later push: each commit's run finishes and is
# read. Its group is its own commit, because GitHub keeps one waiting run per
# group and drops an older one waiting: grouped by branch, three quick pushes
# left the middle commit with no run at all. A night's rounds of one commit are
# each their own group, for the same reason.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}${{ inputs.round }}${{ inputs.faults && '-faults' || '' }}${{ inputs.lifecycle && '-lifecycle' || '' }}${{ inputs.variant && format('-{0}', inputs.variant) || '' }}
  cancel-in-progress: false

permissions:
  contents: read
  # The lifecycle run's upgrade reads the shipped-clients run's app (its runs and artifacts, read only).
  actions: read

env:
  # Which flows run, for run-flows.sh, verify-writes.mjs and the verdict alike:
  # every flow in the folder (subflows/ holds only the steps they share); the
  # fault runs' own folder when faults is on, the lifecycle runs' when lifecycle is.
  # A variant that walks the routes alone has none (the flows job says so).
  E2E_FLOWS: ${{ inputs.faults && 'mobile/.maestro/faults' || inputs.lifecycle && 'mobile/.maestro/lifecycle' || 'mobile/.maestro' }}
  # A fault run: run-flows.sh clears the fault before each flow and judges the run
  # with e2e/fault-judges.mjs instead of the screens' times.
  E2E_FAULTS: ${{ inputs.faults && '1' || '' }}
  # A lifecycle run: run-flows.sh puts the phone back before each flow, and holds no screen to a ceiling.
  E2E_LIFECYCLE: ${{ inputs.lifecycle && '1' || '' }}
  # A variant run: the whole run on the phone as the variant has it (run-flows.sh), then the
  # route walk (the flows job says where), its rooms seeded (seed.mjs).
  E2E_VARIANT: ${{ inputs.variant }}
  # The shipped client this run is of, or empty for the app it is run on.
  E2E_OLD_CLIENT: ${{ inputs.client }}
  # Its name on the run's artifacts, so two clients, or two rounds, called in one
  # run never share one.
  E2E_TAG: ${{ inputs.client && format(' - {0}', inputs.client) || inputs.round && format(' - round {0}', inputs.round) || inputs.faults && ' - faults' || inputs.lifecycle && ' - lifecycle' || inputs.variant && format(' - {0}', inputs.variant) || '' }}

# Three jobs. The app is built once (build), and its flows run on three
# machines at once (flows), each its part of mobile/e2e/shards.json: a machine
# runs a whole sealed world of its own, since the emulator reaches the backend
# at 10.0.2.2, its own runner. The app is built away from any seal, because the
# build downloads packages and the seal firewalls addresses that production
# shares with other Cloudflare sites. Then the verdict reads every shard's logs
# for what no one machine can judge (e2e/shard-verdict.mjs).
jobs:
  build:
    name: 🎬 The app, built once for every shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # What a variant run runs (e2e/variants.json): "flows", every flow on three machines and
    # then the walk, or "walk", the walk alone on one.
    outputs:
      runs: ${{ steps.variant.outputs.runs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # First, so a variant not in the list stops the run before anything is built.
      - name: What the variant runs
        id: variant
        if: ${{ inputs.variant }}
        run: |
          runs=$(node mobile/e2e/variants.mjs "$E2E_VARIANT" runs) || exit 1
          echo "runs=$runs" >> "$GITHUB_OUTPUT"

      # Before the package cache is keyed: the client's own lock file decides it.
      - name: The shipped client's app, over this harness
        if: ${{ inputs.client }}
        run: node mobile/e2e/old-client-tree.mjs "$E2E_OLD_CLIENT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          # android/ is made by prebuild, so there is no Gradle file to key on yet.
          # The lock file changes whenever a native dependency does.
          cache-dependency-path: mobile/package-lock.json

      # The Supabase CLI makes the key from its config alone, the same on every
      # run (e2e/anon-key.mjs), so no stack is started here. Each shard checks
      # its own stack's key against the one written beside the app.
      - name: The local stack's anon key
        id: anon
        run: |
          key=$(node mobile/e2e/anon-key.mjs) || { echo "$key"; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Install the app's packages
        id: install-1
        timeout-minutes: 5
        continue-on-error: true
        working-directory: mobile
        run: npm ci
      - name: Install the app's packages, once more
        if: steps.install-1.outcome == 'failure'
        timeout-minutes: 5
        working-directory: mobile
        run: npm ci

      # The NDK, build tools, platform and CMake the build needs
      # (scripts/android-packages.cjs), installed where a failed download is
      # tried once more; Gradle below may not download one itself.
      - name: The Android packages the build needs
        id: android-packages
        timeout-minutes: 5
        continue-on-error: true
        working-directory: mobile
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $(node scripts/android-packages.cjs) > /dev/null
          node scripts/android-packages.cjs --installed
      - name: The Android packages the build needs, once more
        if: steps.android-packages.outcome == 'failure'
        timeout-minutes: 5
        working-directory: mobile
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $(node scripts/android-packages.cjs) > /dev/null
          node scripts/android-packages.cjs --installed

      # A release build, as a store build is made — only its backend differs:
      # the runner, seen from the emulator as 10.0.2.2. app.config.js allows
      # plain http and turns updates off for E2E=1, and the manifest is checked.
      # So is MainActivity: the splash listener is cleared on the line after
      # super.onCreate(null) (plugins/withSplashWithoutHandoff.js), or the app
      # takes Android's splash over and a late handover leaves it animating.
      # Gradle gets 6 GB and 2 GB of Metaspace: the template's 512 MB Metaspace
      # ran out in a library's release lint (the runner has 16 GB).
      - name: Build the E2E app (release APK)
        working-directory: mobile
        env:
          E2E: '1'
          # The house through the fault proxy (e2e/fault-proxy.mjs), which passes every byte untouched
          # until a flow sets a fault.
          EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54330
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.anon.outputs.key }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set +e
          {
            npx expo prebuild --platform android --no-install --clean \
            && grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml \
            && grep -A 2 -F 'super.onCreate(null)' android/app/src/main/java/com/reelhouse/society/MainActivity.kt \
                 | grep -q -F 'splashScreen.clearOnExitAnimationListener()' \
            && (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 -Pandroid.builder.sdkDownload=false --no-daemon --console=plain \
                  "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError")
          } > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          tail -n 200 "$RUNNER_TEMP/build.log"
          if [ $rc -ne 0 ]; then
            # Gradle's own verdict, then real errors (Kotlin "e: ", compilers' "error:",
            # failed tasks) — never "w: " warnings that merely mention an error.
            {
              grep -n -A 20 'What went wrong' "$RUNNER_TEMP/build.log" | head -n 30
              grep -nE '^e: |[^a-z]error: |FAILED|Error: |usesCleartextTraffic' "$RUNNER_TEMP/build.log" | grep -v '^[0-9]*:w: ' | head -n 25
              grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml 2>/dev/null || echo "(the manifest does not allow plain http, or prebuild did not finish)"
              grep -A 2 -F 'super.onCreate(null)' android/app/src/main/java/com/reelhouse/society/MainActivity.kt 2>/dev/null \
                | grep -q -F 'splashScreen.clearOnExitAnimationListener()' \
                || echo "(MainActivity does not clear the splash listener after super.onCreate(null): plugins/withSplashWithoutHandoff.js did not apply, or prebuild did not finish)"
            } > "$RUNNER_TEMP/build-errors.txt"
            node e2e/annotate.mjs "E2E app build failed" "$RUNNER_TEMP/build-errors.txt"
          fi
          # The Kotlin compiler's daemon outlives a --no-daemon build; it ends with it.
          pkill -f 'KotlinCompileDaemon|GradleDaemon' || true
          exit $rc

      # Expo SDK 54's ready-made expo-image was built with Glide's logging on, so
      # every image the app loaded was logged; package.json has it compiled from
      # source instead (expo.autolinking.android.buildFromSource). The APK itself
      # must say so: the level its Glide module hands Glide is ERROR.
      - name: The built app logs Glide's errors only
        working-directory: mobile
        run: |
          set +e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          X="$RUNNER_TEMP/dex"; rm -rf "$X"; mkdir -p "$X"
          unzip -q -o android/app/build/outputs/apk/release/app-release.apk 'classes*.dex' -d "$X"
          for f in "$X"/*.dex; do
            "$BT/dexdump" -d "$f" 2>/dev/null | grep -F -A 40 '] expo.modules.image.ExpoImageAppGlideModule.applyOptions:'
          done > "$RUNNER_TEMP/glide-dex.txt"
          node e2e/glide-log-level.mjs "$RUNNER_TEMP/glide-dex.txt" > "$RUNNER_TEMP/glide-log-level.txt"
          rc=$?
          cat "$RUNNER_TEMP/glide-log-level.txt"
          [ $rc -eq 0 ] || node e2e/annotate.mjs "The app logs every image Glide loads" "$RUNNER_TEMP/glide-log-level.txt"
          exit $rc

      # expo-image's prefetch decodes each picture whole, under a key no view
      # uses; the patch under mobile/patches has a 'disk' prefetch only download
      # (Glide's downloadOnly). The APK itself must say so. A shipped client has
      # no patch: the script says "Not run: old client", on the run's summary.
      - name: The built app's prefetch downloads without decoding
        working-directory: mobile
        run: |
          set +e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          X="$RUNNER_TEMP/dex-prefetch"; rm -rf "$X"; mkdir -p "$X"
          unzip -q -o android/app/build/outputs/apk/release/app-release.apk 'classes*.dex' -d "$X"
          for f in "$X"/*.dex; do
            "$BT/dexdump" -d "$f" 2>/dev/null \
              | awk 'index($0, "|[") { keep = index($0, "] expo.modules.image.ExpoImageModule") > 0 } keep'
          done > "$RUNNER_TEMP/prefetch-dex.txt"
          node e2e/prefetch-download-only.mjs "$RUNNER_TEMP/prefetch-dex.txt" > "$RUNNER_TEMP/prefetch-download-only.txt"
          rc=$?
          cat "$RUNNER_TEMP/prefetch-download-only.txt"
          if [ $rc -ne 0 ]; then
            node e2e/annotate.mjs "The app's prefetch decodes every picture" "$RUNNER_TEMP/prefetch-download-only.txt"
          elif [ -n "$E2E_OLD_CLIENT" ]; then
            node e2e/annotate.mjs "The prefetch check, not run: old client" "$RUNNER_TEMP/prefetch-download-only.txt" summary
          fi
          exit $rc

      # The key the app carries, beside it, for each shard to hold its stack to.
      - name: The anon key the app was built with
        env:
          KEY: ${{ steps.anon.outputs.key }}
        run: printf '%s\n' "$KEY" > mobile/android/app/build/outputs/apk/release/anon-key.txt

      # Stored as it is: an APK is a zip already.
      - name: Hand the app to the shards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-app${{ env.E2E_TAG }}
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/release/anon-key.txt

      - name: Keep the build's logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-build-logs${{ env.E2E_TAG }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/build-errors.txt
            ${{ runner.temp }}/glide-log-level.txt
            ${{ runner.temp }}/prefetch-download-only.txt
          if-no-files-found: ignore

  flows:
    name: 🎬 ${{ (inputs.variant && (needs.build.outputs.runs == 'walk' || matrix.shard == 4)) && 'The route walk' || format('The flows, shard {0} of {1}', matrix.shard, (inputs.faults || inputs.lifecycle) && 1 || 3) }}, in a sealed world
    needs: build
    runs-on: ubuntu-24.04
    # The flows step's limit, and the app's download and the emulator's start before it.
    timeout-minutes: 45
    strategy:
      # Every shard runs to its end: one failing never hides what the others find.
      fail-fast: false
      matrix:
        # The shards of mobile/e2e/shards.json (shards.test.ts holds the count); the fault
        # runs' one, of mobile/e2e/fault-shards.json. A variant's route walk is a machine of its
        # own (walk-shards.json): the only one of a walk-alone variant, a fourth beside the
        # flows' three of a variant that runs them.
        shard: ${{ fromJSON((inputs.faults || inputs.lifecycle || needs.build.outputs.runs == 'walk') && '[1]' || needs.build.outputs.runs == 'flows' && '[1, 2, 3, 4]' || '[1, 2, 3]') }}
    env:
      # The fault proxy's ports (below), kept with the stack's from the job's first step.
      STACK_EXTRA_PORTS: 54330,54331
      # The walk's machine: no flows, the walk, and the writer the seed makes for it, so every
      # flow's world is as every other run has it.
      E2E_FLOWS: ${{ inputs.faults && 'mobile/.maestro/faults' || inputs.lifecycle && 'mobile/.maestro/lifecycle' || (inputs.variant && (needs.build.outputs.runs == 'walk' || matrix.shard == 4)) && 'none' || 'mobile/.maestro' }}
      E2E_WALK: ${{ (inputs.variant && (needs.build.outputs.runs == 'walk' || matrix.shard == 4)) && '1' || '' }}
      E2E_SEED_WALK: ${{ (inputs.variant && (needs.build.outputs.runs == 'walk' || matrix.shard == 4)) && '1' || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The stack's ports kept before the job makes any connection that could be lent one: lent
      # before, a port was held all the job (mobile/e2e/start-stack.sh; run 39249504168).
      - name: The stack's ports, kept first
        run: bash mobile/e2e/start-stack.sh --reserve "E2E local stack"

      # Its flows (mobile/.maestro); the harness stays this checkout's.
      - name: The shipped client's app, over this harness
        if: ${{ inputs.client }}
        run: node mobile/e2e/old-client-tree.mjs "$E2E_OLD_CLIENT"

      # Where run-flows.sh installs it from, as if built here; before the seal.
      - name: The app, as the build made it
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-app${{ env.E2E_TAG }}
          path: mobile/android/app/build/outputs/apk/release

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      # The JDK the emulator's SDK tools run on, as on the machine that built the app.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # Downloaded at run time: tried once more (see db-integration.yml).
      - name: Supabase CLI
        id: supabase-cli
        timeout-minutes: 5
        continue-on-error: true
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Supabase CLI, once more
        if: steps.supabase-cli.outcome == 'failure'
        timeout-minutes: 5
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # The snapshot was taken with pg_dump 18; the fidelity check must read the
      # copy with the same major, or every line of formatting looks like drift.
      - name: Postgres 18 client tools
        id: install-2
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Postgres 18 client tools, once more
        if: steps.install-2.outcome == 'failure'
        timeout-minutes: 5
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # sign-in-with-username is production's own function, copied in BEFORE the
      # stack starts: config.toml names it, and the CLI checks what it names.
      - name: Start the local stack
        run: |
          cp -r supabase/functions/sign-in-with-username mobile/e2e/supabase/functions/
          bash mobile/e2e/start-stack.sh studio,imgproxy,logflare,vector,supavisor,postgres-meta "E2E local stack"

      # All three, or the run stops here by name: an empty key fails later,
      # blaming the functions.
      - name: Keys for the local stack
        working-directory: mobile/e2e
        run: |
          set -o pipefail
          keys=$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | sed 's/"//g') || keys=''
          for k in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            grep -qE "^$k=.+" <<< "$keys" || { echo "::error title=E2E keys::supabase status gave no $k — the local stack is not up"; exit 1; }
          done
          echo "$keys" >> "$GITHUB_ENV"

      # The app was built before this stack existed, with the key e2e/anon-key.mjs
      # gave; a stack with another key refuses every call the app makes.
      - name: The app carries this stack's anon key
        run: |
          built=$(cat mobile/android/app/build/outputs/apk/release/anon-key.txt)
          if [ "$built" != "$ANON_KEY" ]; then
            h() { printf '%s' "$1" | sha256sum | cut -c1-12; }
            echo "::error title=E2E anon key::the app was built with the key sha256 $(h "$built")…, this stack's is $(h "$ANON_KEY")…: e2e/anon-key.mjs no longer makes the key the Supabase CLI does"
            exit 1
          fi
          echo "the app's anon key is this stack's"

      # Maestro at one release, checked against the digest recorded when it was pinned.
      - name: Install Maestro 2.10.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-dist"
          echo "MAESTRO_BIN=$HOME/.maestro-dist/maestro/bin/maestro" >> "$GITHUB_ENV"

      # Started BEFORE the seal, and each function called once. The runtime
      # fetches a function's remote imports (deno.land, the esm CDN) on first use,
      # and those sit on Cloudflare like production does — so they load while
      # the network is whole, and the seal cannot starve them by sharing an
      # address. sign-in-with-username is production's own function, served as
      # it is; tmdb-proxy is the recorded stand-in (e2e/supabase/config.toml
      # opens both, and ships the stand-in's recordings).
      # No `functions serve`: `supabase start` already serves e2e/supabase/functions,
      # and a second runtime kills the first mid-request.
      - name: The functions, warmed before the seal
        run: |
          call() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
                     -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -d "$2" "$API_URL/functions/v1/$1" || true; }
          for i in $(seq 1 60); do
            tmdb=$(call tmdb-proxy '{"path":"/trending/movie/week"}')
            [ "$tmdb" = "200" ] && break
            sleep 2
          done
          # The database has no tables yet, so a sign-in would be the house failing
          # (503); a GET is refused by the function's own code (405), which proves it
          # loaded, imports and all, without the house.
          signin=$(curl -s -o /dev/null -w '%{http_code}' -X GET -H "apikey: $ANON_KEY" "$API_URL/functions/v1/sign-in-with-username" || true)
          if [ "$tmdb" != "200" ] || [ "$signin" != "405" ]; then
            # The report must come out even if gathering it half-fails: Actions
            # runs this with -e, and a failing `docker logs` ended the step silently.
            set +e
            T="$RUNNER_TEMP/functions-tail.txt"
            echo "(tmdb-proxy answered HTTP ${tmdb:-none}; sign-in-with-username HTTP ${signin:-none})" > "$T"
            # The functions runtime writes to its container's own log.
            echo "── containers: $(docker ps -a --format '{{.Names}}' | tr '\n' ' ')" >> "$T"
            for c in $(docker ps -a --format '{{.Names}}' | grep -i edge); do
              echo "── docker logs $c (last 30) ──" >> "$T"
              docker logs --tail 30 "$c" >> "$T" 2>&1
            done
            node mobile/e2e/annotate.mjs "E2E functions never came up — the runtime's last words" "$RUNNER_TEMP/functions-tail.txt"
            exit 1
          fi
          echo "tmdb-proxy $tmdb, sign-in-with-username $signin: both loaded"

      # Two locks — the firewall for every container, and the name pointed nowhere
      # — proved here from the runner and in bootstrap from inside the database.
      - name: Seal it — production's host goes nowhere, from the runner or any container
        run: bash mobile/e2e/db/seal.sh "E2E seal"

      - name: Build production's shape from the snapshot
        run: node mobile/e2e/db/bootstrap.mjs

      - name: Fidelity — the copy must produce the same snapshot as production
        env:
          SNAPSHOT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SNAPSHOT_SAME_MAJOR: '1'
        run: |
          set +e
          node mobile/scripts/schema-snapshot.mjs --check > "$RUNNER_TEMP/fidelity.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/fidelity.txt"
          [ $rc -eq 0 ] || node mobile/e2e/annotate.mjs "E2E fidelity — the copy differs from production" "$RUNNER_TEMP/fidelity.txt"
          exit $rc

      # Production as it will be: every pending migration (not in
      # mobile/supabase/APPLIED.txt) applied, undone and applied again, so the
      # app runs against the database it will meet after the next train.
      - name: Every pending migration, applied
        run: node mobile/e2e/db/up-down-up.mjs

      - name: Seed the members
        run: node mobile/e2e/db/seed.mjs

      - name: The functions answer as the app needs
        run: node mobile/e2e/db/verify-functions.mjs

      - name: The database cleans a member's words as the app does
        run: node mobile/e2e/db/verify-cleaning.mjs

      - name: Let the emulator use the runner's KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # What the emulator action below installs before it boots: the tools, the
      # emulator and the system image (about 100 seconds of downloads, run
      # 38786642483). Installed here, where a failed download is tried once
      # more alone, the action finds each one already there instead of failing
      # the flows' step. The system image is kept in GitHub's cache once a whole
      # copy is installed: its download came back unreadable on both tries of
      # run 38824884948, and a cached copy is never downloaded again. Each try
      # starts from no half-downloaded file of sdkmanager's.
      - name: The system image, from the cache
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-system-image-34-google_apis-x86_64
      - name: The emulator and its system image
        id: android-sdk
        timeout-minutes: 5
        continue-on-error: true
        run: |
          rm -rf "$ANDROID_HOME/.temp" "$HOME/.android/cache"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;37.0.0' platform-tools 'platforms;android-34' emulator 'system-images;android-34;google_apis;x86_64' --channel=0 > /dev/null
          node mobile/scripts/android-packages.cjs --installed 'build-tools;37.0.0' platform-tools 'platforms;android-34' emulator 'system-images;android-34;google_apis;x86_64'
      - name: The emulator and its system image, once more
        if: steps.android-sdk.outcome == 'failure'
        timeout-minutes: 5
        run: |
          rm -rf "$ANDROID_HOME/.temp" "$HOME/.android/cache"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;37.0.0' platform-tools 'platforms;android-34' emulator 'system-images;android-34;google_apis;x86_64' --channel=0 > /dev/null
          node mobile/scripts/android-packages.cjs --installed 'build-tools;37.0.0' platform-tools 'platforms;android-34' emulator 'system-images;android-34;google_apis;x86_64'
      # Only a copy the step above found whole.
      - name: The system image, kept in the cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-system-image-34-google_apis-x86_64

      # Between the app and the house, for the rest of the job: every byte passed
      # untouched until a flow sets a fault on its control port (10.0.2.2:54331),
      # and every request kept in the gateway's log.
      # The lifecycle run's upgrade (.maestro/lifecycle/upgrade.yaml) installs this build over the
      # one already in members' hands: that build's E2E app, from the last shipped-clients run
      # that made it (kept three days). None to be had leaves the proxy without it, and the
      # upgrade flow fails saying so.
      - name: The build in members' hands, to upgrade from
        if: ${{ inputs.lifecycle }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/old-app"
          # The client the shipped-clients run builds: the one mobile/e2e/old-clients.json checks.
          client=$(node -e "console.log(require('./mobile/e2e/old-clients.json').clients.find((c) => c.checked).name)")
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e-old-clients.yml --status success --limit 5 --json databaseId --jq '.[].databaseId'); do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "e2e-app - $client" --dir "$RUNNER_TEMP/old-app" && break
          done
          ls -l "$RUNNER_TEMP/old-app" || true

      - name: The network between the app and the house
        run: |
          old=""; [ -f "$RUNNER_TEMP/old-app/app-release.apk" ] && old="--old-apk $RUNNER_TEMP/old-app/app-release.apk"
          # shellcheck disable=SC2086
          nohup node mobile/e2e/fault-proxy.mjs --listen 54330 --to 127.0.0.1:54321 --control 54331 --log "$RUNNER_TEMP/gateway.jsonl" $old > "$RUNNER_TEMP/fault-proxy.txt" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:54331/alive > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/fault-proxy.txt"; echo "::error title=Fault proxy::it never answered on 54331"; exit 1

      - name: The flows, on an Android emulator
        # A backstop under the job's limit, so the steps after it still run. The
        # shard's flows have their own budget inside it: its minutes in
        # mobile/e2e/shards.json, made from every run's measured times
        # (flow-history.mjs); this outlasts the longest and what follows the
        # flows (flowHistory.test.ts holds it).
        timeout-minutes: 33
        env:
          E2E_SHARD: ${{ (inputs.faults || inputs.lifecycle || env.E2E_WALK) && '1/1' || format('{0}/3', matrix.shard) }}
          E2E_SHARD_MAP: ${{ inputs.faults && 'mobile/e2e/fault-shards.json' || inputs.lifecycle && 'mobile/e2e/lifecycle-shards.json' || env.E2E_WALK && 'mobile/e2e/walk-shards.json' || 'mobile/e2e/shards.json' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The renderer. The emulator died a second after the film page opened, in
          # every run that reached it, with `swiftshader_indirect` and then with
          # `swiftshader`: run 36708544965 caught how — the emulator process
          # itself (qemu-system-x86_64-headless) took a SIGSEGV, core kept by
          # systemd-coredump. A crash in the host's renderer, not in the app: no
          # app can fault the emulator. SwiftShader runs JIT-compiled shaders and
          # a draw it mishandles faults rather than being dropped. The same image
          # on the same runner (API 34, google_apis, pixel_6, this action) died
          # the same way under swiftshader_indirect and guest, and has survived
          # every run under `swangle_indirect`: ANGLE's GLES over SwiftShader's
          # Vulkan (omnesis-dev/Omnesis#200).
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash mobile/e2e/run-flows.sh

      # Only the flows this shard ran (run-flows.sh's flows-run.txt).
      - name: What the flows did, found in the database
        run: node mobile/e2e/db/verify-writes.mjs

      # Every request the gateway saw the app make, on the list the reading of
      # its code made (scripts/backend-contract.json).
      - name: Every request the app made, on the list its code names
        if: ${{ !cancelled() }}
        run: node mobile/e2e/what-the-app-asked.mjs "$RUNNER_TEMP/gateway.jsonl"

      - name: TMDB requests with no recording
        if: always()
        run: |
          # Everything the functions runtime printed, kept for the logs artifact too.
          docker logs supabase_edge_runtime_reelhouse-e2e > "$RUNNER_TEMP/functions.log" 2>&1 || true
          # The checks ask for two paths on purpose; they are not gaps.
          grep -o 'E2E-TMDB-MISS .*' "$RUNNER_TEMP/functions.log" 2>/dev/null | grep -v 'e2e-never-recorded\|/movie/999999999' \
            | sed 's/^E2E-TMDB-MISS //' | sort -u > "$RUNNER_TEMP/tmdb-misses.txt" || true
          # A miss is a flow shown "nothing" where a member is shown the film: the
          # world is not production's, so the run fails until it is recorded.
          if [ -s "$RUNNER_TEMP/tmdb-misses.txt" ]; then
            node mobile/e2e/annotate.mjs "TMDB requests with no recording — record with: node e2e/tmdb/record.mjs --from <list>" "$RUNNER_TEMP/tmdb-misses.txt" error
            exit 1
          else
            echo "### TMDB requests with no recording" >> "$GITHUB_STEP_SUMMARY"; echo "None." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Maestro's records hold each command as it ran, values filled in, so the
      # seeded member's password can sit in them in the clear. It goes before
      # anything is kept (e2e/scrub.mjs). Its own step, so a flows step killed
      # by its time limit is scrubbed too. Every file the next step keeps, and no
      # other (theRunKeepsWhatItWrites.test.ts holds the two lists alike).
      - name: The member's password, out of the kept logs
        if: always()
        run: |
          node mobile/e2e/scrub.mjs \
            "$RUNNER_TEMP/functions.log" "$RUNNER_TEMP/gateway.jsonl" "$RUNNER_TEMP/fault-proxy.txt" \
            "$RUNNER_TEMP/maestro.log" "$RUNNER_TEMP/flow-reports" "$RUNNER_TEMP/flow-screens" \
            "$RUNNER_TEMP/flow-hierarchy" "$RUNNER_TEMP/maestro-debug" "$RUNNER_TEMP/first-attempts" \
            "$RUNNER_TEMP/keyboard-room" "$RUNNER_TEMP/keyboard-room.txt" "$RUNNER_TEMP/screen.txt" \
            "$RUNNER_TEMP/logcat-stream.txt" "$RUNNER_TEMP/flow-times.txt" "$RUNNER_TEMP/flows-began.txt" \
            "$RUNNER_TEMP/flows-ended.txt" "$RUNNER_TEMP/retries.txt" "$RUNNER_TEMP/not-judged.txt" \
            "$RUNNER_TEMP/own-crash-flows.txt" "$RUNNER_TEMP/phone-fixes.txt" "$RUNNER_TEMP/app-crashes.txt" \
            "$RUNNER_TEMP/splash-handoff.txt" "$RUNNER_TEMP/animation-waits.txt" "$RUNNER_TEMP/phone-runtime.json" \
            "$RUNNER_TEMP/runtime-dump.txt" "$RUNNER_TEMP/screen-times.txt" "$RUNNER_TEMP/fault-judges.txt" \
            "$RUNNER_TEMP/walk-plan.txt" "$RUNNER_TEMP/walk.log" "$RUNNER_TEMP/route-judges.txt" \
            "$RUNNER_TEMP/walk" "$RUNNER_TEMP/memory.txt" "$RUNNER_TEMP/shard-plan.txt" \
            "$RUNNER_TEMP/flows-run.txt" "$RUNNER_TEMP/screen-record.json" "$RUNNER_TEMP/shard-notices.txt" \
            "$RUNNER_TEMP/maestro-summary.txt" "$RUNNER_TEMP/motion" "$RUNNER_TEMP/own-crashes.json" \
            "$RUNNER_TEMP/device-gone.txt" "$RUNNER_TEMP/crash.txt" "$RUNNER_TEMP/screen.json" \
            "$RUNNER_TEMP/debug-listing.txt" "$RUNNER_TEMP/route-walk-failed.txt" "$RUNNER_TEMP/variant-setup.txt" \
            "$RUNNER_TEMP/variant.txt" "$RUNNER_TEMP/cut-text.txt" "$RUNNER_TEMP/cold-start.txt"

      # Every run, not only a failed one: a run that passed only on a second
      # attempt keeps its first, and the device's whole log names any animation
      # Android held the test on (e2e/animation-waits.mjs). Hidden files too —
      # Maestro writes its records under a `.maestro` folder, which the upload
      # skips by default, so no run before this one ever kept them. The verdict
      # reads the shard's list of flows and its record of screens from here.
      - name: Keep the run's logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ matrix.shard }}${{ env.E2E_TAG }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/functions.log
            ${{ runner.temp }}/gateway.jsonl
            ${{ runner.temp }}/fault-proxy.txt
            ${{ runner.temp }}/maestro.log
            ${{ runner.temp }}/flow-reports
            ${{ runner.temp }}/flow-screens
            ${{ runner.temp }}/flow-hierarchy
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/first-attempts
            ${{ runner.temp }}/keyboard-room
            ${{ runner.temp }}/keyboard-room.txt
            ${{ runner.temp }}/screen.txt
            ${{ runner.temp }}/logcat-stream.txt
            ${{ runner.temp }}/flow-times.txt
            ${{ runner.temp }}/flows-began.txt
            ${{ runner.temp }}/flows-ended.txt
            ${{ runner.temp }}/retries.txt
            ${{ runner.temp }}/not-judged.txt
            ${{ runner.temp }}/own-crash-flows.txt
            ${{ runner.temp }}/phone-fixes.txt
            ${{ runner.temp }}/app-crashes.txt
            ${{ runner.temp }}/splash-handoff.txt
            ${{ runner.temp }}/animation-waits.txt
            ${{ runner.temp }}/phone-runtime.json
            ${{ runner.temp }}/runtime-dump.txt
            ${{ runner.temp }}/screen-times.txt
            ${{ runner.temp }}/fault-judges.txt
            ${{ runner.temp }}/walk-plan.txt
            ${{ runner.temp }}/walk.log
            ${{ runner.temp }}/route-judges.txt
            ${{ runner.temp }}/walk
            ${{ runner.temp }}/memory.txt
            ${{ runner.temp }}/shard-plan.txt
            ${{ runner.temp }}/flows-run.txt
            ${{ runner.temp }}/screen-record.json
            ${{ runner.temp }}/shard-notices.txt
            ${{ runner.temp }}/maestro-summary.txt
            ${{ runner.temp }}/motion
            ${{ runner.temp }}/own-crashes.json
            ${{ runner.temp }}/device-gone.txt
            ${{ runner.temp }}/crash.txt
            ${{ runner.temp }}/screen.json
            ${{ runner.temp }}/debug-listing.txt
            ${{ runner.temp }}/route-walk-failed.txt
            ${{ runner.temp }}/variant-setup.txt
            ${{ runner.temp }}/variant.txt
            ${{ runner.temp }}/cut-text.txt
            ${{ runner.temp }}/cold-start.txt
          if-no-files-found: ignore

  verdict:
    name: 🎬 The shards, read together
    needs: [build, flows]
    # A shard that failed or never ran is the point: it is named here.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The app was built
        if: needs.build.result != 'success'
        run: |
          echo "::error title=E2E::the app was not built (${{ needs.build.result }}), so no shard ran"
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Its flows are the ones every shard must have run between them.
      - name: The shipped client's app, over this harness
        if: ${{ inputs.client }}
        run: node mobile/e2e/old-client-tree.mjs "$E2E_OLD_CLIENT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      # A shard that kept none is named by the verdict, not by this step.
      - name: Every shard's kept logs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-logs-*${{ env.E2E_TAG }}
          path: ${{ runner.temp }}/shards

      # The fault runs', the lifecycle runs' and a walk-alone variant's one machine judged itself (fault-judges.mjs,
      # route-judges.mjs); a variant that runs every flow is three machines, read together here.
      - name: What no one shard can judge
        if: ${{ !inputs.faults && !inputs.lifecycle && needs.build.outputs.runs != 'walk' }}
        run: |
          set +e
          node mobile/e2e/shard-verdict.mjs "$RUNNER_TEMP/shards" --shards 3 --name "e2e-logs-{i}${E2E_TAG}" \
            --ceilings mobile/e2e/screen-ceilings.json --flows "$E2E_FLOWS" > "$RUNNER_TEMP/shard-verdict.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/shard-verdict.txt"
          if [ $rc -eq 0 ]; then
            node mobile/e2e/annotate.mjs "The shards, read together" "$RUNNER_TEMP/shard-verdict.txt" summary
          else
            node mobile/e2e/annotate.mjs "The shards, read together" "$RUNNER_TEMP/shard-verdict.txt"
          fi
          exit $rc

      # The verdict is the whole run's: a shard that failed on its own device fails it too.
      - name: Every shard passed on its own device
        if: always()
        run: |
          if [ "${{ needs.flows.result }}" != "success" ]; then
            echo "::error title=E2E::a shard failed on its own device (${{ needs.flows.result }}): its job says why"
            exit 1
          fi
