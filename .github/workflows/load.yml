name: 🏋️ Load — 100,000 members

# ── EVERY BUSY SCREEN'S READS, AGAINST A HOUSE OF 100,000 ──────────────────────
# Production's exact shape (the committed snapshot, checked against production
# by the fidelity step), sealed off from production as the E2E world is, filled
# by mobile/e2e/load/seed.sql with a lopsided house: 100,000 members, ~4M logs,
# ~2.5M follows, a whale with 10,000 films, a celebrity a third of the house
# follows, a Lounge with 200,000 messages. Then mobile/e2e/load/probe.mjs times
# each busy screen's reads as a signed-in member, through the row rules, and
# fails on any read over its budget. The table lands on the run's summary.
#
# Runs when the database's shape or the load test changes, weekly, and by hand.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/supabase/schema/**'
      - 'supabase/migrations/**'
      # both migration trees, the rehearsals and the train itself: what the lock lab runs
      - 'mobile/supabase/migrations/**'
      - 'mobile/supabase/diagnostics/**'
      - 'mobile/supabase/APPLIED.txt'
      - 'mobile/e2e/load/**'
      - 'mobile/e2e/db/bootstrap.mjs'
      - 'mobile/e2e/db/seal.sh'
      - '.github/workflows/load.yml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load:
    name: 🏋️ Busy screens against 100,000 members
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The stack's ports kept before the job makes any connection that could be lent one: lent
      # before, a port was held all the job (mobile/e2e/start-stack.sh; run 39249504168).
      - name: The stack's ports, kept first
        run: bash mobile/e2e/start-stack.sh --reserve "The load test's database"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Downloaded at run time: tried once more (see db-integration.yml).
      - name: Supabase CLI
        id: supabase-cli
        timeout-minutes: 5
        continue-on-error: true
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Supabase CLI, once more
        if: steps.supabase-cli.outcome == 'failure'
        timeout-minutes: 5
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # The snapshot was taken with pg_dump 18 (see e2e.yml).
      - name: Postgres 18 client tools
        id: install-1
        timeout-minutes: 5
        continue-on-error: true
        run: |
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-the-lock > /dev/null
          grep -L -e ubuntu.com -e apt-mirrors /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Postgres 18 client tools, once more
        if: steps.install-1.outcome == 'failure'
        timeout-minutes: 5
        run: |
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-the-lock > /dev/null
          grep -L -e ubuntu.com -e apt-mirrors /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # Only the database: the probes read it directly, as PostgREST would.
      # config.toml names sign-in-with-username, and the CLI checks what it names.
      - name: Start the local database
        run: |
          cp -r supabase/functions/sign-in-with-username mobile/e2e/supabase/functions/
          bash mobile/e2e/start-stack.sh studio,imgproxy,logflare,vector,supavisor,postgres-meta,gotrue,realtime,storage-api,edge-runtime,kong,mailpit,postgrest "The load test's database"

      # As e2e.yml: production's addresses rejected for every container, its name
      # pointed nowhere; bootstrap then proves the database cannot reach it.
      - name: Seal it — production's host goes nowhere
        run: bash mobile/e2e/db/seal.sh "Load seal"

      - name: Build production's shape from the snapshot
        run: node mobile/e2e/db/bootstrap.mjs

      - name: Fidelity — the copy must produce the same snapshot as production
        env:
          SNAPSHOT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SNAPSHOT_SAME_MAJOR: '1'
        run: node mobile/scripts/schema-snapshot.mjs --check

      # Logs are for signed-in readers only, so a failure says itself as an annotation.
      - name: Fill the house — 100,000 members
        run: |
          set +e
          psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 \
            -f mobile/e2e/load/seed.sql > "$RUNNER_TEMP/seed.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/seed.log"
          if [ $rc -ne 0 ]; then
            grep -nE 'ERROR|DETAIL|HINT|CONTEXT|LINE|psql:' "$RUNNER_TEMP/seed.log" | tail -n 12 > "$RUNNER_TEMP/seed-errors.txt"
            node mobile/e2e/annotate.mjs "Load seed failed" "$RUNNER_TEMP/seed-errors.txt"
          fi
          exit $rc

      # The pending train, as production will run it (each rehearsal in one rolled-back
      # transaction, then file by file), every lock it takes timed on the full house: a lock
      # that blocks members' reads or writes held over a second fails (WORKLIST P0.6). Its file-by-
      # file run leaves the train applied, so the reads below are timed on production as it will be.
      - name: The pending train on the full house, its locks timed
        env:
          LOAD_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set +e
          node mobile/e2e/load/train-locks.mjs
          rc=$?
          [ $rc -eq 0 ] || node mobile/e2e/annotate.mjs "The train holds a lock members wait on" "$RUNNER_TEMP/lock-report.txt" error
          exit $rc

      # A change waiting to be applied to production is measured here first, on
      # the full house: in one transaction, as postgres (who owns production's
      # objects), then vacuumed so its new index and table are read as they will be. It and the
      # reads' times run whatever the locks said, so one verdict never hides the other.
      - name: Apply the change under measurement (e2e/load/proposed.sql)
        if: ${{ !cancelled() }}
        run: |
          if grep -qvE '^\s*(--.*)?$' mobile/e2e/load/proposed.sql; then
            set +e
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 --single-transaction \
              -f mobile/e2e/load/proposed.sql > "$RUNNER_TEMP/proposed.log" 2>&1
            rc=$?
            cat "$RUNNER_TEMP/proposed.log"
            if [ $rc -ne 0 ]; then
              grep -nE 'ERROR|DETAIL|HINT|CONTEXT|LINE|psql:' "$RUNNER_TEMP/proposed.log" | tail -n 12 > "$RUNNER_TEMP/proposed-errors.txt"
              node mobile/e2e/annotate.mjs "The proposed change failed to apply" "$RUNNER_TEMP/proposed-errors.txt"
              exit $rc
            fi
            psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -c 'VACUUM ANALYZE'
          else
            echo "no change under measurement"
          fi

      # As supabase_admin, so a read over budget can show the plan INSIDE a
      # function as well as its call (auto_explain needs a superuser to load).
      - name: Time every busy screen's reads
        if: ${{ !cancelled() }}
        env:
          LOAD_DB_URL: postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres
        run: node mobile/e2e/load/probe.mjs

      # The lock report goes with the train: the user reads it before applying.
      - name: Keep the train's lock report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: train-lock-report
          path: ${{ runner.temp }}/lock-report.txt
          if-no-files-found: ignore
          retention-days: 30

  # The schedule's heartbeat (WORKLIST P0.38): GitHub stops a schedule after 60 days without
  # activity and says nothing; a monitor outside GitHub (register/alert-rules.json) emails the
  # owner when this check-in is late.
  heartbeat:
    name: 💓 The schedule ran
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            mobile/scripts/heartbeat.mjs
            mobile/register/alert-rules.json
          sparse-checkout-cone-mode: false
      - name: Check in
        env:
          HEARTBEAT_CHECKIN_URL: ${{ secrets.HEARTBEAT_CHECKIN_URL }}
        run: node mobile/scripts/heartbeat.mjs load
