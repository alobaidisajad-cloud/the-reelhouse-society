name: 🏋️ Load — 100,000 members

# ── EVERY BUSY SCREEN'S READS, AGAINST A HOUSE OF 100,000 ──────────────────────
# Production's exact shape (the committed snapshot, checked against production
# by the fidelity step), sealed off from production as the E2E world is, filled
# by mobile/e2e/load/seed.sql with a lopsided house: 100,000 members, ~4M logs,
# ~2.5M follows, a whale with 10,000 films, a celebrity a third of the house
# follows, a Lounge with 200,000 messages. Then mobile/e2e/load/probe.mjs times
# each busy screen's reads as a signed-in member, through the row rules, and
# fails on any read over its budget. The table lands on the run's summary.
#
# Runs when the database's shape or the load test changes, weekly, and by hand.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/supabase/schema/**'
      - 'supabase/migrations/**'
      - 'mobile/e2e/load/**'
      - 'mobile/e2e/db/bootstrap.mjs'
      - 'mobile/e2e/db/seal.sh'
      - '.github/workflows/load.yml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load:
    name: 🏋️ Busy screens against 100,000 members
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # The snapshot was taken with pg_dump 18 (see e2e.yml).
      - name: Postgres 18 client tools
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # Only the database: the probes read it directly, as PostgREST would.
      # config.toml names sign-in-with-username, and the CLI checks what it names.
      - name: Start the local database
        run: |
          cp -r supabase/functions/sign-in-with-username mobile/e2e/supabase/functions/
          cd mobile/e2e && supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta,gotrue,realtime,storage-api,edge-runtime,kong,mailpit,postgrest

      # As e2e.yml: production's addresses rejected for every container, its name
      # pointed nowhere; bootstrap then proves the database cannot reach it.
      - name: Seal it — production's host goes nowhere
        run: bash mobile/e2e/db/seal.sh "Load seal"

      - name: Build production's shape from the snapshot
        run: node mobile/e2e/db/bootstrap.mjs

      - name: Fidelity — the copy must produce the same snapshot as production
        env:
          SNAPSHOT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SNAPSHOT_SAME_MAJOR: '1'
        run: node mobile/scripts/schema-snapshot.mjs --check

      # Logs are for signed-in readers only, so a failure says itself as an annotation.
      - name: Fill the house — 100,000 members
        run: |
          set +e
          psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 \
            -f mobile/e2e/load/seed.sql > "$RUNNER_TEMP/seed.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/seed.log"
          if [ $rc -ne 0 ]; then
            grep -nE 'ERROR|DETAIL|HINT|CONTEXT|LINE|psql:' "$RUNNER_TEMP/seed.log" | tail -n 12 > "$RUNNER_TEMP/seed-errors.txt"
            node mobile/e2e/annotate.mjs "Load seed failed" "$RUNNER_TEMP/seed-errors.txt"
          fi
          exit $rc

      # A change waiting to be applied to production is measured here first, on
      # the full house: in one transaction, as postgres (who owns production's
      # objects), then vacuumed so its new index and table are read as they will be.
      - name: Apply the change under measurement (e2e/load/proposed.sql)
        run: |
          if grep -qvE '^\s*(--.*)?$' mobile/e2e/load/proposed.sql; then
            set +e
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 --single-transaction \
              -f mobile/e2e/load/proposed.sql > "$RUNNER_TEMP/proposed.log" 2>&1
            rc=$?
            cat "$RUNNER_TEMP/proposed.log"
            if [ $rc -ne 0 ]; then
              grep -nE 'ERROR|DETAIL|HINT|CONTEXT|LINE|psql:' "$RUNNER_TEMP/proposed.log" | tail -n 12 > "$RUNNER_TEMP/proposed-errors.txt"
              node mobile/e2e/annotate.mjs "The proposed change failed to apply" "$RUNNER_TEMP/proposed-errors.txt"
              exit $rc
            fi
            psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -c 'VACUUM ANALYZE'
          else
            echo "no change under measurement"
          fi

      # As supabase_admin, so a read over budget can show the plan INSIDE a
      # function as well as its call (auto_explain needs a superuser to load).
      - name: Time every busy screen's reads
        env:
          LOAD_DB_URL: postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres
        run: node mobile/e2e/load/probe.mjs
