name: 🌙 Nightly

# ── WHAT CHANGES WHILE THE CODE STANDS STILL ────────────────────────────────────
# Each night, with no push behind it. Advisories are published against packages
# the repo already holds, so the packages are asked about again every night:
#   - the app's: one that reaches the phone fails the run unless
#     mobile/e2e/advisories-allowlist.json holds it; dev and build tools are listed;
#   - the website's (the root package-lock.json): listed, never failing;
#   - the edge functions' https://esm.sh and npm: imports, each at its exact
#     version (an unpinned one at the version https://esm.sh resolves it to
#     tonight), asked of the OSV database: one with an advisory fails the run
#     unless the allowlist holds it.
# The list is the run's summary. No push cancels a run of this workflow: it has
# no push trigger and no concurrency group.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: 📦 Known-vulnerable packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-1
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-1.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      - name: The packages the phone bundles hold
        working-directory: ./mobile
        run: node e2e/advisories.mjs phone-modules "$RUNNER_TEMP/phone-modules.json"

      - name: The edge functions' imports, asked of the OSV database
        working-directory: ./mobile
        run: node e2e/advisories.mjs functions "$RUNNER_TEMP/functions.json"

      # npm audit exits 1 when it finds anything; the judge reads its report, and
      # fails by name on one that is not a report (the registry unreachable).
      - name: Known advisories — the app, the website, the edge functions
        working-directory: ./mobile
        run: |
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit-app.json" || true
          (cd .. && npm audit --package-lock-only --json > "$RUNNER_TEMP/audit-website.json") || true
          set -o pipefail
          node e2e/advisories.mjs judge --phone "$RUNNER_TEMP/phone-modules.json" --app "$RUNNER_TEMP/audit-app.json" \
            --website "$RUNNER_TEMP/audit-website.json" --functions "$RUNNER_TEMP/functions.json" 2>&1 | tee advisories.txt
          rc=${PIPESTATUS[0]}
          node e2e/annotate.mjs "Known-vulnerable packages" advisories.txt summary
          [ $rc -eq 0 ] || node e2e/annotate.mjs "A known-vulnerable package is not on the allowlist" advisories.txt error --drop '^\s'
          exit $rc

  # The app's own questions asked of production itself, once a night, and never
  # on a push (P0.37): an embed resolves, a visitor may read what the app asks
  # for. Their answers are statuses, never rows. scripts/contracts-ran.cjs says
  # no to a run whose contracts skipped.
  contracts:
    name: 🔌 The app's questions, asked of production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-2
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-2.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      - name: The app's questions, asked of production
        working-directory: ./mobile
        env:
          CONTRACT_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          CONTRACT_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set +e
          npx jest --ci --testPathPattern '\.contract\.test\.tsx?$' --json --outputFile=contracts.json > contracts-output.txt 2>&1
          rc=$?
          tail -n 30 contracts-output.txt
          node scripts/contracts-ran.cjs contracts.json || exit 1
          exit $rc

  # ── MUTANTS (P0.68) ──────────────────────────────────────────────────────────
  # The sealed copy of production as it will be, attacked by every kind of
  # member, then each rule, gate trigger and column grant weakened in turn: a
  # weakening no try notices fails the night unless matrix.json says why it
  # changes nothing a member can do.
  db-mutants:
    name: 🧬 Every rule weakened in turn, and noticed
    uses: ./.github/workflows/db-integration.yml
    with:
      mutants: true

  # ── FLAKES (P0.37) ───────────────────────────────────────────────────────────
  # Every E2E flow three times on tonight's commit, and the suite in an order
  # jest picks at random. A test that both passes and fails at one commit is a
  # flake: a defect with a register entry, and the night fails by its name.
  e2e-round-1:
    name: 🎬 Every flow, round 1 of 3
    uses: ./.github/workflows/e2e.yml
    with:
      round: '1'
  e2e-round-2:
    name: 🎬 Every flow, round 2 of 3
    uses: ./.github/workflows/e2e.yml
    with:
      round: '2'
  e2e-round-3:
    name: 🎬 Every flow, round 3 of 3
    uses: ./.github/workflows/e2e.yml
    with:
      round: '3'

  # The fault runs (WORKLIST P0.76, P0.35): the network between the app and the
  # house broken on purpose, each flow judged by e2e/fault-judges.mjs.
  e2e-faults:
    name: 🎬 The fault runs
    uses: ./.github/workflows/e2e.yml
    with:
      faults: true

  # Every route opened cold and captured on the phone as each variant has it (mobile/e2e/variants.json,
  # WORKLIST P0.86): four at a time, each its own machine and its own build.
  e2e-variants:
    name: 🎬 The route walk, ${{ matrix.variant }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [plain, motion-on, largest-text, bold-text, narrowest, three-button, right-to-left, light]
    uses: ./.github/workflows/e2e.yml
    with:
      variant: ${{ matrix.variant }}

  # The light-mode walk against the plain one (P0.86): the app keeps its own grounds and inks
  # whatever the system's mode, so each route's capture must look as the plain run's does
  # (mobile/e2e/grounds-judges.mjs). After the walks, whatever they said: what they captured is read.
  grounds:
    name: 🎬 Light mode draws every route as the plain phone does
    needs: e2e-variants
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - name: The plain walk
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-logs-1 - plain
          path: ${{ runner.temp }}/plain
      - name: The light walk
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-logs-1 - light
          path: ${{ runner.temp }}/light
      - name: Every route, light against plain
        run: node mobile/e2e/grounds-judges.mjs "$RUNNER_TEMP/plain/walk" "$RUNNER_TEMP/light/walk"

  jest-random:
    name: 🎲 Jest, each file's tests in a random order
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-3
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-3.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      # The seed is printed, so an order that fails can be run again.
      - name: Jest, in a random order
        working-directory: ./mobile
        env:
          TZ: UTC
        run: npx jest --ci --randomize --showSeed --maxWorkers=2 --json --outputFile=jest-random.json

      - name: Keep the run's record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jest-random
          path: mobile/jest-random.json
          if-no-files-found: error

  # Each mutant (register/mutants.yaml) puts one mistake of a class back, and the
  # class's own test must fail on it; a mutant that survives or no longer applies
  # turns the night red. The verdicts are kept as ids and verdicts only.
  mutants:
    name: 🧪 Every mutant, each caught by its class's own test, part ${{ matrix.part }} of 3
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # A past mutant reverses its fix's commit, read from the history.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-4
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-4.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      - name: This part's mutants, by the kill rules
        working-directory: ./mobile
        env:
          TZ: UTC
        run: node scripts/mutants.cjs --part ${{ matrix.part }}/3 --results mutant-results.json --fresh

      - name: Keep the verdicts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-results-${{ matrix.part }}
          path: mobile/mutant-results.json
          if-no-files-found: error

  # The parts read together: every mutant run once, by one part, and caught.
  mutants-together:
    name: 🧪 Every mutant, its parts together
    needs: mutants
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-5
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-5.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      - name: The parts' verdicts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutant-results-*
          path: mutant-parts

      - name: Every mutant once, and caught
        run: node mobile/scripts/mutants.cjs --gather mutant-parts --out mutant-results.json

      - name: Keep the night's verdicts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-results
          path: mutant-results.json
          if-no-files-found: error

  # Stryker on each logic file the register lists (register/stryker.yaml), each
  # against its own tests: a file under its floor turns the night red. Every
  # mutant runs every night: a verdict kept from last night can be one a changed
  # test no longer earns (stryker.config.mjs).
  stryker:
    name: 🧬 Stryker, each logic file at its floor, part ${{ matrix.part }} of 3
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-6
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-6.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      - name: This part's files, each by its own tests
        working-directory: ./mobile
        run: node scripts/stryker-files.cjs --part ${{ matrix.part }}/3 --results stryker-scores.json

      - name: Keep the scores
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-scores-${{ matrix.part }}
          path: mobile/stryker-scores.json
          if-no-files-found: error

  flake-history:
    name: 🧮 Every test's passes and failures, night by night
    needs: [e2e-round-1, e2e-round-2, e2e-round-3, jest-random]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Tonight's rounds and records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-logs-*
          path: ${{ runner.temp }}/rounds
      - name: Tonight's jest record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jest-random
          path: ${{ runner.temp }}/jest

      # The newest earlier scheduled night that kept a history.
      - name: The last night's history
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml --event schedule --status completed \
                        --limit 30 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n flake-history -D "$RUNNER_TEMP/previous" 2>/dev/null; then
              echo "file=$RUNNER_TEMP/previous/flake-history.json" >> "$GITHUB_OUTPUT"
              echo "from run $id"
              break
            fi
          done

      - name: Every test's passes and failures, and tonight's flakes
        working-directory: ./mobile
        run: |
          set +e
          rounds=$(ls -d "$RUNNER_TEMP"/rounds/* 2>/dev/null | paste -sd, -)
          previous=${{ steps.previous.outputs.file }}
          node scripts/flake-history.cjs --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/flake-history.json" \
            ${previous:+--previous "$previous"} ${rounds:+--flows "$rounds"} --jest "$RUNNER_TEMP/jest/jest-random.json" > flakes.txt 2>&1
          rc=$?
          cat flakes.txt
          [ $rc -eq 0 ] || node e2e/annotate.mjs "A test both passed and failed at one commit: a flake, a defect" flakes.txt error
          exit $rc

      - name: Keep the history for the next night
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-history
          path: ${{ runner.temp }}/flake-history.json
          if-no-files-found: error
          retention-days: 90
