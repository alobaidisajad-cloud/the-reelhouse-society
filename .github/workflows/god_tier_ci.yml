name: 🏛️ Nitrate Noir - God-Tier CI Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # A weekly run with no push behind it. Tools, runners and services change
  # under a repo that does not; this is how that rot is found on a Monday
  # rather than on the day a fix has to ship. It also proves, weekly, that the
  # failure alert (ci-alert.yml) still fires.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# ── EVERY OUTSIDE ACTION IS PINNED TO ONE COMMIT ────────────────────────────────
# A tag like `@v5` is a pointer its owner can move to different code at any time,
# and that code runs with this repository's secrets. Each `uses:` names the exact
# commit, with the release it was on the day it was pinned. Moving one is a
# decision someone makes in a commit, never something that happens to us.

# A run a newer push has already superseded is cancelled instead of finishing work
# nobody will read. (A cancelled run raises no alert — see ci-alert.yml.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── NODE 24, EVERY JOB ─────────────────────────────────────────────────────────
# This pinned Node 20, which reached end of life in April 2026 (GitHub's own runner
# notice calls it deprecated). The app is developed on Node 24, and the two do not
# agree: Node 20's TextDecoder reads windows-1252 as ISO-8859-1, so the encoding
# guard (everyFileSurvivedTheShell) failed here on every push since 2026-09-10 while
# passing on every developer machine. One version, the one the code is written on.

jobs:
  strict-analysis:
    name: 🔬 Strict Architecture Analysis
    runs-on: ubuntu-latest
    # Every job has a ceiling. A hung step used to hold a runner for the
    # default six hours and report nothing; now it fails, and the alert says so.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install Root (Web) Dependencies
        run: npm ci
        
      - name: Install Mobile (Native) Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Strict TypeScript Compilation (Web)
        run: npx tsc --noEmit

      - name: Strict TypeScript Compilation (Native)
        working-directory: ./mobile
        run: npx tsc --noEmit

      # No workflow has ever run eslint. The 32 warnings that finding #1 reported
      # were cleaned up by hand and nothing has held the line since. --max-warnings=0
      # makes zero the enforced state rather than the hoped-for one.
      # Measured before enabling: 461 files, 0 warnings, 0 errors.
      - name: ESLint (Native, zero warnings enforced)
        working-directory: ./mobile
        run: npx eslint . --max-warnings=0

      # ⚠️ This gate is WEAKER THAN IT LOOKS, and that is deliberate rather than hidden.
      # eslint.config.js at the repo root matches only '**/*.{js,jsx}', so it sees 28
      # JS files and NONE of the 181 TypeScript files that are the actual web app.
      # It reports 0 problems because it is not looking at them. Linting the web's
      # TypeScript needs typescript-eslint, which is not installed — filed as its own
      # task rather than bolted on here, because it will surface real findings that
      # must be measured before anything is gated on them.
      - name: ESLint (Web — JS/JSX only, see comment above)
        run: npx eslint . --max-warnings=0

  native-unit-tests:
    name: 🧪 Native Jest Unit Tests + Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: strict-analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      # Runs the full Jest suite AND enforces the coverage thresholds in
      # jest.config.js. A failing test or a coverage regression now blocks merge.
      #
      # The env below is what makes loungeEmbeds.contract.test.ts actually RUN. It
      # guards the build-31 regression (lounge profile embeds returning 400), and it
      # skips itself when these variables are absent — which they always were, so it
      # has skipped on every CI run since it was written. That is the "1 skipped
      # suite" in the totals. Verified locally against the live database before
      # enabling: 3/3 pass. If the secrets are not configured it simply skips again,
      # exactly as it does today, so this cannot turn the build red.
      #
      # CONTRACT_* names, read by that one test only. As EXPO_PUBLIC_* they reached
      # every test in the run — a live URL where the suite relies on a dummy one —
      # and moved src/lib branch coverage 0.8% below every other machine's.
      - name: Jest (with coverage gate)
        working-directory: ./mobile
        env:
          CONTRACT_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          CONTRACT_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          npx jest --coverage --ci --maxWorkers=2 2>&1 | tee jest-output.txt

      # ── A FAILURE THAT EXPLAINS ITSELF ────────────────────────────────────────
      # This job failed on every push for two weeks and nobody could say why from
      # the summary: job logs are shown only to signed-in members, and a red cross
      # says nothing. On failure, the failing tests and the end of Jest's own output
      # are posted as ONE annotation, which appears on the run's summary page (and in
      # the public checks API) for anyone who opens it.
      - name: Surface Jest's failure on the summary
        if: failure()
        working-directory: ./mobile
        run: |
          [ -f jest-output.txt ] || exit 0
          { grep -E "^FAIL |● |Jest: |threshold|Error: " jest-output.txt | head -40; echo "── last lines ──"; tail -n 30 jest-output.txt; } > jest-failure.txt
          echo "::error title=Jest failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' jest-failure.txt)"

      # ── The same suite, run from the Americas ────────────────────────────────
      # The step above runs in the runner's timezone, which is UTC — and a whole class
      # of date bug is invisible from UTC. `logs.watched_date` is a `date` column, so
      # "2026-07-25" parses as midnight UTC and rendered as JUL 24 for every member
      # west of it: the entire Americas, on the film diary, which is the product. CI
      # was green throughout, for months.
      #
      # Los Angeles is the cheap catch — one negative-offset zone, with daylight
      # saving, finds the whole class. When it was first run against this repo it
      # failed 9 date assertions AND an existing Year in Cinema test that had simply
      # never been executed outside UTC.
      #
      # No coverage flag: the step above owns that gate, this one owns correctness.
      # `npm run test:tz` runs the full six-zone matrix locally.
      - name: Jest (America/Los_Angeles — dates are not a UTC-only concern)
        working-directory: ./mobile
        env:
          TZ: America/Los_Angeles
          CONTRACT_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          CONTRACT_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx jest --ci --silent --maxWorkers=2

      # The ratchet has existed, calibrated, since June and NOTHING has ever run it —
      # not this workflow, not a package.json script. jest.config.js enforces absolute
      # floors; this catches the slow slide between them, failing on any drop of more
      # than 0.5% against .coverage-baseline.json.
      #
      # It reads coverage/coverage-summary.json, which the step above produces, so it
      # must stay in this job and after it.
      #
      # ⚠️ On an improvement the script rewrites the baseline file. In CI that write is
      # discarded — nothing commits it — so the baseline only ever RISES when someone
      # runs it locally and commits the result. That is a deliberate property: CI can
      # block a regression but cannot quietly move the goalposts on its own.
      - name: Coverage ratchet (no regression against baseline)
        working-directory: ./mobile
        run: node scripts/coverage-ratchet.js

  web-unit-tests:
    name: 🧪 Web Vitest Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: strict-analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # The web suite lived only in ci.yml, which triggers on pull_request and
      # workflow_dispatch. This project ships straight to main and never opens a PR,
      # so these 84 tests had never run in CI — and one of them was red: LogForm
      # gained a _loggedIndex dependency and the fake store in core-flows.test.tsx
      # was never updated, so the selector returned undefined and the component threw.
      # Fixed first, verified 84/84 green, and only then moved onto the workflow that
      # actually fires. ci.yml keeps Lighthouse on PR/manual — its push trigger was
      # removed on purpose ("no more email spam on every push") and stays removed.
      - name: Vitest
        run: npx vitest run

  web-visual-regression:
    name: 📸 Web Playwright Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: strict-analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      
      # Runs the maintained Playwright feed suite (testDir: ./tests per
      # playwright.config.ts). The old src/test/e2e/feed.spec.ts path is a
      # stale leftover from before the suite moved to ./tests/ — Playwright
      # silently finds zero matching tests for any path outside testDir.
      - name: Run E2E Feed Tests
        run: npx playwright test tests/feed.spec.ts

  native-smoke-test:
    name: 📱 Maestro Flow YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: strict-analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Fast signal: catches malformed flow YAML without a build or a device.
      # The flows themselves run in the sealed test world (e2e.yml).
      - name: Lint All Maestro Flows
        run: |
          pip install --quiet yamllint
          yamllint -d relaxed mobile/.maestro/

  # The Android device run moved to e2e.yml — the SEALED test world: a private
  # backend built from the live schema snapshot, seeded test members, a stand-in
  # for TMDB, and the app on an emulator. The job that stood here built on Expo's
  # cloud (15 free Android builds a month, all spent on 2026-09-11) and signed in
  # as a test account that never existed in the live database, so no flow that
  # needed a member had ever passed — and had it existed, every run would have
  # posted a test review into the real community feed.
