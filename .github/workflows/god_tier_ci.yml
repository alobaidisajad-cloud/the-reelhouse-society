name: 🏛️ Nitrate Noir - God-Tier CI Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Every night, push or none: tools and services change under a repo that does
  # not, and the suite meets that day's date in all six time zones (a date bug can
  # wait for a day, not a commit). The alert's own proof is db-integration.yml's
  # fire drill, which fails on purpose and must open an issue.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# ── EVERY OUTSIDE ACTION IS PINNED TO ONE COMMIT ────────────────────────────────
# A tag like `@v5` is a pointer its owner can move to other code, which would run
# with this repository's secrets; each `uses:` names a commit (and the release it
# was). The runner too: `ubuntu-latest` moves on GitHub's date, so every job names
# ubuntu-24.04.

# A run a newer push has already superseded is cancelled instead of finishing work
# nobody will read. (A cancelled run raises no alert — see ci-alert.yml.) Keyed by
# the event too: a nightly GitHub starts late never cancels a push's run, nor a push
# the nightly's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Read only: every package install runs with this token, and no step writes back
# (annotations are workflow commands, which need no permission).
permissions:
  contents: read

# ── NODE 24, EVERY JOB: the version the code is written on. Versions disagree
# (Node 20's TextDecoder reads windows-1252 as ISO-8859-1, and the encoding guard
# everyFileSurvivedTheShell depends on it).

jobs:
  strict-analysis:
    name: 🔬 Strict Architecture Analysis
    runs-on: ubuntu-24.04
    # Every job has a ceiling: a hung step fails, and alerts, within it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install Root (Web) Dependencies
        id: install-1
        timeout-minutes: 5
        continue-on-error: true
        run: npm ci
      - name: Install Root (Web) Dependencies, once more
        if: steps.install-1.outcome == 'failure'
        timeout-minutes: 5
        run: npm ci
        
      - name: Install Mobile (Native) Dependencies
        id: install-2
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile (Native) Dependencies, once more
        if: steps.install-2.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      - name: Strict TypeScript Compilation (Web)
        run: npx tsc --noEmit

      - name: Strict TypeScript Compilation (Native)
        working-directory: ./mobile
        run: npx tsc --noEmit

      - name: ESLint (Native, zero warnings enforced)
        working-directory: ./mobile
        run: npx eslint . --max-warnings=0

      # Every file under app/ is a route Expo Router will open: one with no
      # default-exported component is a screen that throws.
      - name: Every file under app/ is a screen
        working-directory: ./mobile
        run: npm run check:routes

      # Each finder of scripts/frozen-counts.cjs: a promise nobody waits for or one handed
      # where nothing waits (typed lint), an index read used as if it is always there (tsc
      # with noUncheckedIndexedAccess), the edge functions' type errors and lint (Deno,
      # both trees), a Supabase mock made by hand, and a guard reached only through its
      # callers: each an exact count in every file, held by
      # mobile/register/frozen-counts.json, that may only fall. One that fell is
      # lowered in the same commit: `node scripts/frozen-counts.cjs --lower`.
      - name: Every frozen count holds, file by file
        working-directory: ./mobile
        run: node scripts/frozen-counts.cjs

      - name: Each frozen count's finder counts the cases planted for it
        working-directory: ./mobile
        run: node scripts/frozen-counts.cjs --selftest

      # A comment is read as fact. In app code, scripts and the living docs, each
      # name, file and line it points at must exist (a test's own story of the
      # defect it guards may name what was deleted). The style kinds — LONG,
      # HISTORY, WIDE — are reported by `npm run comments:check`, not gated.
      - name: Every comment names what exists
        working-directory: ./mobile
        run: npm run -s comments:check -- --kinds NAME,FILE,LINE

      # The phone has no Intl.Segmenter, so the app carries Unicode's rule for
      # where a character ends over a table of every code point's class. The
      # table is what this Node's own segmenter says, code point by code point
      # (about a minute); jest holds the rule over it to the same segmenter.
      - name: The character table is Unicode's, as Node reads it
        working-directory: ./mobile
        run: node scripts/grapheme-table.js --check

      # ⚠️ WEAKER THAN IT LOOKS: the root eslint.config.js matches only JS and JSX,
      # none of the web's TypeScript (that needs typescript-eslint, not installed).
      - name: ESLint (Web — JS/JSX only, see comment above)
        run: npx eslint . --max-warnings=0

  # ── NO SECRET IN WHAT A PUSH BRINGS ──────────────────────────────────────────
  # gitleaks with the repo's rules (.gitleaks.toml) and its judged baseline
  # (.gitleaksignore): first each rule is proven to fire on a planted secret,
  # then the commits this push or pull request brings are scanned. Values are
  # never printed (--redact).
  secrets:
    name: 🔐 Secrets Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: gitleaks 8.30.1, checked against its published checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Each rule fires on a planted secret, and the baseline excuses none
        run: node mobile/scripts/secrets-planted.cjs

      - name: The commits this brings hold no secret
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A first push of a branch, a schedule or a manual run has no "before":
          # the commit itself is scanned.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          gitleaks git . --log-opts="$range" --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --redact=100 --no-banner --log-level warn

  # ── EVERY MUTANT THIS PUSH STANDS ON, STILL CAUGHT ───────────────────────────
  # A guard this push changes, or the code a mutant puts a mistake back into, is
  # proven again here: each mutant standing on what the push changed must still be
  # caught by its class's own test (register/mutants.yaml; every one runs nightly).
  mutants:
    name: 🧪 The mutants this push stands on, each caught
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-mutants
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-mutants.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      - name: Each mutant standing on what this push changed, by the kill rules
        working-directory: ./mobile
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=HEAD~1
          fi
          node scripts/mutants.cjs --changed "$BEFORE"

  # ── A DATABASE CHANGE NEVER QUIETLY BREAKS A SHIPPED CLIENT ──────────────────
  # The TestFlight build and the live website keep calling the database as they
  # were built to. Every migration this push brings is read statement by
  # statement; a drop, rename, revoke, tighter rule or new body for an existing
  # function needs its reason right above it (mobile/scripts/add-only.cjs).
  add-only:
    name: 🧱 Migrations Are Add-Only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - name: Every migration and function change is add-only, or says why it is safe
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A first push of a branch, a schedule or a manual run has no "before":
          # the commit's own parent is the base.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=HEAD~1
          fi
          node mobile/scripts/add-only.cjs "$BEFORE"
      - name: Every migration applies as one unit, under the time limits
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=HEAD~1
          fi
          node mobile/scripts/migration-lint.cjs "$BEFORE"
      - name: The website is frozen; a change to it carries the user's dated approval
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=HEAD~1
          fi
          node mobile/scripts/website-freeze.cjs "$BEFORE"
      # The strict-analysis job holds each count to its baseline; this holds the
      # baseline itself, so no commit raises a count by writing a bigger number.
      - name: No frozen count was raised
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=HEAD~1
          fi
          node mobile/scripts/frozen-counts.cjs --base "$BEFORE"
      - name: Every commit was made with the hooks
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=HEAD~1
          fi
          node mobile/scripts/hooks-ran.cjs "$BEFORE"

  # ── THE SUITE, IN FOUR PARTS, IN SIX TIME ZONES ──────────────────────────────
  # Each machine runs a quarter of the test files (jest's own --shard): first in
  # UTC with coverage, then in every other zone scripts/test-timezones.js lists
  # (a whole class of date bug is invisible from UTC: a `date` column read as
  # midnight UTC is the day before anywhere west). The coverage floors cannot be
  # judged on a quarter, so they are off here and judged by jest-together on the
  # four parts' coverage at once, with jest's own check.
  native-unit-tests:
    name: 🧪 Native Jest, part ${{ matrix.part }} of 4, in every time zone
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: strict-analysis
    strategy:
      # Every part runs to its end: one failing never hides what the others find.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      # The whole history: a test asks git whether a shipped client's own crash was fixed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-3
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-3.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      # This part's test files in UTC, keeping their coverage (coverage/coverage-final.json)
      # and the record of which files ran; the floors are judged by jest-together.
      # TZ is set before jest starts: set inside a test it does nothing. No address
      # is handed in, so the contract tests skip here: a push asks production's
      # sealed shape (db-integration.yml), and production is asked a night (nightly.yml).
      - name: Jest in UTC, with coverage
        id: utc
        working-directory: ./mobile
        env:
          TZ: UTC
        run: |
          set -o pipefail
          npx jest --ci --maxWorkers=2 --shard=${{ matrix.part }}/${{ strategy.job-total }} \
            --coverage --coverageReporters=json --coverageThreshold='{}' \
            --json --outputFile=jest-UTC.json 2>&1 | tee jest-output.txt

      # ── A FAILURE THAT EXPLAINS ITSELF: logs need a sign-in, so the failing tests
      # go to ONE annotation, on the run's page and in the public checks API.
      - name: Surface Jest's failure on the summary
        if: failure()
        working-directory: ./mobile
        run: bash scripts/surface-jest-failure.sh jest-output.txt "Jest failed in UTC (part ${{ matrix.part }} of 4)"

      # The app's files from every other zone of scripts/test-timezones.js, read
      # from it, each process started in its zone (JEST_OUTSIDE_UTC leaves out the
      # tests of the tooling, which runs in UTC alone). Every zone runs even when one
      # fails, the UTC run among them, and each that fails is its own annotation,
      # named by its zone.
      - name: Jest in every other time zone
        if: ${{ !cancelled() && steps.utc.outcome != 'skipped' }}
        working-directory: ./mobile
        run: |
          set +e
          mapfile -t zones < <(node -p "const t = require('./scripts/test-timezones.js');
            t.ZONES.filter((z) => z !== 'UTC').map((z) => z + ' ' + t.recordOf(z)).join('\n')")
          failed=()
          for zone in "${zones[@]}"; do
            tz=${zone%% *}
            record=${zone#* }
            log=${record%.json}-output.txt
            echo "──────── TZ=$tz"
            TZ="$tz" JEST_OUTSIDE_UTC=1 npx jest --ci --silent --maxWorkers=2 --shard=${{ matrix.part }}/${{ strategy.job-total }} \
              --json --outputFile="$record" > "$log" 2>&1
            rc=$?
            tail -n 8 "$log"
            if [ $rc -ne 0 ]; then
              failed+=("$tz")
              bash scripts/surface-jest-failure.sh "$log" "Jest failed in $tz (part ${{ matrix.part }} of 4)"
            fi
          done
          if [ ${#zones[@]} -eq 0 ]; then
            echo "::error title=Jest::scripts/test-timezones.js gave no zone besides UTC, so none ran"
            exit 1
          fi
          [ ${#failed[@]} -eq 0 ] || { echo "✗ Jest failed in: ${failed[*]}"; exit 1; }

      # What jest-together reads: this part's coverage and each zone's record of
      # the files it ran. Kept when a test failed too, so the run is still read whole.
      - name: Keep this part's coverage and records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jest-part-${{ matrix.part }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            mobile/coverage/coverage-final.json
            mobile/jest-*.json

  # ── THE FOUR PARTS, READ TOGETHER ─────────────────────────────────────────────
  # What no one part can judge: every test file ran in exactly one part, in every
  # zone (scripts/jest-shards.cjs against jest's own list); jest.config.js's
  # coverage floors over all four parts' coverage, by jest's own reporter
  # (scripts/merge-coverage.cjs); then the ratchet on that coverage.
  jest-together:
    name: 🧪 Native Jest, its parts together — every file once, the coverage floors, the ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: native-unit-tests
    # A part that failed is read here too; when none ran (strict analysis failed
    # first), there is nothing to read.
    if: ${{ !cancelled() && needs.native-unit-tests.result != 'skipped' }}
    env:
      # How many parts native-unit-tests runs (its matrix; ciWorkflows.guard holds them equal).
      PARTS: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-17
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-17.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      # A part that kept nothing is named by the checks below, not by this step.
      - name: Every part's coverage and records
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jest-part-*
          path: ${{ runner.temp }}/parts

      - name: Every test file ran in exactly one part, in every time zone
        working-directory: ./mobile
        run: |
          set +e
          npx jest --listTests --json > "$RUNNER_TEMP/all-tests.json"
          runs=$(node -p "const t = require('./scripts/test-timezones.js'); t.ZONES.map(t.recordOf).join(',')")
          node scripts/jest-shards.cjs "$RUNNER_TEMP/parts" --shards "$PARTS" --name 'jest-part-{i}' \
            --tests "$RUNNER_TEMP/all-tests.json" --runs "$runs" > jest-parts.txt 2>&1
          rc=$?
          cat jest-parts.txt
          [ $rc -eq 0 ] || node e2e/annotate.mjs "A test file did not run exactly once" jest-parts.txt error
          exit $rc

      # The floors are jest.config.js's, with jest's semantics: a directory key
      # takes its files out of `global`. Writes coverage/coverage-summary.json.
      - name: The coverage floors, on every part's coverage together
        if: ${{ !cancelled() }}
        working-directory: ./mobile
        run: |
          set +e
          files=()
          for i in $(seq 1 "$PARTS"); do files+=("$RUNNER_TEMP/parts/jest-part-$i/coverage/coverage-final.json"); done
          node scripts/merge-coverage.cjs "${files[@]}" > merge-coverage.txt 2>&1
          rc=$?
          cat merge-coverage.txt
          if [ $rc -ne 0 ]; then
            grep -E "^✗|Jest:|files$|NOT met" merge-coverage.txt > merge-coverage-failure.txt
            node e2e/annotate.mjs "The coverage floors are not met" merge-coverage-failure.txt error
          fi
          exit $rc

      # The slow slide between jest.config.js's floors: any drop over 0.5% against
      # .coverage-baseline.json fails. It reads the coverage the step above writes, so
      # it stays after it. CI discards its baseline raises: only a commit moves the goalposts.
      - name: Coverage ratchet (no regression against baseline)
        working-directory: ./mobile
        run: node scripts/coverage-ratchet.js

      # The verdict is the whole run's: a part that failed on its own machine fails it too.
      - name: Every part passed on its own machine
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ needs.native-unit-tests.result }}" != "success" ]; then
            echo "::error title=Jest::a part failed on its own machine (${{ needs.native-unit-tests.result }}): its job says which test, in which zone"
            exit 1
          fi

  # ── EVERY SCREEN, LAID OUT AS THE PHONE LAYS IT ─────────────────────────────
  # The screens drawn from the app's own code (the zz-*.gen suites), measured in a
  # browser at every width and every text size:
  #   · yoga-parity — every box laid out AGAIN by Yoga, with RN's settings, must land
  #     where the browser put it (which is what makes the next check true);
  #   · layout — every word fits where it is set;
  #   · and the Lobby's words read against what is behind them (contrast), the
  #     composer's controls each drawn at 48 points, the measuring rules' own
  #     check (selftest) and the faces' letter widths against the font files.
  mockups:
    name: 🖼️ Every screen, as the phone lays it out
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: strict-analysis
    strategy:
      fail-fast: false
      matrix:
        width: [320, 360, 375, 390, 430, 744, 820, 1024]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # The measuring tools drive the web project's Playwright (root), and
      # draw with the app's own fonts (mobile).
      - name: Install Root (Web) Dependencies
        id: install-4
        timeout-minutes: 5
        continue-on-error: true
        run: npm ci
      - name: Install Root (Web) Dependencies, once more
        if: steps.install-4.outcome == 'failure'
        timeout-minutes: 5
        run: npm ci
      # Its system packages kept between runs: on a slow Ubuntu mirror their 26 MB outlived a
      # five-minute try (God-Tier 39774848287), and apt-get update alone another (39806861456), so
      # the kept ones go in by dpkg (mobile/scripts/kept-debs.sh) and apt runs only when they cannot.
      - name: Chromium for the measuring tools — its system packages, from the cache
        id: debs-install-5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-playwright-chromium
      - name: Chromium for the measuring tools
        id: install-5
        timeout-minutes: 5
        continue-on-error: true
        run: |
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-the-lock > /dev/null
          grep -L -e ubuntu.com -e apt-mirrors /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          if bash "$GITHUB_WORKSPACE/mobile/scripts/kept-debs.sh"; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
            mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null; true
          fi
      - name: Chromium for the measuring tools, once more
        if: steps.install-5.outcome == 'failure'
        timeout-minutes: 5
        run: |
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-the-lock > /dev/null
          grep -L -e ubuntu.com -e apt-mirrors /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          if bash "$GITHUB_WORKSPACE/mobile/scripts/kept-debs.sh"; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
            mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null; true
          fi
      - name: Chromium for the measuring tools — its system packages, kept in the cache
        if: steps.debs-install-5.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-playwright-chromium
      - name: Install Mobile Dependencies
        id: install-6
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-6.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      - name: Draw every screen at ${{ matrix.width }}pt
        working-directory: ./mobile
        env:
          MOCKUPS: '1'
          MOCKUPS_YOGA: '1'
          MOCKUPS_WIDTH: ${{ matrix.width }}
          MOCKUPS_OUT: mockups/out/ci
        run: npx jest "zz-.*\.gen" --ci --maxWorkers=2

      - name: Every box where Yoga puts it, at every text size
        working-directory: ./mobile
        run: |
          set +e
          rc=0
          for pass in ios@1 ios@1.35 ios@3.1 android@1.35 android@2; do
            echo "── $pass"
            node mockups/tools/yoga-parity.cjs --src mockups/out/ci --width ${{ matrix.width }} \
              --platform "${pass%@*}" --factor "${pass#*@}" --why --show 6 2>&1 | grep -v " agrees " | tee -a parity.txt
            [ "${PIPESTATUS[0]}" -eq 0 ] || rc=1
          done
          [ $rc -eq 0 ] || node e2e/annotate.mjs "A screen at ${{ matrix.width }}pt is drawn where the phone would not put it" parity.txt
          exit $rc

      - name: Every word fits, at every text size
        working-directory: ./mobile
        run: |
          set +e
          node mockups/tools/layout.cjs --src mockups/out/ci --width ${{ matrix.width }} \
            --allow-short mockups/shortened-on-purpose.txt > layout.txt 2>&1
          rc=$?
          cat layout.txt
          [ $rc -eq 0 ] || node e2e/annotate.mjs "A word does not fit at ${{ matrix.width }}pt" layout.txt error --drop 'clean +\('
          exit $rc

      # The Lobby prints words over art, sunbursts and halftone: each is scored
      # against the pixels really under it, at every width and text size.
      - name: Every Lobby word can be read against what is behind it
        working-directory: ./mobile
        run: |
          node mockups/tools/contrast.cjs --src mockups/out/ci --width ${{ matrix.width }} \
            --only lobby,lobby-titled,lobby-long,lobby-empty,lobby-archivist,lobby-auteur

      # The composer's touch law: every control is DRAWN by some generator state, and
      # its own box is at least 48 (a halo is invisible to accessibility); exceptions
      # are argued in mockups/touch-small-exceptions.txt.
      - name: Every control on the composer is drawn, and 48 by its own box
        working-directory: ./mobile
        run: |
          set +e
          node mockups/tools/drawn.cjs --src mockups/out/ci --prefix composer \
            src/components/log/LogForm.tsx src/components/log/LogSealBar.tsx src/components/log/LogIndexEntry.tsx \
            src/components/log/LogClearanceGate.tsx src/components/log/EditorialDesk.tsx src/components/log/AuteurToolkit.tsx \
            "app/(modals)/log-modal.tsx" src/components/log/LogSearchEngine.tsx src/components/NitrateCalendar.tsx > touch.txt 2>&1
          rc=$?
          screens=$(ls mockups/out/ci | grep -E '^composer.*\.html$' | grep -v '@' | sed 's/\.html$//' | paste -sd, -)
          node mockups/tools/layout.cjs --src mockups/out/ci --width ${{ matrix.width }} --only "$screens" \
            --kinds SMALL --allow mockups/touch-small-exceptions.txt >> touch.txt 2>&1 || rc=1
          cat touch.txt
          [ $rc -eq 0 ] || node e2e/annotate.mjs "A composer control is undrawn, or under 48pt, at ${{ matrix.width }}pt" touch.txt error --drop 'clean +\('
          exit $rc

      # The measuring rules themselves, against pages whose answer is known.
      - name: The measuring rules, checked
        if: matrix.width == 390
        working-directory: ./mobile
        run: node mockups/tools/selftest.cjs

      # The letter widths the Lobby and the profile do arithmetic with are what
      # the app's own font files measure (a face changed without them would fit
      # lines by the old letters).
      - name: The faces' letter widths match the font files
        if: matrix.width == 390
        working-directory: ./mobile
        run: node mockups/tools/face-advances.cjs --check

  captures:
    # Every screen the tests and generators BUILD (every sheet, error, empty and
    # loading state), measured for what mocked content cannot distort: STEAL,
    # NAMELESS, UNDER, SHADOW. (Word fit is the generators' job: tests carry stress
    # content.) Split in three by test file (jest's --shard): each part draws and
    # judges its own screens, as every finding is one screen's. The promise that
    # each file in mockups/touch-measured.txt still has a control measured beside
    # a neighbour is the whole run's, so captures-together keeps it over every part.
    name: 🧷 Every screen the tests build, part ${{ matrix.part }} of 3 — touch, names, bars, shadows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: strict-analysis
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        # The whole history: the suite's tests read commits by name (the register's, the mutants').
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install Root (Web) Dependencies
        id: install-7
        timeout-minutes: 5
        continue-on-error: true
        run: npm ci
      - name: Install Root (Web) Dependencies, once more
        if: steps.install-7.outcome == 'failure'
        timeout-minutes: 5
        run: npm ci
      # Its system packages kept between runs: on a slow Ubuntu mirror their 26 MB outlived a
      # five-minute try (God-Tier 39774848287), and apt-get update alone another (39806861456), so
      # the kept ones go in by dpkg (mobile/scripts/kept-debs.sh) and apt runs only when they cannot.
      - name: Chromium for the measuring tools — its system packages, from the cache
        id: debs-install-8
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-playwright-chromium
      - name: Chromium for the measuring tools
        id: install-8
        timeout-minutes: 5
        continue-on-error: true
        run: |
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-the-lock > /dev/null
          grep -L -e ubuntu.com -e apt-mirrors /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          if bash "$GITHUB_WORKSPACE/mobile/scripts/kept-debs.sh"; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
            mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null; true
          fi
      - name: Chromium for the measuring tools, once more
        if: steps.install-8.outcome == 'failure'
        timeout-minutes: 5
        run: |
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-the-lock > /dev/null
          grep -L -e ubuntu.com -e apt-mirrors /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          if bash "$GITHUB_WORKSPACE/mobile/scripts/kept-debs.sh"; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
            mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null; true
          fi
      - name: Chromium for the measuring tools — its system packages, kept in the cache
        if: steps.debs-install-8.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-playwright-chromium
      - name: Install Mobile Dependencies
        id: install-9
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-9.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      # The suite's own pass/fail is the Jest job's; here it is the screens. The
      # record of which test files this part ran is kept for captures-together.
      - name: Draw every screen this part's tests and generators build
        working-directory: ./mobile
        env:
          MOCKUPS: '1'
          MOCKUPS_OUT: mockups/out/cap-gens
          MOCKUPS_CAPTURE: '1'
          RNTL_SKIP_AUTO_CLEANUP: 'true'
          MOCKUPS_YOGA: '1'
          MOCKUPS_CAPTURED_OUT: mockups/out/captured
        run: |
          npx jest --ci --maxWorkers=2 --shard=${{ matrix.part }}/${{ strategy.job-total }} \
            --json --outputFile=capture-run.json > capture-run.txt 2>&1 || true
          grep -E "^Tests:" capture-run.txt
          # A part may hold no generator; its tests' screens are still measured.
          mkdir -p mockups/out/cap-gens mockups/out/captured
          find mockups/out/cap-gens -maxdepth 1 -name '*.html' -exec cp {} mockups/out/captured/ \;
          echo "$(ls mockups/out/captured | wc -l) screens"

      # Every finding is one screen's, so each part judges its own. It writes the
      # controls it measured (--sites) for captures-together's --require.
      - name: Touch, names, bars and shadows, on every screen of this part
        working-directory: ./mobile
        run: |
          set +e
          node mockups/tools/layout.cjs --src mockups/out/captured --passes ios@1 \
            --kinds STEAL,NAMELESS,UNSAID,UNDER,SHADOW --sites sites.txt > captures.txt 2>&1
          rc=$?
          grep -E "^\s+(STEAL|NAMELESS|UNSAID|UNDER|SHADOW)|finding|CLEAN" captures.txt
          [ $rc -eq 0 ] || node e2e/annotate.mjs "A screen the tests build has a touch, name, bar or shadow fault (part ${{ matrix.part }} of 3)" captures.txt error --drop 'clean +\('
          exit $rc

      - name: Keep this part's measured controls and its record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: captures-part-${{ matrix.part }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            mobile/capture-run.json
            mobile/sites.txt

  # ── THE THREE CAPTURE PARTS, READ TOGETHER ───────────────────────────────────
  # Every test file was drawn in exactly one part, and every file in
  # mockups/touch-measured.txt had a control measured beside a neighbour on some
  # part's screens (scripts/jest-shards.cjs --require, over every part's --sites).
  captures-together:
    name: 🧷 Every screen the tests build, its parts together — every file once, every promised control measured
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: captures
    if: ${{ !cancelled() && needs.captures.result != 'skipped' }}
    env:
      # How many parts captures runs (its matrix; ciWorkflows.guard holds them equal).
      PARTS: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # For jest's own list of its test files.
      - name: Install Mobile Dependencies
        id: install-18
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-18.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      # A part that kept nothing is named by the check below, not by this step.
      - name: Every part's measured controls and record
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: captures-part-*
          path: ${{ runner.temp }}/parts

      - name: Every test file drawn in one part, and every promised control measured
        working-directory: ./mobile
        run: |
          set +e
          npx jest --listTests --json > "$RUNNER_TEMP/all-tests.json"
          node scripts/jest-shards.cjs "$RUNNER_TEMP/parts" --shards "$PARTS" --name 'captures-part-{i}' \
            --tests "$RUNNER_TEMP/all-tests.json" --runs capture-run.json \
            --require mockups/touch-measured.txt --sites sites.txt > captures-parts.txt 2>&1
          rc=$?
          cat captures-parts.txt
          [ $rc -eq 0 ] || node e2e/annotate.mjs "The capture parts, read together" captures-parts.txt error
          exit $rc

      - name: Every part passed on its own machine
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ needs.captures.result }}" != "success" ]; then
            echo "::error title=Captures::a part failed on its own machine (${{ needs.captures.result }}): its job names the screen"
            exit 1
          fi

  bundle-size:
    name: 📦 The app's code only gets smaller
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: strict-analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-10
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-10.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      # The production bundles, iOS and Android, as the phones get them (Hermes
      # bytecode), against .bundle-size.json. Growth needs --accept and a reason.
      - name: Weigh the phone bundles
        working-directory: ./mobile
        run: |
          set -o pipefail
          npm run --silent bundle:size -- --keep "$RUNNER_TEMP/bundles" 2>&1 | tee bundle-size.txt
          rc=${PIPESTATUS[0]}
          [ $rc -eq 0 ] || node e2e/annotate.mjs "The app's code grew" bundle-size.txt error
          exit $rc

      # The same bundles, read for the release rules (scripts/release-guard.cjs):
      # no E2E backend built in and the production one is, and no test crash
      # but the one written exception. Run even when the size step failed.
      - name: The phone bundles hold the release rules
        if: always()
        working-directory: ./mobile
        run: |
          set +e
          node scripts/release-guard.cjs --bundles "$RUNNER_TEMP/bundles" > release-guard.txt 2>&1
          rc=$?
          cat release-guard.txt
          [ $rc -eq 0 ] || node e2e/annotate.mjs "The phone bundles break the release rules" release-guard.txt error
          exit $rc

  release-build:
    name: 🛡️ What a store build is made of holds the release rules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: strict-analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          # android/ is made by prebuild, so there is no Gradle file to key on yet.
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-15
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-15.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      # Gradle configures the root project with the NDK named in it: installed
      # here, tried once more (see e2e.yml), and never downloaded by Gradle.
      - name: The Android packages the build needs
        id: android-packages
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $(node scripts/android-packages.cjs) > /dev/null
          node scripts/android-packages.cjs --installed
      - name: The Android packages the build needs, once more
        if: steps.android-packages.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $(node scripts/android-packages.cjs) > /dev/null
          node scripts/android-packages.cjs --installed

      # The native projects as a store build starts from them: prebuild with no
      # E2E set (the E2E app is never this guard's input), iOS too, which needs
      # no Mac when no pods are installed. Then Gradle merges every library's
      # manifest into the release one, and expo-constants' own script writes the
      # config the build embeds, as the build runs it.
      - name: The release manifest, the Info.plist and the embedded config
        working-directory: ./mobile
        env:
          NODE_ENV: production
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set +e
          {
            npx expo prebuild --platform all --no-install --clean \
            && (cd android && ./gradlew :app:processReleaseManifest -Pandroid.builder.sdkDownload=false --no-daemon --console=plain \
                  "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g") \
            && mkdir -p "$RUNNER_TEMP/embedded" \
            && node node_modules/expo-constants/scripts/getAppConfig.js . "$RUNNER_TEMP/embedded"
          } > "$RUNNER_TEMP/release-build.log" 2>&1
          rc=$?
          tail -n 80 "$RUNNER_TEMP/release-build.log"
          if [ $rc -ne 0 ]; then
            grep -n -A 20 'What went wrong' "$RUNNER_TEMP/release-build.log" | head -n 30 > "$RUNNER_TEMP/release-build-errors.txt"
            tail -n 30 "$RUNNER_TEMP/release-build.log" >> "$RUNNER_TEMP/release-build-errors.txt"
            node e2e/annotate.mjs "The release manifest could not be made" "$RUNNER_TEMP/release-build-errors.txt"
          fi
          # The Kotlin compiler's daemon outlives a --no-daemon build; it ends with it.
          pkill -f 'KotlinCompileDaemon|GradleDaemon' || true
          exit $rc

      - name: The release manifest, the Info.plist and the embedded config hold the release rules
        working-directory: ./mobile
        run: |
          set +e
          manifest=$(find android/app/build/intermediates/merged_manifests -path '*/release/*' -name AndroidManifest.xml)
          plist=$(ls ios/*/Info.plist)
          if [ "$(printf '%s\n' "$manifest" | grep -c .)" != 1 ] || [ "$(printf '%s\n' "$plist" | grep -c .)" != 1 ]; then
            {
              echo "Not one merged release manifest and one Info.plist:"
              echo "manifest: ${manifest:-none}"; echo "plist: ${plist:-none}"
              echo "release manifests Gradle wrote:"
              find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml
            } > release-guard.txt
            rc=1
          else
            node scripts/release-guard.cjs --config "$RUNNER_TEMP/embedded/app.config" \
              --manifest "$manifest" --plist "$plist" > release-guard.txt 2>&1
            rc=$?
          fi
          cat release-guard.txt
          [ $rc -eq 0 ] || node e2e/annotate.mjs "What a store build is made of breaks the release rules" release-guard.txt error
          exit $rc

  # ── NO KNOWN-VULNERABLE PACKAGE REACHES THE PHONE ────────────────────────────
  # The packages the production bundles hold, read from their source maps, against
  # npm audit's report of the app's lockfile. An advisory on one of them fails
  # unless mobile/e2e/advisories-allowlist.json holds it with its reason. Advisories
  # on dev and build tools are listed by the nightly (nightly.yml), never here.
  phone-packages:
    name: 📦 No known-vulnerable package reaches the phone
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: strict-analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        id: install-16
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ./mobile
        run: npm ci
      - name: Install Mobile Dependencies, once more
        if: steps.install-16.outcome == 'failure'
        timeout-minutes: 5
        working-directory: ./mobile
        run: npm ci

      - name: The packages the phone bundles hold
        working-directory: ./mobile
        run: node e2e/advisories.mjs phone-modules "$RUNNER_TEMP/phone-modules.json"

      # npm audit exits 1 when it finds anything; the judge reads its report, and
      # fails by name on one that is not a report (the registry unreachable).
      - name: Known advisories on them
        working-directory: ./mobile
        run: |
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit-app.json" || true
          set -o pipefail
          node e2e/advisories.mjs judge --phone "$RUNNER_TEMP/phone-modules.json" --app "$RUNNER_TEMP/audit-app.json" 2>&1 | tee advisories.txt
          rc=${PIPESTATUS[0]}
          [ $rc -eq 0 ] || node e2e/annotate.mjs "A known-vulnerable package reaches the phone" advisories.txt error
          exit $rc


  web-unit-tests:
    name: 🧪 Web Vitest Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: strict-analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install the packages
        id: install-11
        timeout-minutes: 5
        continue-on-error: true
        run: npm ci
      - name: Install the packages, once more
        if: steps.install-11.outcome == 'failure'
        timeout-minutes: 5
        run: npm ci

      # Here, not only in ci.yml: that runs on pull requests, and this project pushes
      # to main. (ci.yml keeps Lighthouse, on PR and by hand.)
      - name: Vitest
        run: npx vitest run

  web-visual-regression:
    name: 📸 Web Playwright Visual Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: strict-analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install the packages
        id: install-12
        timeout-minutes: 5
        continue-on-error: true
        run: npm ci
      - name: Install the packages, once more
        if: steps.install-12.outcome == 'failure'
        timeout-minutes: 5
        run: npm ci
      # Its system packages kept between runs: on a slow Ubuntu mirror their 26 MB outlived a
      # five-minute try (God-Tier 39774848287), and apt-get update alone another (39806861456), so
      # the kept ones go in by dpkg (mobile/scripts/kept-debs.sh) and apt runs only when they cannot.
      - name: Playwright's system libraries, from the cache
        id: debs-install-13
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-playwright-all
      - name: Playwright's browsers and their system libraries
        id: install-13
        timeout-minutes: 5
        continue-on-error: true
        run: |
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-the-lock > /dev/null
          grep -L -e ubuntu.com -e apt-mirrors /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          if bash "$GITHUB_WORKSPACE/mobile/scripts/kept-debs.sh"; then
            npx playwright install
          else
            npx playwright install --with-deps
            mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null; true
          fi
      - name: Playwright's browsers and their system libraries, once more
        if: steps.install-13.outcome == 'failure'
        timeout-minutes: 5
        run: |
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-the-lock > /dev/null
          grep -L -e ubuntu.com -e apt-mirrors /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          if bash "$GITHUB_WORKSPACE/mobile/scripts/kept-debs.sh"; then
            npx playwright install
          else
            npx playwright install --with-deps
            mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null; true
          fi
      - name: Playwright's system libraries, kept in the cache
        if: steps.debs-install-13.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-playwright-all
      
      # A path outside playwright.config.ts's testDir (./tests) silently finds nothing.
      - name: Run E2E Feed Tests
        run: npx playwright test tests/feed.spec.ts

  native-smoke-test:
    name: 📱 Maestro Flow YAML Lint
    runs-on: ubuntu-24.04
    # Two tries at the linter's install, 5 minutes each, and the lint.
    timeout-minutes: 12
    needs: strict-analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: The YAML linter
        id: install-14
        timeout-minutes: 5
        continue-on-error: true
        run: pip install --quiet yamllint==1.38.0
      - name: The YAML linter, once more
        if: steps.install-14.outcome == 'failure'
        timeout-minutes: 5
        run: pip install --quiet yamllint==1.38.0

      # Fast signal: catches malformed flow YAML without a build or a device.
      # The flows themselves run in the sealed test world (e2e.yml).
      # --strict: a warning fails the step too; one nobody reads is no warning.
      - name: Lint All Maestro Flows
        run: |
          yamllint --strict -d relaxed mobile/.maestro/

  # The app on a device is e2e.yml's: a SEALED world, never production.

  # The schedule's heartbeat (WORKLIST P0.38): GitHub stops a schedule after 60 days without
  # activity and says nothing; a monitor outside GitHub (register/alert-rules.json) emails the
  # owner when this check-in is late.
  heartbeat:
    name: 💓 The schedule ran
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            mobile/scripts/heartbeat.mjs
            mobile/register/alert-rules.json
          sparse-checkout-cone-mode: false
      - name: Check in
        env:
          HEARTBEAT_CHECKIN_URL: ${{ secrets.HEARTBEAT_CHECKIN_URL }}
        run: node mobile/scripts/heartbeat.mjs god-tier
