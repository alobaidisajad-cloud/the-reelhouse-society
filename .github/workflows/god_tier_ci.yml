name: 🏛️ Nitrate Noir - God-Tier CI Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Two pushes 11 minutes apart were observed each holding an Android EAS build, the
# older already obsolete. A superseded run now gets cancelled instead of finishing
# work nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-analysis:
    name: 🔬 Strict Architecture Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Root (Web) Dependencies
        run: npm ci
        
      - name: Install Mobile (Native) Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Strict TypeScript Compilation (Web)
        run: npx tsc --noEmit

      - name: Strict TypeScript Compilation (Native)
        working-directory: ./mobile
        run: npx tsc --noEmit

      # No workflow has ever run eslint. The 32 warnings that finding #1 reported
      # were cleaned up by hand and nothing has held the line since. --max-warnings=0
      # makes zero the enforced state rather than the hoped-for one.
      # Measured before enabling: 461 files, 0 warnings, 0 errors.
      - name: ESLint (Native, zero warnings enforced)
        working-directory: ./mobile
        run: npx eslint . --max-warnings=0

      # ⚠️ This gate is WEAKER THAN IT LOOKS, and that is deliberate rather than hidden.
      # eslint.config.js at the repo root matches only '**/*.{js,jsx}', so it sees 28
      # JS files and NONE of the 181 TypeScript files that are the actual web app.
      # It reports 0 problems because it is not looking at them. Linting the web's
      # TypeScript needs typescript-eslint, which is not installed — filed as its own
      # task rather than bolted on here, because it will surface real findings that
      # must be measured before anything is gated on them.
      - name: ESLint (Web — JS/JSX only, see comment above)
        run: npx eslint . --max-warnings=0

  native-unit-tests:
    name: 🧪 Native Jest Unit Tests + Coverage Gate
    runs-on: ubuntu-latest
    needs: strict-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      # Runs the full Jest suite AND enforces the coverage thresholds in
      # jest.config.js. A failing test or a coverage regression now blocks merge.
      #
      # The env below is what makes loungeEmbeds.contract.test.ts actually RUN. It
      # guards the build-31 regression (lounge profile embeds returning 400), and it
      # skips itself when these variables are absent — which they always were, so it
      # has skipped on every CI run since it was written. That is the "1 skipped
      # suite" in the totals. Verified locally against the live database before
      # enabling: 3/3 pass. If the secrets are not configured it simply skips again,
      # exactly as it does today, so this cannot turn the build red.
      - name: Jest (with coverage gate)
        working-directory: ./mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx jest --coverage --ci --maxWorkers=2

  web-unit-tests:
    name: 🧪 Web Vitest Unit Tests
    runs-on: ubuntu-latest
    needs: strict-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # The web suite lived only in ci.yml, which triggers on pull_request and
      # workflow_dispatch. This project ships straight to main and never opens a PR,
      # so these 84 tests had never run in CI — and one of them was red: LogForm
      # gained a _loggedIndex dependency and the fake store in core-flows.test.tsx
      # was never updated, so the selector returned undefined and the component threw.
      # Fixed first, verified 84/84 green, and only then moved onto the workflow that
      # actually fires. ci.yml keeps Lighthouse on PR/manual — its push trigger was
      # removed on purpose ("no more email spam on every push") and stays removed.
      - name: Vitest
        run: npx vitest run

  web-visual-regression:
    name: 📸 Web Playwright Visual Regression
    runs-on: ubuntu-latest
    needs: strict-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      
      # Runs the maintained Playwright feed suite (testDir: ./tests per
      # playwright.config.ts). The old src/test/e2e/feed.spec.ts path is a
      # stale leftover from before the suite moved to ./tests/ — Playwright
      # silently finds zero matching tests for any path outside testDir.
      - name: Run E2E Feed Tests
        run: npx playwright test tests/feed.spec.ts

  native-smoke-test:
    name: 📱 Maestro Flow YAML Lint
    runs-on: ubuntu-latest
    needs: strict-analysis
    steps:
      - uses: actions/checkout@v4

      # Fast PR-time signal: catches malformed flow YAML without needing a
      # real build or device. The real device run happens post-merge, below.
      - name: Lint All Maestro Flows
        run: |
          pip install --quiet yamllint
          yamllint -d relaxed mobile/.maestro/

  native-cloud-e2e:
    name: ☁️ Maestro Cloud E2E (Android, real device)
    runs-on: ubuntu-latest
    needs: strict-analysis
    # Real device runs cost EAS build minutes + Maestro Cloud minutes, so this
    # only fires post-merge on main, not on every PR push.
    #
    # ⚠️ THIS JOB IS NOT OPTIONAL. There is no Android device on this project, so a
    # hosted real-device run is the ONLY Android coverage that exists before launch.
    # It is being made cheaper, never weaker.
    #
    # WHAT IT WAS DOING: `eas build:list` showed the last 40 Android builds were ALL
    # this job — eight in one day — because it fired on every push to main. Batches
    # 5-9 were largely SQL migrations under mobile/supabase/, and each one built an
    # Android APK that could not possibly have been affected by it.
    #
    # Two changes, both preserving per-push feedback on code that can actually break
    # the app:
    #   • only build when something that ends up IN the app changes. Migrations,
    #     audit notes and workflow edits no longer trigger a device run.
    #   • cancel a run that a newer push has already superseded. Two builds were
    #     observed running at once from pushes 11 minutes apart; the older one was
    #     obsolete before it finished.
    if: github.event_name == 'push'
    steps:
      # fetch-depth: 0 so the scope check below can diff against the previous SHA.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Does this push contain anything that ends up inside the Android app?
      # Migrations, audit notes, workflow edits and web-only changes cannot alter
      # the APK, so building one for them buys nothing. Deliberately fail-open:
      # anything unexpected (first push on a branch, missing base SHA, a git error)
      # runs the build, because a wasted build is cheaper than missed Android
      # coverage on a project with no Android device.
      - name: Does this push touch the app?
        id: scope
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit — running the device suite."
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}"); then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "git diff failed — running the device suite rather than skipping it."
            exit 0
          fi
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE '^mobile/(app|src|assets|components|constants|hooks)/|^mobile/\.maestro/|^mobile/(package|package-lock|app|eas)\.json$|^\.github/workflows/god_tier_ci\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "-> touches the app; building."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing in this push can change the APK; skipping the build."
          fi

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.relevant == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ./mobile
        run: npm ci

      - name: Install EAS CLI
        if: steps.scope.outputs.relevant == 'true'
        run: npm install -g eas-cli

      - name: Build Android APK (EAS, e2e profile)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: 1
        run: eas build --platform android --profile e2e --non-interactive --wait --json > eas-build-output.json

      - name: Download build artifact
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ./mobile
        run: |
          BUILD_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eas-build-output.json','utf8'))[0].artifacts.buildUrl)")
          curl -L "$BUILD_URL" -o app-e2e.apk

      # Official Maestro Cloud action: uploads the APK and runs every flow in
      # mobile/.maestro/ against a real hosted device.
      - name: Run Full Flow Suite on Maestro Cloud
        if: steps.scope.outputs.relevant == 'true'
        uses: mobile-dev-inc/action-maestro-cloud@v2.0.2
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: proj_01kvrb5qmxe7xaqgktvvg0seeb
          app-file: mobile/app-e2e.apk
          workspace: mobile/.maestro
