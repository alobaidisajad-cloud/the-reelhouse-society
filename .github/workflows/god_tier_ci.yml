name: 🏛️ Nitrate Noir - God-Tier CI Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  strict-analysis:
    name: 🔬 Strict Architecture Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Root (Web) Dependencies
        run: npm ci
        
      - name: Install Mobile (Native) Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Strict TypeScript Compilation (Web)
        run: npx tsc --noEmit
        
      - name: Strict TypeScript Compilation (Native)
        working-directory: ./mobile
        run: npx tsc --noEmit

  native-unit-tests:
    name: 🧪 Native Jest Unit Tests + Coverage Gate
    runs-on: ubuntu-latest
    needs: strict-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      # Runs the full Jest suite AND enforces the coverage thresholds in
      # jest.config.js. A failing test or a coverage regression now blocks merge.
      - name: Jest (with coverage gate)
        working-directory: ./mobile
        run: npx jest --coverage --ci --maxWorkers=2

  web-visual-regression:
    name: 📸 Web Playwright Visual Regression
    runs-on: ubuntu-latest
    needs: strict-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      
      # Runs Playwright tests and compares pixel-perfect screenshots
      - name: Run E2E Feed Tests
        run: npx playwright test src/test/e2e/feed.spec.ts

  native-smoke-test:
    name: 📱 Native Maestro UI Automation
    runs-on: macos-latest
    needs: strict-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        working-directory: ./mobile
        run: npm ci
        
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
        
      # Note: In a true CI, we would build the iOS simulator app here or use EAS Build,
      # then run the Maestro flows against it.
      - name: Lint Maestro Flows
        working-directory: ./mobile
        run: ~/.maestro/bin/maestro test .maestro/social_pulse_flow.yaml --format junit
