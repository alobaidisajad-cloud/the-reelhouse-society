name: DB Security Integration Tests

# Runs the REAL database security tests (RLS + triggers) against a throwaway
# Postgres that GitHub spins up for free — no paid Supabase branching, no test
# project needed. Unlike the Jest suite (mocked Supabase), this exercises the
# actual security rules where the 2026-06-26 gaps were hiding.

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab. With the fire drill ticked, the run fails on
  # purpose, which proves a red main still reaches the owner (ci-alert.yml opens an
  # issue). Run it again without the tick and the issue closes itself.
  workflow_dispatch:
    inputs:
      fire_drill:
        description: 'Fire drill: fail on purpose to prove the CI alert reaches you'
        type: boolean
        default: false
  # Weekly, with no push behind it — the same rot check as god_tier_ci.yml.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  db-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Fire drill — fail on purpose
        if: ${{ inputs.fire_drill }}
        run: |
          echo "::error title=Fire drill::This run failed on purpose, to prove the CI alert opens an issue. Run this workflow again without the fire drill to close it."
          exit 1

      # Pinned to one commit (see god_tier_ci.yml).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run database security integration tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f mobile/__tests__/integration/db_security.test.sql
