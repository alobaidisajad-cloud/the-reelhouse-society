name: DB Security Integration Tests

# Production's row rules, asked as visitors and members. The database is
# production's shape, built from the committed snapshot (mobile/supabase/schema)
# by mobile/e2e/db/bootstrap.mjs on a local Supabase stack, sealed from
# production as the E2E world is, and checked against the snapshot; then
# mobile/e2e/db/security.sql asks it what each may see and write. Nothing in the
# test defines a rule, so a change to production's rules is what it tests.

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab. With the fire drill ticked, the run fails on
  # purpose, which proves a red main still reaches the owner (ci-alert.yml opens an
  # issue). Run it again without the tick and the issue closes itself.
  workflow_dispatch:
    inputs:
      fire_drill:
        description: 'Fire drill: fail on purpose to prove the CI alert reaches you'
        type: boolean
        default: false
  # Weekly, with no push behind it — the same rot check as god_tier_ci.yml.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  db-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fire drill — fail on purpose
        if: ${{ inputs.fire_drill }}
        run: |
          echo "::error title=Fire drill::This run failed on purpose, to prove the CI alert opens an issue. Run this workflow again without the fire drill to close it."
          exit 1

      # Pinned to one commit (see god_tier_ci.yml).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # The snapshot was taken with pg_dump 18 (see e2e.yml).
      - name: Postgres 18 client tools
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # Only the database, as load.yml. config.toml names sign-in-with-username,
      # and the CLI checks what it names.
      - name: Start the local database
        run: |
          cp -r supabase/functions/sign-in-with-username mobile/e2e/supabase/functions/
          cd mobile/e2e && supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta,gotrue,realtime,storage-api,edge-runtime,kong,mailpit,postgrest

      # The snapshot's push sender names production; bootstrap proves it cannot reach it.
      - name: Seal it — production's host goes nowhere
        run: bash mobile/e2e/db/seal.sh "DB security seal"

      - name: Build production's shape from the snapshot
        run: node mobile/e2e/db/bootstrap.mjs

      - name: Fidelity — the copy must produce the same snapshot as production
        env:
          SNAPSHOT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SNAPSHOT_SAME_MAJOR: '1'
        run: node mobile/scripts/schema-snapshot.mjs --check

      # As supabase_admin: the house is laid down with triggers off, and each case
      # is asked as anon or authenticated.
      - name: Production's row rules, asked as visitors and members
        run: |
          psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" \
            -X -q -v ON_ERROR_STOP=1 -f mobile/e2e/db/security.sql
