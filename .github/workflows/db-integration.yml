name: DB Security Integration Tests

# Production's row rules, asked as visitors and members. The database is
# production's shape, built from the committed snapshot (mobile/supabase/schema)
# by mobile/e2e/db/bootstrap.mjs on a local Supabase stack, sealed from
# production as the E2E world is, and checked against the snapshot; then
# mobile/e2e/db/security.sql asks it what each may see and write. Nothing in the
# test defines a rule, so a change to production's rules is what it tests.

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab. With the fire drill ticked, the run fails on
  # purpose, which proves a red main still reaches the owner (ci-alert.yml opens an
  # issue). Run it again without the tick and the issue closes itself.
  workflow_dispatch:
    inputs:
      fire_drill:
        description: 'Fire drill: fail on purpose to prove the CI alert reaches you'
        type: boolean
        default: false
      mutants:
        description: 'Also weaken each rule in turn, as the nightly run does (about twenty minutes more)'
        type: boolean
        default: false
  # Weekly, with no push behind it — the same rot check as god_tier_ci.yml.
  schedule:
    - cron: '0 6 * * 1'
  # Called by nightly.yml with mutants on: the same sealed copy, then each rule weakened in turn.
  workflow_call:
    inputs:
      mutants:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  db-security:
    runs-on: ubuntu-24.04
    # About twelve minutes; the nightly mutants' run adds about twenty.
    timeout-minutes: 60
    steps:
      - name: Fire drill — fail on purpose
        if: ${{ inputs.fire_drill }}
        run: |
          echo "::error title=Fire drill::This run failed on purpose, to prove the CI alert opens an issue. Run this workflow again without the fire drill to close it."
          exit 1

      # Pinned to one commit (see god_tier_ci.yml).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      # The CLI is downloaded from npm at run time; one failed download failed
      # this whole run (2026-10-15), so it is tried once more, as every install is.
      - name: Supabase CLI
        id: supabase-cli
        timeout-minutes: 5
        continue-on-error: true
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Supabase CLI, once more
        if: steps.supabase-cli.outcome == 'failure'
        timeout-minutes: 5
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # The snapshot was taken with pg_dump 18 (see e2e.yml).
      - name: Postgres 18 client tools
        id: install-1
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Postgres 18 client tools, once more
        if: steps.install-1.outcome == 'failure'
        timeout-minutes: 5
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # The database, and Realtime, whose own tables (realtime.messages) the salon
      # channels' rules sit on. config.toml names sign-in-with-username, and the
      # CLI checks what it names.
      - name: Start the local database
        run: |
          cp -r supabase/functions/sign-in-with-username mobile/e2e/supabase/functions/
          bash mobile/e2e/start-stack.sh studio,imgproxy,logflare,vector,supavisor,postgres-meta,gotrue,storage-api,edge-runtime,kong,mailpit,postgrest "The DB check's database"

      # The snapshot's push sender names production; bootstrap proves it cannot reach it.
      - name: Seal it — production's host goes nowhere
        run: bash mobile/e2e/db/seal.sh "DB security seal"

      - name: Build production's shape from the snapshot
        run: node mobile/e2e/db/bootstrap.mjs

      - name: Fidelity — the copy must produce the same snapshot as production
        env:
          SNAPSHOT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SNAPSHOT_SAME_MAJOR: '1'
        run: node mobile/scripts/schema-snapshot.mjs --check

      # Every pending migration (not in mobile/supabase/APPLIED.txt) is applied,
      # undone and applied again, and the schema must match each way; the run
      # first proves it catches an undo that leaves something behind. The rules
      # below are then asked of production as it will be.
      - name: The undo is proven able to fail
        run: node mobile/e2e/db/up-down-up.mjs --self-test
      - name: Every pending migration, up, down and up again
        run: node mobile/e2e/db/up-down-up.mjs

      # Supabase's advisers (its database linter, the dashboard's Security and
      # Performance Advisors) on production as it will be. Every finding must be
      # on mobile/e2e/db/advisers-allowlist.json, and every entry there must still
      # fire. The repository is public, so only each lint's name and counts are
      # printed; the findings themselves come from a local run with --details.
      # The run first proves a table planted without row security is found and
      # refused.
      - name: The advisers are proven able to fail
        run: node mobile/e2e/db/advisers.mjs --self-test
      - name: Supabase's advisers, on production as it will be
        run: node mobile/e2e/db/advisers.mjs

      # The builds already in members' hands (mobile/e2e/old-clients.json), each
      # checked out at its own commit and held by its own tests to the schema
      # just made: a change that breaks a shipped build fails here, not on a phone.
      - name: The clients in members' hands, against production as it will be
        env:
          SNAPSHOT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node mobile/e2e/db/old-clients.mjs

      # Every production rehearsal (mobile/supabase/diagnostics/*_rehearsal.sql),
      # on a made-up house laid down first; each rolls back, and a miss fails
      # the run. The run first proves a miss, an empty pick and a file with no
      # case each fail.
      - name: The rehearsals' verdict is proven able to fail
        run: node mobile/e2e/db/rehearsals.mjs --self-test
      - name: Every production rehearsal, on the sealed copy
        run: node mobile/e2e/db/rehearsals.mjs

      # As supabase_admin: the house is laid down with triggers off, and each case
      # is asked as anon or authenticated.
      - name: Production's row rules, asked as visitors and members
        run: |
          psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" \
            -X -q -v ON_ERROR_STOP=1 -f mobile/e2e/db/security.sql

      # Every table and view, asked by every kind of member against the written
      # table of who may do what (mobile/e2e/db/attack/matrix.json); a table or
      # view the snapshot has and the matrix lacks fails by name. The run first
      # proves a rule opened on purpose is named.
      - name: The attack matrix is proven able to fail
        run: node mobile/e2e/db/attack/attack.mjs --self-test
      - name: Every table and view, attacked by every kind of member
        run: node mobile/e2e/db/attack/attack.mjs

      # WORKLIST P0.68: each rule, gate trigger and column grant weakened in turn on
      # the same copy; every try asked again; one that changes no answer fails the
      # night unless matrix.json's mutantsJudged says why it changes nothing.
      - name: Every rule weakened in turn, and each weakening noticed
        if: ${{ inputs.mutants }}
        timeout-minutes: 40
        run: node mobile/e2e/db/attack/attack.mjs --mutants

  # The app's own questions (src/services/__tests__/*.contract.test.ts: an embed
  # resolves, a visitor may read the columns the app asks for) asked of
  # production's shape, as it will be after the pending migrations, through the
  # same API the app calls. A push never asks production itself: that is
  # nightly.yml's, once a night (P0.37). scripts/contracts-ran.cjs says no to a
  # run whose contracts skipped themselves.
  contracts:
    name: The app's questions, asked of production's shape through its API
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # Downloaded at run time: tried once more (see the job above).
      - name: Supabase CLI
        id: supabase-cli
        timeout-minutes: 5
        continue-on-error: true
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Supabase CLI, once more
        if: steps.supabase-cli.outcome == 'failure'
        timeout-minutes: 5
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Postgres 18 client tools
        id: install-2
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Postgres 18 client tools, once more
        if: steps.install-2.outcome == 'failure'
        timeout-minutes: 5
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Install the app's packages
        id: install-3
        timeout-minutes: 5
        continue-on-error: true
        working-directory: mobile
        run: npm ci
      - name: Install the app's packages, once more
        if: steps.install-3.outcome == 'failure'
        timeout-minutes: 5
        working-directory: mobile
        run: npm ci

      # The database and the API in front of it (kong, PostgREST), as the app reaches them.
      - name: Start the local database and its API
        run: |
          cp -r supabase/functions/sign-in-with-username mobile/e2e/supabase/functions/
          bash mobile/e2e/start-stack.sh studio,imgproxy,logflare,vector,supavisor,postgres-meta,gotrue,storage-api,edge-runtime,mailpit "The contracts' database"

      - name: Seal it — production's host goes nowhere
        run: bash mobile/e2e/db/seal.sh "Contracts seal"

      - name: Build production's shape from the snapshot
        run: node mobile/e2e/db/bootstrap.mjs

      - name: Every pending migration, applied
        run: node mobile/e2e/db/up-down-up.mjs

      # PostgREST read its schema before the snapshot was built: it reads it again.
      - name: The API reads the schema it now serves
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -c "NOTIFY pgrst, 'reload schema'"
          sleep 3

      - name: The app's questions, asked as the app asks them
        working-directory: mobile
        run: |
          key=$(node e2e/anon-key.mjs) || { echo "$key"; exit 1; }
          set +e
          CONTRACT_SUPABASE_URL=http://127.0.0.1:54321 CONTRACT_SUPABASE_ANON_KEY="$key" \
            npx jest --ci --testPathPattern '\.contract\.test\.tsx?$' --json --outputFile=contracts.json > contracts-output.txt 2>&1
          rc=$?
          tail -n 30 contracts-output.txt
          node scripts/contracts-ran.cjs contracts.json || exit 1
          exit $rc
