name: 🎞️ Shipped clients, end to end
# A run the wake task started is named for the time it carries; any other keeps GitHub's own name.
run-name: "${{ inputs.wake_night && format('Carried by the wake task: {0}', inputs.wake_night) || '' }}"

# ── THE BUILDS ALREADY IN MEMBERS' HANDS, AGAINST PRODUCTION AS IT WILL BE ──────
# Each client mobile/e2e/old-clients.json marks as checked runs the whole Sealed
# E2E (e2e.yml): its own app, from its own commit with only its recorded
# patches, over the harness of the run, on a database with every pending
# migration applied. Nightly, and on every push that changes a migration or an
# edge function, so no train reaches production unless the shipped builds pass
# (mobile/supabase/diagnostics/train.cjs refuses until this run is green on its files).

on:
  schedule:
    - cron: '37 2 * * *'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'mobile/supabase/migrations/**'
      - 'mobile/supabase/migrations-down/**'
      - 'supabase/functions/**'
      - 'mobile/supabase/functions/**'
      - 'mobile/e2e/old-clients.json'
      - 'mobile/e2e/old-clients.cjs'
      - 'mobile/e2e/old-client-tree.mjs'
  workflow_dispatch:
    inputs:
      # A run the wake task (mobile/scripts/wake.mjs) starts for a time GitHub skipped: that time, as
      # 2026-11-21T03:17Z. Empty in every other run.
      wake_night:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  # What e2e.yml asks of its callers: the lifecycle run reads the shipped-clients run's app.
  actions: read

jobs:
  testflight-build-41:
    name: TestFlight build 41
    uses: ./.github/workflows/e2e.yml
    with:
      client: TestFlight build 41

  # The schedule's heartbeat (WORKLIST P0.38): GitHub stops a schedule after 60 days without
  # activity and says nothing; a monitor outside GitHub (register/alert-rules.json) emails the
  # owner when this check-in is late. Only this workflow's own schedule: a run another workflow
  # calls it from has that workflow's. A run the wake task started for a time GitHub skipped
  # (mobile/scripts/wake.mjs) is that time's run, once the time is checked as one of this schedule's.
  heartbeat:
    name: 💓 The schedule ran
    if: (github.event_name == 'schedule' && github.event.schedule == '37 2 * * *') || inputs.wake_night
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            mobile/scripts/heartbeat.mjs
            mobile/scripts/wake.mjs
            mobile/register/alert-rules.json
          sparse-checkout-cone-mode: false
      - name: The time the wake task carried, checked
        if: inputs.wake_night
        env:
          WAKE_NIGHT: ${{ inputs.wake_night }}
        run: node mobile/scripts/wake.mjs --verify e2e-old-clients.yml "$WAKE_NIGHT"
      - name: Check in
        env:
          HEARTBEAT_CHECKIN_URL: ${{ secrets.HEARTBEAT_CHECKIN_URL }}
        run: node mobile/scripts/heartbeat.mjs old-clients
