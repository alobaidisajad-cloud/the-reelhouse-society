<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 4 — Buster Status</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --ink: #0B0A08; --parchment: #EDE5D8; --sepia: #C4961A; --soot: #0E0D0A; --flicker: #F8F0C0; --blood-reel: #6B1A0A; --ash: #2A2118; --bone: #C8B99A; --fog: #6B6055; }
body { width: 1080px; height: 1080px; overflow: hidden; background: var(--ink); font-family: 'Courier Prime', monospace; }
.canvas { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: linear-gradient(155deg, #1a150e 0%, #0B0A08 35%, #12100b 60%, #0B0A08 100%); }
.grain { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0.05; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-repeat: repeat; background-size: 156px 156px; }
.vignette { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse 85% 80% at center, transparent 35%, rgba(0,0,0,0.35) 65%, rgba(0,0,0,0.8) 100%); }
.scanlines { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px); }
.aged-border { position: absolute; inset: 24px; z-index: 5; border: 1px solid rgba(200, 185, 154, 0.12); pointer-events: none; }
.aged-border::before { content: ''; position: absolute; inset: 8px; border: 1px solid rgba(200, 185, 154, 0.06); }
.corner { position: absolute; width: 35px; height: 35px; z-index: 6; pointer-events: none; opacity: 0.35; }
.corner.tl { top: 20px; left: 20px; border-top: 2px solid var(--sepia); border-left: 2px solid var(--sepia); }
.corner.tr { top: 20px; right: 20px; border-top: 2px solid var(--sepia); border-right: 2px solid var(--sepia); }
.corner.bl { bottom: 20px; left: 20px; border-bottom: 2px solid var(--sepia); border-left: 2px solid var(--sepia); }
.corner.br { bottom: 20px; right: 20px; border-bottom: 2px solid var(--sepia); border-right: 2px solid var(--sepia); }
.content { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 80px; text-align: center; }
.stamp-small { position: absolute; top: 50px; right: 50px; font-family: 'Special Elite', cursive; font-size: 14px; letter-spacing: 0.1em; color: var(--blood-reel); border: 1px solid var(--blood-reel); padding: 5px 12px; transform: rotate(4deg); opacity: 0.6; z-index: 15; }
.photo-frame { background: var(--ink); border: 2px solid rgba(196, 150, 26, 0.3); padding: 40px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; position: relative; overflow: hidden; width: 600px; margin-bottom: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
.memo-box { width: 700px; padding: 50px; background: rgba(14, 13, 10, 0.7); border: 1px solid rgba(196, 150, 26, 0.2); border-left: 4px solid var(--sepia); text-align: left; }
.body-text { font-family: 'Courier Prime', monospace; font-size: 26px; color: var(--bone); line-height: 1.7; margin-bottom: 25px; }
.body-text:last-child { margin-bottom: 0; }
.fade-text { color: var(--fog); }
</style>
</head>
<body>
<div class="canvas">
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="aged-border"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="content">
    <div class="stamp-small">CONFIDENTIAL</div>

    <div class="photo-frame">
      <div style="font-family: 'Courier Prime', monospace; color: var(--sepia); font-size: 18px; margin-bottom: 20px;">> COMPILE REELHOUSE_NATIVE.APK...</div>
      <div style="width: 100%; height: 20px; border: 1px solid var(--sepia); position: relative; margin-bottom: 10px;">
        <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 34%; background: var(--sepia); opacity: 0.8;"></div>
      </div>
      <div style="font-family: 'Courier Prime', monospace; color: var(--fog); font-size: 14px;">> STATUS: 34% (Buster's shift: Hour 2,847)</div>

      <svg viewBox="0 0 100 140" width="120" height="auto" style="position: absolute; bottom: -20px; right: 20px; transform: rotate(-10deg); opacity: 0.8;" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10 55 Q 10 10 50 10 Q 90 10 90 55 L 90 100 Q 82 90 74 100 Q 66 110 58 100 Q 50 90 42 100 Q 34 110 26 100 Q 18 90 10 100 Z" fill="#E8DFC8" opacity="0.92"/>
        <path d="M 10 55 Q 10 10 50 10 Q 90 10 90 55 L 90 100 Q 82 90 74 100 Q 66 110 58 100 Q 50 90 42 100 Q 34 110 26 100 Q 18 90 10 100 Z" fill="none" stroke="rgba(242,232,160,0.15)" stroke-width="3"/>
        <ellipse cx="38" cy="52" rx="6" ry="7" fill="#0A0703"/>
        <ellipse cx="62" cy="52" rx="6" ry="7" fill="#0A0703"/>
        <circle cx="40" cy="50" r="2" fill="white"/>
        <circle cx="64" cy="50" r="2" fill="white"/>
        <path d="M 34 68 Q 50 80 66 68" stroke="#0A0703" stroke-width="2.5" fill="none"/>
        <rect x="40" y="68" width="4" height="5" fill="#0A0703" rx="0.5"/>
        <rect x="46" y="69" width="4" height="6" fill="#0A0703" rx="0.5"/>
        <rect x="52" y="68" width="4" height="5" fill="#0A0703" rx="0.5"/>
        <rect x="58" y="67" width="3" height="4" fill="#0A0703" rx="0.5"/>
      </svg>

      <div style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(196, 150, 26, 0.05) 2px, rgba(196, 150, 26, 0.05) 4px);"></div>
    </div>

    <div class="memo-box">
      <p class="body-text">Buster is building the native app alone.</p>
      <p class="body-text">It is difficult to write code without physical hands. He is managing.</p>
      <p class="body-text"><span class="fade-text">The web beta is live. The app is next.</span></p>
    </div>
  </div>
</div>
</body>
</html>
